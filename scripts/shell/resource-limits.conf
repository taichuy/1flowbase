# 1flowbase local resource profile: 24 GB RAM / 16 vCPU development VM.
PROFILE_MODE=limited
#为桌面/用户会话保留 2 GiB 的低水位保护，不是最大内存限制
SESSION_MEMORY_LOW=2G
# 桌面/终端 app.slice 不参与 oomd 自动终止；只监控 dev-rust.slice 的持续压力。
# 60% 是 PSI 内存压力阈值，不是物理内存占用率。
RUST_OOM_PRESSURE_LIMIT=60%
RUST_OOM_PRESSURE_DURATION=30s

# 父组和前端不再限制内存；只对所有 Rust 编译合计设置预算。
DEV_MEMORY_HIGH=infinity
DEV_MEMORY_MAX=infinity
DEV_MEMORY_SWAP_MAX=infinity
DEV_CPU_QUOTA=1200%
FRONTEND_MEMORY_HIGH=infinity
FRONTEND_MEMORY_MAX=infinity

# Rust 编译子组
# 超过后开始回收/节流
RUST_MEMORY_HIGH=16G
# 编译组聚合硬上限；为桌面及其他工具留出物理内存余量
RUST_MEMORY_MAX=18G
# 限制编译换页量，避免长时间拖慢桌面
RUST_MEMORY_SWAP_MAX=1G
# CPU 总预算由 dev.slice 控制，Rust 子组不重复限额
RUST_CPU_QUOTA=''
RUST_IO_WEIGHT=10
# 显式设置更低值时保留
CARGO_MAX_JOBS=2
# 1flowbase 的仓库验证命令采用 2 个编译 job，减少并发内存峰值
PROJECT_CARGO_JOBS=2
# 测试线程与当前受限环境保持一致
PROJECT_CARGO_TEST_THREADS=2
# 是否启用 Rust 增量编译
PROJECT_CARGO_INCREMENTAL=true
