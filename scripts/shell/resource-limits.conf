# Portable local verification budget: at most 60% of available CPU (one on
# single-core hosts) and at most 8 GiB of effective memory.
PROFILE_MODE=limited
# 桌面/用户会话低水位保护：自动取 2 GiB 与有效内存 25% 的较小值。
SESSION_MEMORY_LOW=auto
# 桌面/终端 app.slice 不参与 oomd 自动终止；只监控 dev-rust.slice 的持续压力。
# 60% 是 PSI 内存压力阈值，不是物理内存占用率。
RUST_OOM_PRESSURE_LIMIT=60%
RUST_OOM_PRESSURE_DURATION=30s

# 聚合限制覆盖全部本地 Rust 和前端验证子组。
DEV_MEMORY_HIGH=auto
DEV_MEMORY_MAX=auto
DEV_MEMORY_SWAP_MAX=1G
DEV_CPU_QUOTA=auto
FRONTEND_MEMORY_HIGH=auto
FRONTEND_MEMORY_MAX=auto

# Rust 编译子组
# 自动取硬上限的 90%，超过后开始回收/节流。
RUST_MEMORY_HIGH=auto
# 聚合硬上限：8 GiB 与有效容量的较小值。
RUST_MEMORY_MAX=auto
# 限制编译换页量，避免长时间拖慢桌面
RUST_MEMORY_SWAP_MAX=1G
# 所有 Rust worktree 合计取 60% 的可用 CPU，最少 1 核。
RUST_CPU_QUOTA=auto
RUST_IO_WEIGHT=10
# 单次 Cargo 默认使用本地 CPU 预算；显式设置更低值时保留。
CARGO_MAX_JOBS=auto
# 日常启动、验证与预热采用相同的本地并行预算。
PROJECT_CARGO_JOBS=auto
PROJECT_CARGO_TEST_THREADS=auto
# 是否启用 Rust 增量编译
PROJECT_CARGO_INCREMENTAL=true
