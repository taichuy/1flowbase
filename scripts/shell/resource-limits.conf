# 1flowbase local resource profile: current constrained setup.
PROFILE_MODE=limited
#为桌面/用户会话保留 2 GiB 的低水位保护，不是最大内存限制
SESSION_MEMORY_LOW=2G
# app.slice：普通桌面应用的 systemd-oomd 内存压力保护。
# 40% 是内存压力（PSI）阈值，不是物理内存使用率；压力持续 10 秒后，
# systemd-oomd 才会把该 slice 视为可回收对象并选择其中的进程终止。
APP_OOM_PRESSURE_LIMIT=80%
APP_OOM_PRESSURE_DURATION=30s
# dev.slice：通过 ~/.local/bin/dev-run 启动的开发进程采用相同策略。
# 它与 app.slice 分开统计，避免开发任务产生的持续内存压力拖慢桌面会话。
DEV_OOM_PRESSURE_LIMIT=80%
DEV_OOM_PRESSURE_DURATION=30s

# Rust 编译 slice 
# 超过后开始回收/节流
RUST_MEMORY_HIGH=10G
# 硬上限
RUST_MEMORY_MAX=14G
# Rust 编译最多使用 3 GiB swap
RUST_MEMORY_SWAP_MAX=3G
# 显式设置更低值时保留
CARGO_MAX_JOBS=16
# 1flowbase 的仓库验证命令目前实际采用 2 个编译 job
PROJECT_CARGO_JOBS=8
# 四个线程
PROJECT_CARGO_TEST_THREADS=6
# 是否复用测试
PROJECT_CARGO_INCREMENTAL=true
