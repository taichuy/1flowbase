# 1flowbase local resource profile: 16 GB RAM / 6 vCPU development VM.
PROFILE_MODE=limited
#为桌面/用户会话保留 2 GiB 的低水位保护，不是最大内存限制
SESSION_MEMORY_LOW=2G
# app.slice：普通桌面应用的 systemd-oomd 内存压力保护。
# 80% 是内存压力（PSI）阈值，不是物理内存使用率；压力持续 30 秒后，
# systemd-oomd 才会把该 slice 视为可回收对象并选择其中的进程终止。
APP_OOM_PRESSURE_LIMIT=80%
APP_OOM_PRESSURE_DURATION=30s
# dev.slice：通过 ~/.local/bin/dev-run 启动的开发进程采用相同策略。
# 它与 app.slice 分开统计，避免开发任务产生的持续内存压力拖慢桌面会话。
DEV_OOM_PRESSURE_LIMIT=60%
DEV_OOM_PRESSURE_DURATION=30s

# Rust 编译 slice 
# 16 GB 虚拟机：让已观察到的约 5 GiB 编译工作集低于回收阈值
# 超过后开始回收/节流
RUST_MEMORY_HIGH=9G
# 编译组聚合硬上限；为桌面及其他工具留出物理内存余量
RUST_MEMORY_MAX=11G
# 限制编译换页量，避免长时间拖慢桌面
RUST_MEMORY_SWAP_MAX=1G
# 六核虚拟机最多使用五个逻辑核的 CPU 时间；不限制构建总时长
RUST_CPU_QUOTA=500%
RUST_IO_WEIGHT=10
# 显式设置更低值时保留
CARGO_MAX_JOBS=2
# 1flowbase 的仓库验证命令采用 2 个编译 job，减少并发内存峰值
PROJECT_CARGO_JOBS=2
# 测试线程与当前受限环境保持一致
PROJECT_CARGO_TEST_THREADS=2
# 是否启用 Rust 增量编译
PROJECT_CARGO_INCREMENTAL=true
