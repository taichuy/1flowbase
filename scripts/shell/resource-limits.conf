# Portable Rust budgets: normally half the available CPU/memory, targeting
# at least 4 CPUs / 8 GiB where effective capacity permits.
PROFILE_MODE=limited
# 桌面/用户会话低水位保护：自动取 2 GiB 与有效内存 25% 的较小值。
SESSION_MEMORY_LOW=auto
# 桌面/终端 app.slice 不参与 oomd 自动终止；只监控 dev-rust.slice 的持续压力。
# 60% 是 PSI 内存压力阈值，不是物理内存占用率。
RUST_OOM_PRESSURE_LIMIT=60%
RUST_OOM_PRESSURE_DURATION=30s

# 父组和前端不再限制内存；只对所有 Rust 编译合计设置预算。
DEV_MEMORY_HIGH=infinity
DEV_MEMORY_MAX=infinity
DEV_MEMORY_SWAP_MAX=infinity
# 父组不限制 CPU，前端不共享 Rust 的预算。
DEV_CPU_QUOTA=infinity
FRONTEND_MEMORY_HIGH=infinity
FRONTEND_MEMORY_MAX=infinity

# Rust 编译子组
# 自动取硬上限的 90%，超过后开始回收/节流。
RUST_MEMORY_HIGH=auto
# 聚合硬上限：半机或 8 GiB 的较大值，不超过物理/容器有效容量。
RUST_MEMORY_MAX=auto
# 限制编译换页量，避免长时间拖慢桌面
RUST_MEMORY_SWAP_MAX=1G
# 所有 Rust worktree 合计取半数可用 CPU，目标最少 4，不超过实际容量。
RUST_CPU_QUOTA=auto
RUST_IO_WEIGHT=10
# 单次 Cargo 默认使用半机/至少 4 CPU 策略；显式设置更低值时保留。
CARGO_MAX_JOBS=auto
# 日常启动、验证与预热采用相同的半机并行预算。
PROJECT_CARGO_JOBS=auto
PROJECT_CARGO_TEST_THREADS=auto
# 是否启用 Rust 增量编译
PROJECT_CARGO_INCREMENTAL=true
