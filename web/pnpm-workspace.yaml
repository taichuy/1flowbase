packages:
  - app
  - packages/*

allowBuilds:
  esbuild: true
  vue-demi: true

overrides:
  # Resolve every consumer of these patched dependencies to the same build.
  '@rc-component/motion': 1.4.0
  '@rc-component/util': 1.14.1
  'antd>@ant-design/icons': 6.3.4
  dompurify: 3.4.16
  fast-uri: 3.1.2
  glob: 10.5.0
  'i18next>typescript': '*'
  mermaid: 11.16.1
  nanoid: 5.1.16
  postcss: 8.5.25
  protobufjs: 7.5.5
  'react-i18next>typescript': '*'
  seroval: 1.5.3
  shell-quote: 1.10.0
  ws: 8.21.2

patchedDependencies:
  antd@6.7.1: patches/antd@6.7.1.patch
  '@ant-design/icons@6.3.4': patches/@ant-design__icons@6.3.4.patch
  '@ant-design/happy-work-theme@2.0.0': patches/@ant-design__happy-work-theme@2.0.0.patch
  '@rc-component/dialog@1.10.0': patches/@rc-component__dialog@1.10.0.patch
  '@rc-component/drawer@1.4.2': patches/@rc-component__drawer@1.4.2.patch
  '@rc-component/motion@1.4.0': patches/@rc-component__motion@1.4.0.patch
  '@rc-component/util@1.14.1': patches/@rc-component__util@1.14.1.patch
  react-grid-layout@2.2.3: patches/react-grid-layout@2.2.3.patch
