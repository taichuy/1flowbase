map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Preserve HTTPS when a TLS ingress (for example Cloudflare) terminates TLS.
map $http_x_forwarded_proto $mcp_public_scheme {
  default $scheme;
  https https;
}

# Conservative presentation selection only. Credentials always take the original
# guarded document; even the credential-free motion document still checks the session.
# Only a plain navigation qualifies; callbacks, selected entries and unknown
# query parameters keep the guarded route and its original state handling.
map "$args:$http_cookie:$http_authorization" $sign_in_document {
  "::" /sign-in-preload.html;
  default /index.html;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 100m;

  # MCP OAuth discovery must reach the API, not the SPA fallback.
  location ^~ /.well-known/oauth- {
    proxy_pass http://api:7800;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $mcp_public_scheme;
    proxy_buffering off;
  }

  location ^~ /.well-known/openid-configuration {
    proxy_pass http://api:7800;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $mcp_public_scheme;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://api:7800;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mcp_public_scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /v1/ {
    proxy_pass http://api:7800;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mcp_public_scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /health {
    proxy_pass http://api:7800/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /openapi.json {
    proxy_pass http://api:7800/openapi.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /external-npm/manifest.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  location /external-npm/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location /external-npm/ {
    try_files $uri =404;
  }

  # Editor declaration resources are content-addressed, not SPA documents.
  location ~ "^/assets/native-declarations/[a-f0-9]{64}\.json$" {
    try_files $uri =404;
    # Declaration JSON is text; keep its wire cost proportional to compressed code.
    gzip on;
    gzip_types application/json;
    gzip_vary on;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Vite content-addressed files can survive visits and releases. Never cache a miss.
  location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css|woff2?|wasm)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /sign-in {
    try_files $sign_in_document /index.html;
    add_header Cache-Control "private, no-store" always;
    add_header Vary "Cookie, Authorization" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
