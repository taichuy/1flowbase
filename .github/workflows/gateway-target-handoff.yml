name: Root2691 frozen candidate positive gaps

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root2691-positive-gaps
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
  CANDIDATE_SHA: 9cf059b9635ebbb1e117bb503672cf032d5c3c7b
  QA_CI_OUT: ${{ github.workspace }}/qa-ci-artifacts
  QA_CI_INPUT: executor/.github/qa/gateway-connection-reliability-20261028

jobs:
  positive-gaps:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'dev' && github.ref_name != 'main' && github.ref_name != 'master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: gateway2691-ci-fixture
          POSTGRES_DB: qadb_gateway2691_positive
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d qadb_gateway2691_positive"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Initialize public-only evidence
        shell: bash
        run: |
          mkdir -p "$QA_CI_OUT"
          python3 - <<'PY'
          import json, os, pathlib, platform
          out = pathlib.Path(os.environ['QA_CI_OUT'])
          receipt = {key: os.environ.get(key) for key in ['GITHUB_SHA', 'GITHUB_REF', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH', 'ImageOS', 'ImageVersion']}
          receipt['platform'] = platform.platform()
          receipt['candidate_sha'] = os.environ['CANDIDATE_SHA']
          receipt['stage'] = 'positive-gaps-only; no deployment or full Root verdict'
          (out / 'bootstrap.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Checkout execution branch separately
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false
      - name: Checkout immutable product candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: candidate/web/.nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: gateway2691-positive-r2
          workspaces: candidate/api -> target
          cache-targets: false
          cache-on-failure: true
      - name: Build and execute only frozen positive gaps
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        shell: bash
        run: >-
          python3 "$QA_CI_INPUT/runner.py" run
          --candidate "$GITHUB_WORKSPACE/candidate"
          --executor "$GITHUB_WORKSPACE/executor"
          --output "$QA_CI_OUT"
          --manifest "$QA_CI_INPUT/manifest.json"
      - name: Always retain available binaries and receipts
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        if: always()
        shell: bash
        run: |
          if test -f "$QA_CI_INPUT/runner.py"; then
            python3 "$QA_CI_INPUT/runner.py" finalize \
              --candidate "$GITHUB_WORKSPACE/candidate" \
              --executor "$GITHUB_WORKSPACE/executor" \
              --output "$QA_CI_OUT" \
              --manifest "$QA_CI_INPUT/manifest.json"
          else
            printf '%s\n' 'Executor checkout unavailable; bootstrap only; no tests claimed.' > "$QA_CI_OUT/executor-unavailable.txt"
          fi
      - name: Upload all public synthetic-fixture evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: root2691-positive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QA_CI_OUT }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
