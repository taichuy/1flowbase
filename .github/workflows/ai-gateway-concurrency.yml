name: Gateway80b8ec Minimal Protocol Recovery Gate
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gateway-fixed-functional-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENAI_API_KEY: ''
  OPENAI_BASE_URL: ''
  ANTHROPIC_API_KEY: ''
  ANTHROPIC_AUTH_TOKEN: ''
  ANTHROPIC_BASE_URL: ''
  CLAUDE_CODE_OAUTH_TOKEN: ''
jobs:
  fixed-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1flowbase
          POSTGRES_DB: 1flowbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d 1flowbase"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout frozen8ec runtime source only
        uses: actions/checkout@v5
        with:
          ref: 8ec70687f4b2ec74e79f69bef0e15fe3f12aae7d
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout isolated functional controls
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tmp/experiment-control
          sparse-checkout: scripts/node/ai-gateway-concurrency
          persist-credentials: false
      - name: Setup Node24 without Cargo build
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Prove exact frozen source and parent
        run: node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/duplicate-lock/source-proof.js --source-only
      - name: Download existing immutable80b8ec releases and identical providers
        uses: actions/download-artifact@v8
        with:
          name: gateway-duplicate-run-lock-build-36967545246
          run-id: 36967545246
          github-token: ${{ github.token }}
          path: tmp/reused-release
      - name: Configure only owned CI backup tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/postgresql-18-tools"
          mkdir -p "$tools_dir"
          for tool in pg_dump pg_restore; do
            sed "s/__TOOL__/$tool/g" > "$tools_dir/$tool" <<'SCRIPT'
          #!/bin/sh
          exec docker run --pull=never --rm -i --network host --env PGPASSWORD postgres:18.4 __TOOL__ "$@"
          SCRIPT
            chmod +x "$tools_dir/$tool"
          done
          echo "API_POSTGRES_PG_DUMP_PATH=$tools_dir/pg_dump" >> "$GITHUB_ENV"
          echo "API_POSTGRES_PG_RESTORE_PATH=$tools_dir/pg_restore" >> "$GITHUB_ENV"
      - name: Validate counter and protocol negative oracles
        run: |
          set -euo pipefail
          node --test tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/duplicate-lock/_tests/whole-counter.test.js tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/functional/_tests/protocol-checks.test.js tmp/experiment-control/scripts/node/ai-gateway-concurrency/responses-websocket-acceptance/_tests/error-matrix.test.js
      - name: Execute real cancel disconnect WS-to-SSE and tool full-history recovery
        run: node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/functional/run.js
        timeout-minutes: 15
      - name: Preserve all functional positive and negative evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-fixed-functional-raw-${{ github.run_id }}
          path: tmp/test-governance/gateway-fixed-functional
          if-no-files-found: warn
          retention-days: 14
