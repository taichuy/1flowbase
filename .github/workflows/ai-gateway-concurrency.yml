name: AI Gateway Protocol Conformance Gate

on:
  workflow_call:
    inputs:
      target_ref:
        description: Candidate branch, tag, or SHA to validate
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      target_ref:
        description: Frozen product SHA to validate with its original source workflow
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ai-gateway-protocol-conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: '0'
  OPENAI_API_KEY: ''
  OPENAI_BASE_URL: ''
  ANTHROPIC_API_KEY: ''
  ANTHROPIC_AUTH_TOKEN: ''
  ANTHROPIC_BASE_URL: ''
  CLAUDE_CODE_OAUTH_TOKEN: ''

jobs:
  protocol-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1flowbase
          POSTGRES_DB: 1flowbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d 1flowbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref || github.sha }}
          fetch-depth: 1

      - name: Resolve candidate source SHA
        id: candidate_source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The candidate's paired-source lock is the single source of truth for the
      # official provider revision. Hardcoding a ref here made cross-ref runs
      # (workflow file from main, candidate from another branch) pair a stale
      # official source with the candidate's fixtures.
      - name: Resolve paired official provider revision
        id: paired_official
        shell: bash
        run: >-
          echo "revision=$(node -p
          "require('./scripts/node/ai-gateway-concurrency/workflow-contract/paired-source.lock.json').official_plugins.revision")"
          >> "$GITHUB_OUTPUT"

      - name: Checkout paired official provider source
        uses: actions/checkout@v6
        with:
          repository: taichuy/1flowbase-official-plugins
          ref: ${{ steps.paired_official.outputs.revision }}
          path: tmp/ai-gateway-concurrency/official-source
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Resolve PostgreSQL 18 backup toolchain
        shell: bash
        run: |
          set -o pipefail
          node scripts/node/postgres-toolchain/cli.js \
            | grep -E '^API_POSTGRES_PG_(DUMP|RESTORE)_PATH=' \
            >> "$GITHUB_ENV"

      # Cache only compiler dependency state. Gate evidence and runtime provenance
      # are still rebuilt and emitted by the repository-owned command below.
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: ai-gateway-protocol-conformance
          key: ${{ github.ref_name }}
          save-if: true
          cache-on-failure: true
          cache-workspace-crates: true
          workspaces: |
            api -> target
            tmp/ai-gateway-concurrency/official-source/runtime-extensions/@taichuy/aliyun_bailian -> target
            tmp/ai-gateway-concurrency/official-source/runtime-extensions/@taichuy/anthropic -> target
            tmp/ai-gateway-concurrency/official-source/runtime-extensions/@taichuy/deepseek -> target
            tmp/ai-gateway-concurrency/official-source/runtime-extensions/@taichuy/gemini -> target
            tmp/ai-gateway-concurrency/official-source/runtime-extensions/@taichuy/openai -> target
            tmp/ai-gateway-concurrency/official-source/runtime-extensions/@taichuy/openai_compatible -> target

      - name: Prepare PostgreSQL 18 backup clients
        shell: bash
        run: |
          tools_dir="$RUNNER_TEMP/postgresql-18-tools"
          mkdir -p "$tools_dir"
          for tool in pg_dump pg_restore; do
            sed "s/__TOOL__/$tool/g" > "$tools_dir/$tool" <<'SCRIPT'
          #!/bin/sh
          exec docker run --pull=never --rm -i --network host --env PGPASSWORD postgres:18.4 __TOOL__ "$@"
          SCRIPT
            chmod +x "$tools_dir/$tool"
          done
          echo "API_POSTGRES_PG_DUMP_PATH=$tools_dir/pg_dump" >> "$GITHUB_ENV"
          echo "API_POSTGRES_PG_RESTORE_PATH=$tools_dir/pg_restore" >> "$GITHUB_ENV"

      # Diagnostic branch only: retain the existing blocking command unchanged.
      # Both release artifacts use one runner, toolchain and target cache serially.
      - name: Checkout frozen release baseline
        uses: actions/checkout@v5
        with:
          ref: 59ff883cd772df01e29a16ab1bf68962f758bb38
          path: tmp/gateway-cpu-release-baseline
          fetch-depth: 1

      - name: Build paired release artifacts
        shell: bash
        env:
          CARGO_BUILD_JOBS: '1'
        run: |
          set -euo pipefail
          evidence_dir="$GITHUB_WORKSPACE/tmp/test-governance/gateway-cpu-release"
          mkdir -p "$evidence_dir"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/api/target"
          test "$(git rev-parse HEAD:api)" = "6b82a1cfbfee31714fac4066eef94a6d75bdf8b0"
          rustc --version > "$evidence_dir/toolchain.txt"
          cat /proc/meminfo > "$evidence_dir/runner-memory.txt"
          cargo build --manifest-path tmp/gateway-cpu-release-baseline/api/Cargo.toml \
            -p api-server --bin api-server --release --locked --jobs 1
          cp api/target/release/api-server "$evidence_dir/baseline-release-api-server"
          cargo build --manifest-path api/Cargo.toml \
            -p api-server --bin api-server --release --locked --jobs 1
          cp api/target/release/api-server "$evidence_dir/candidate-release-api-server"
          sha256sum "$evidence_dir/"*-api-server > "$evidence_dir/sha256.txt"
          printf '%s\n' 'baseline=59ff883cd772df01e29a16ab1bf68962f758bb38' \
            'candidate_product=67a78a8828d79678d53e0551f8815b20447eddc2' \
            "workflow_source=$(git rev-parse HEAD)" > "$evidence_dir/sources.txt"

      - name: Upload paired release artifacts before protocol gate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-cpu-paired-release-${{ steps.candidate_source.outputs.sha }}
          path: tmp/test-governance/gateway-cpu-release/**
          if-no-files-found: error
          retention-days: 7

      - name: Run the single blocking AI Gateway quality command
        id: protocol_conformance
        shell: bash
        run: >-
          node scripts/node/ai-gateway-concurrency/quality-gate/cli.js run
          --repo-root "$GITHUB_WORKSPACE"
          --official-source-root "$GITHUB_WORKSPACE/tmp/ai-gateway-concurrency/official-source"
          --database-url "postgres://postgres:1flowbase@127.0.0.1:5432/1flowbase"

      - name: Write aggregate-compatible AI Gateway report
        if: always()
        shell: bash
        env:
          AI_GATEWAY_COMMAND_OUTCOME: ${{ steps.protocol_conformance.outcome }}
        run: >-
          node scripts/node/ai-gateway-concurrency/quality-gate/component-report.js
          --repo-root "$GITHUB_WORKSPACE"
          --command-outcome "$AI_GATEWAY_COMMAND_OUTCOME"

      - name: Upload bounded protocol evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-governance-ai-gateway-protocol-conformance-${{ steps.candidate_source.outputs.sha }}
          path: |
            tmp/test-governance/ai-gateway-quality-gate/**
            tmp/test-governance/ai-gateway-concurrency/**
            tmp/test-governance/ai-gateway-protocol-conformance/**
          if-no-files-found: error
          retention-days: 14
