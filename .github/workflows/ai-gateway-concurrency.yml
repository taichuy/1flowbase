name: AI Gateway Protocol Conformance Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ai-gateway-protocol-conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: '0'
  OPENAI_API_KEY: ''
  OPENAI_BASE_URL: ''
  ANTHROPIC_API_KEY: ''
  ANTHROPIC_AUTH_TOKEN: ''
  ANTHROPIC_BASE_URL: ''
  CLAUDE_CODE_OAUTH_TOKEN: ''

jobs:
  protocol-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1flowbase
          POSTGRES_DB: 1flowbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d 1flowbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Checkout paired official provider source
        uses: actions/checkout@v6
        with:
          repository: taichuy/1flowbase-official-plugins
          ref: ba1a692b483c15fa67616ea882a95e6acd736a08
          path: tmp/ai-gateway-concurrency/official-source
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache only compiler dependency state. Gate evidence and runtime provenance
      # are still rebuilt and emitted by the repository-owned command below.
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: ai-gateway-protocol-conformance
          workspaces: |
            api -> target
            tmp/ai-gateway-concurrency/official-source/runtime-extensions/model-providers/anthropic -> target
            tmp/ai-gateway-concurrency/official-source/runtime-extensions/model-providers/openai -> target
            tmp/ai-gateway-concurrency/official-source/runtime-extensions/model-providers/openai_compatible -> target

      - name: Run the single blocking AI Gateway quality command
        shell: bash
        run: >-
          node scripts/node/ai-gateway-concurrency/quality-gate/cli.js run
          --repo-root "$GITHUB_WORKSPACE"
          --official-source-root "$GITHUB_WORKSPACE/tmp/ai-gateway-concurrency/official-source"
          --database-url "postgres://postgres:1flowbase@127.0.0.1:5432/1flowbase"

      - name: Upload bounded protocol evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-gateway-protocol-conformance-${{ github.sha }}
          path: |
            tmp/test-governance/ai-gateway-quality-gate/**
            tmp/test-governance/ai-gateway-concurrency/**
          if-no-files-found: error
          retention-days: 14
