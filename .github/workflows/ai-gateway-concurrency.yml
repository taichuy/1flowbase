name: Gateway Same-Value Identity Correctness and Paired Resources
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: gateway-identity-reuse-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CARGO_INCREMENTAL: '0'
  OPENAI_API_KEY: ''
  OPENAI_BASE_URL: ''
  ANTHROPIC_API_KEY: ''
  ANTHROPIC_AUTH_TOKEN: ''
  ANTHROPIC_BASE_URL: ''
  CLAUDE_CODE_OAUTH_TOKEN: ''
jobs:
  identity-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1flowbase
          POSTGRES_DB: 1flowbase
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d 1flowbase"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout exact candidate product source
        uses: actions/checkout@v5
        with:
          ref: 5a7f004b0d7ab0ab61d60c2f8cbff2f1fff77dbd
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout immutable isolated controls
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tmp/experiment-control
          sparse-checkout: scripts/node/ai-gateway-concurrency/cloud-monitor-probe
          persist-credentials: false
      - name: Setup Node24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Pure source and no-sudo counter controls
        run: |
          set -euo pipefail
          controls=tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe
          out=tmp/test-governance/gateway-identity-reuse/build
          mkdir -p "$out"
          node --test "$controls/identity-reuse/_tests/"*.test.js "$controls/_tests/"*.test.js "$controls/duplicate-lock/_tests/"*.test.js "$controls/lock-scope/_tests/"*.test.js > "$out/pure-node-tests.log" 2>&1
          python3 "$controls/_tests/sampler.test.py" > "$out/pure-sampler-tests.log" 2>&1
          node --check "$controls/identity-reuse/run.js"
          node --check "$controls/identity-reuse/prepare-provider.js"
          bash -n "$controls/identity-reuse/ci-gates.sh"
      - name: Setup exact Rust toolchain on Actions only
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Restore existing compiler dependency cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: ai-gateway-protocol-conformance
          key: codex/gateway-cpu-ci-20261001
          save-if: false
          workspaces: api -> target
      - name: Configure only owned ephemeral PostgreSQL SQL statistics and backup clients
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter publish=5432 --format '{{.ID}}')"
          test -n "$pg_container"
          docker exec "$pg_container" psql -U postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements'"
          docker restart "$pg_container"
          for attempt in $(seq 1 30);do
            if docker exec "$pg_container" pg_isready -U postgres -d 1flowbase;then break;fi
            sleep 1
          done
          tools_dir="$RUNNER_TEMP/postgresql-18-tools"
          mkdir -p "$tools_dir"
          for tool in pg_dump pg_restore;do
            sed "s/__TOOL__/$tool/g" > "$tools_dir/$tool" <<'SCRIPT'
          #!/bin/sh
          exec docker run --pull=never --rm -i --network host --env PGPASSWORD postgres:18.4 __TOOL__ "$@"
          SCRIPT
            chmod +x "$tools_dir/$tool"
          done
          echo "API_POSTGRES_PG_DUMP_PATH=$tools_dir/pg_dump" >> "$GITHUB_ENV"
          echo "API_POSTGRES_PG_RESTORE_PATH=$tools_dir/pg_restore" >> "$GITHUB_ENV"
      - name: Verify immutable Provider artifact metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=tmp/test-governance/gateway-identity-reuse/build
          gh api repos/taichuy/1flowbase/actions/artifacts/11221429445 > "$out/provider-artifact-metadata.json"
          node -e "const a=require('./$out/provider-artifact-metadata.json');if(a.id!==11221429445||a.expired||a.workflow_run.id!==36992344470||a.digest!=='sha256:ac699d8a43379055c065e2c067218134d4f9e2341464f00dfdfb53a854720351')throw Error('immutable provider archive mismatch')"
      - name: Download immutable packages; do not use sealed old API binaries
        uses: actions/download-artifact@v8
        with:
          name: gateway-resource-safe-build-36992344470
          run-id: 36992344470
          github-token: ${{ github.token }}
          path: tmp/provider-artifact
      - name: Relevant Rust behavior gates then exact fresh baseline and candidate release builds
        timeout-minutes: 125
        env:
          API_DATABASE_URL: postgres://postgres:1flowbase@127.0.0.1:5432/1flowbase
          DATABASE_URL: postgres://postgres:1flowbase@127.0.0.1:5432/1flowbase
          BOOTSTRAP_ROOT_ACCOUNT: root
          BOOTSTRAP_ROOT_PASSWORD: change-me
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          controls=tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/identity-reuse
          node "$controls/prepare-provider.js"
          bash "$controls/ci-gates.sh" "$controls"
      - name: Fixed source C8 ABBA twice; ordinary identity counters only
        timeout-minutes: 20
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/identity-reuse/run.js
      - name: Upload every successful or failed synthetic result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-identity-reuse-raw-${{ github.run_id }}
          path: |
            tmp/test-governance/gateway-identity-reuse/manifest.json
            tmp/test-governance/gateway-identity-reuse/summary.json
            tmp/test-governance/gateway-identity-reuse/C*/**
          retention-days: 14
          if-no-files-found: warn
      - name: Upload gates, provenance and paired release build receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-identity-reuse-build-${{ github.run_id }}
          path: |
            tmp/test-governance/gateway-identity-reuse/build/**
            tmp/protocol-reuse/**
          retention-days: 7
          if-no-files-found: warn
