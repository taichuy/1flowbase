name: Gateway Safe Head Correctness and Paired Resources
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: gateway-resource-safe-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CARGO_INCREMENTAL: '0'
  OPENAI_API_KEY: ''
  OPENAI_BASE_URL: ''
  ANTHROPIC_API_KEY: ''
  ANTHROPIC_AUTH_TOKEN: ''
  ANTHROPIC_BASE_URL: ''
  CLAUDE_CODE_OAUTH_TOKEN: ''
jobs:
  paired-safe-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1flowbase
          POSTGRES_DB: 1flowbase
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d 1flowbase" --health-interval 5s --health-timeout 5s --health-retries
          12
    steps:
    - name: Checkout exact frozen candidate
      uses: actions/checkout@v5
      with:
        ref: cac4d299495f25eccce69ac248e29653db5a8b5b
        persist-credentials: false
        fetch-depth: 0
    - name: Checkout isolated experiment controls
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        path: tmp/experiment-control
        sparse-checkout: scripts/node/ai-gateway-concurrency/cloud-monitor-probe
        persist-credentials: false
    - name: Setup Node 24
      uses: actions/setup-node@v5
      with:
        node-version: 24
    - name: Setup identical Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.98.1
    - name: Restore existing dependency cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        shared-key: ai-gateway-protocol-conformance
        key: codex/gateway-cpu-ci-20261001
        save-if: false
        workspaces: api -> target
    - name: Verify bounded synthetic controls
      run: 'set -euo pipefail

        controls=tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe

        node --test "$controls/_tests/metrics.test.js" "$controls/_tests/observation.test.js" "$controls/resource-safe/_tests/packet.test.js"
        "$controls/duplicate-lock/_tests/whole-counter.test.js" "$controls/lock-scope/_tests/scope-contract.test.js"

        node "$controls/resource-safe/source-proof.js" --source-only

        bash -n "$controls/resource-safe/ci-gates.sh"

        '
    - name: Configure owned CI PostgreSQL observation and backup tools
      run: "set -euo pipefail\npg_container=\"$(docker ps --filter publish=5432 --format '{{.ID}}')\"\ntest -n \"$pg_container\"\
        \ndocker exec \"$pg_container\" psql -U postgres -v ON_ERROR_STOP=1 -c \"ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements'\"\
        \ndocker restart \"$pg_container\"\nfor attempt in $(seq 1 30); do\n if docker exec \"$pg_container\" pg_isready -U\
        \ postgres -d 1flowbase; then break; fi\n sleep 1\ndone\ntools_dir=\"$RUNNER_TEMP/postgresql-18-tools\"\nmkdir -p\
        \ \"$tools_dir\"\nfor tool in pg_dump pg_restore; do\n sed \"s/__TOOL__/$tool/g\" > \"$tools_dir/$tool\" <<'SCRIPT'\n\
        #!/bin/sh\nexec docker run --pull=never --rm -i --network host --env PGPASSWORD postgres:18.4 __TOOL__ \"$@\"\nSCRIPT\n\
        \ chmod +x \"$tools_dir/$tool\"\ndone\necho \"API_POSTGRES_PG_DUMP_PATH=$tools_dir/pg_dump\" >> \"$GITHUB_ENV\"\n\
        echo \"API_POSTGRES_PG_RESTORE_PATH=$tools_dir/pg_restore\" >> \"$GITHUB_ENV\"\n"
    - name: Real safe-head PG and flow gates then fresh paired releases
      run: bash tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/resource-safe/ci-gates.sh tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/resource-safe
      env:
        API_DATABASE_URL: postgres://postgres:1flowbase@127.0.0.1:5432/1flowbase
        DATABASE_URL: postgres://postgres:1flowbase@127.0.0.1:5432/1flowbase
        BOOTSTRAP_ROOT_ACCOUNT: root
        BOOTSTRAP_ROOT_PASSWORD: change-me
        WORKFLOW_SHA: ${{ github.sha }}
      timeout-minutes: 125
    - name: Download immutable provider packages only; API binaries are freshly built
      uses: actions/download-artifact@v8
      with:
        name: gateway-duplicate-run-lock-build-36967545246
        run-id: 36967545246
        github-token: ${{ github.token }}
        path: tmp/provider-artifact
    - name: Verify locked provider hashes and isolate pair from PG gate counters
      run: 'set -euo pipefail

        node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/resource-safe/prepare-provider.js

        pg_container="$(docker ps --filter publish=5432 --format ''{{.ID}}'')"

        docker exec "$pg_container" psql -U postgres -d 1flowbase -v ON_ERROR_STOP=1 -c ''CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
        SELECT pg_stat_statements_reset();'' > tmp/test-governance/gateway-resource-safe/build/pre-series-stat-reset.txt

        '
    - name: Run finite same-runner fixed-history C1 C8 ABBA only after correctness gates
      timeout-minutes: 20
      run: node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/resource-safe/run.js
    - name: Upload all successful and failed paired raw evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: gateway-resource-safe-raw-${{ github.run_id }}
        path: 'tmp/test-governance/gateway-resource-safe/manifest.json

          tmp/test-governance/gateway-resource-safe/summary.json

          tmp/test-governance/gateway-resource-safe/C*/**'
        retention-days: 14
        if-no-files-found: warn
    - name: Upload complete positive and negative gate/build evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: gateway-resource-safe-build-${{ github.run_id }}
        path: 'tmp/test-governance/gateway-resource-safe/build/**

          tmp/protocol-reuse/**'
        retention-days: 7
        if-no-files-found: warn
