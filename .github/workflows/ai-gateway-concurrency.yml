name: Gateway legacy fixture validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gateway-legacy-fixture-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: '0'
jobs:
  legacy-provider-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1flowbase
          POSTGRES_DB: 1flowbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d 1flowbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact fixture candidate
        uses: actions/checkout@v5
        with:
          ref: fd3f017805ccb03bf55c5fd0207d18123f34fd8e
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: ai-gateway-protocol-conformance
          key: codex/gateway-replay-gc-20261010
          save-if: false
          cache-on-failure: true
          cache-workspace-crates: true
          workspaces: api -> target
      - name: Validate only the affected real PostgreSQL upgrades
        shell: bash
        env:
          DATABASE_URL: postgres://postgres:1flowbase@127.0.0.1:5432/1flowbase
          API_DATABASE_URL: postgres://postgres:1flowbase@127.0.0.1:5432/1flowbase
        run: |
          set -euo pipefail
          evidence_dir=tmp/test-governance/gateway-legacy-fixture
          mkdir -p "$evidence_dir"
          test "$(git rev-parse HEAD)" = 'fd3f017805ccb03bf55c5fd0207d18123f34fd8e'
          jobs=$(node scripts/node/testing/verify-runtime.js cargo-jobs)
          exit_code=0
          cargo test --manifest-path api/Cargo.toml --jobs "$jobs" -p storage-durable-postgres --lib model_provider_repository_backfills_ --locked > "$evidence_dir/legacy-provider-upgrades.log" 2>&1 || exit_code=$?
          tail -c 4000 "$evidence_dir/legacy-provider-upgrades.log"
          export FIXTURE_TEST_EXIT_CODE="$exit_code"
          node <<'JS'
          const fs = require('node:fs');
          const log = fs.readFileSync('tmp/test-governance/gateway-legacy-fixture/legacy-provider-upgrades.log', 'utf8');
          const result = /test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;/u.exec(log);
          const passed = Number(result?.[2] || 0);
          const failed = Number(result?.[3] || 0);
          const ignored = Number(result?.[4] || 0);
          const exitCode = Number(process.env.FIXTURE_TEST_EXIT_CODE);
          const status = exitCode === 0 && result?.[1] === 'ok' && passed === 2 && failed === 0 && ignored === 0 ? 'PASS' : 'FAIL';
          const receipt = {schema_version:'1flowbase.gateway-fixture-validation/v1', main_source_sha:'fd3f017805ccb03bf55c5fd0207d18123f34fd8e', workflow_source_sha:process.env.GITHUB_SHA, status, exit_code:exitCode, filter:'model_provider_repository_backfills_', passed, failed, ignored, postgres:'18.4', scope:'legacy-provider-fixture-only'};
          fs.writeFileSync('tmp/test-governance/gateway-legacy-fixture/receipt.json', JSON.stringify(receipt,null,2)+'
');
          console.log(JSON.stringify(receipt));
          if(status !== 'PASS') process.exitCode = 1;
          JS
      - name: Upload exact candidate fixture evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-governance-gateway-legacy-fixture-fd3f017805ccb03bf55c5fd0207d18123f34fd8e
          path: tmp/test-governance/gateway-legacy-fixture/**
