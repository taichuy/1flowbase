name: Gateway80b7f Single-variable Frame-size Experiment
permissions:
  contents: read
  actions: read
concurrency:
  group: gateway-merged-source-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: '0'
  OPENAI_API_KEY: ''
  OPENAI_BASE_URL: ''
  ANTHROPIC_API_KEY: ''
  ANTHROPIC_AUTH_TOKEN: ''
  ANTHROPIC_BASE_URL: ''
  CLAUDE_CODE_OAUTH_TOKEN: ''
jobs:
  paired-monitor-direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1flowbase
          POSTGRES_DB: 1flowbase
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d 1flowbase" --health-interval 5s --health-timeout 5s --health-retries
          12
    steps:
    - name: Checkout frozen candidate
      uses: actions/checkout@v5
      with:
        ref: 7f702cbfed9a9cc39d569ade078a9ba8cc7eac39
        persist-credentials: false
        fetch-depth: 0
    - name: Checkout frozen source-equivalent baseline80b
      uses: actions/checkout@v5
      with:
        ref: 80b4e635e1738e1e2df1a22f94dfd7a6bc9a31af
        path: tmp/paired-baseline-source
        persist-credentials: false
    - name: Checkout identical locked official providers
      uses: actions/checkout@v5
      with:
        repository: taichuy/1flowbase-official-plugins
        ref: 997c705b3c564c93d2fc49b973e0b5bbdb759cdc
        path: tmp/paired-official-source
        persist-credentials: false
    - name: Checkout isolated experiment controls
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        path: tmp/experiment-control
        sparse-checkout: scripts/node/ai-gateway-concurrency/cloud-monitor-probe
        persist-credentials: false
    - name: Setup Node 24
      uses: actions/setup-node@v5
      with:
        node-version: 24
    - name: Setup identical release toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.98.1
    - name: Restore existing dependency cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        shared-key: ai-gateway-protocol-conformance
        key: codex/gateway-cpu-ci-20261001
        save-if: false
        workspaces: |-
          api -> target
          tmp/paired-official-source/runtime-extensions/@taichuy/openai -> target
          tmp/paired-official-source/runtime-extensions/@taichuy/anthropic -> target
          tmp/paired-official-source/runtime-extensions/@taichuy/openai_compatible -> target
    - name: Prove80b baseline equivalence and independent fixed7f source
      run: node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/frame-proof.js --source-only
    - name: Download verified immutable paired release and identical provider artifact
      uses: actions/download-artifact@v8
      with:
        name: gateway-merged-paired-build-36893524316
        run-id: 36893524316
        github-token: ${{ github.token }}
        path: tmp
    - name: Verify runtime bytes and source binding; record current runner
      env:
        WORKFLOW_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/frame-proof.js
        evidence=tmp/test-governance/gateway-monitor-paired/build
        for item in runner-cpu.txt runner-memory.txt runner-quota.json sources.txt; do mv "$evidence/$item" "$evidence/reused-original-$item"; done
        lscpu > "$evidence/runner-cpu.txt"
        cat /proc/meminfo > "$evidence/runner-memory.txt"
        printf '%s\n' 'baseline_equivalent=80b4e635e1738e1e2df1a22f94dfd7a6bc9a31af baseline_compiled_from=539e335204df667552c56faf4f13b323acb7320b' 'candidate=7f702cbfed9a9cc39d569ade078a9ba8cc7eac39' "workflow=$WORKFLOW_SHA" 'reused_run=36893524316 artifact=11181109322' 'profile=release features=default' > "$evidence/sources.txt"
        python3 - <<'PYENV'
        import json,pathlib
        root=pathlib.Path('/sys/fs/cgroup');row={}
        for name in ['cpu.max','cpuset.cpus.effective','memory.max','memory.high','cpu.stat']:
         p=root/name;row[name]=p.read_text().strip() if p.exists() else 'unavailable'
        pathlib.Path('tmp/test-governance/gateway-monitor-paired/build/runner-quota.json').write_text(json.dumps(row,indent=2))
        PYENV
        cp "$evidence/binaries.json" "$evidence/original-binaries.json"
        cp "$evidence/candidate-release-api-server" "$evidence/baseline-release-api-server"
        node <<'JSREUSE'
        const fs=require('node:fs'),p='tmp/test-governance/gateway-monitor-paired/build/binaries.json';const old=JSON.parse(fs.readFileSync(p));fs.writeFileSync(p,JSON.stringify({baseline:{...old.candidate,source:'80b4e635e1738e1e2df1a22f94dfd7a6bc9a31af',compiled_from:old.candidate.source}},null,2));
        JSREUSE
    - name: Build only changed7f production API release
      run: |
        set -euo pipefail
        evidence=tmp/test-governance/gateway-monitor-paired/build
        run_logged() {
         phase="$1"; logfile="$2"; shift 2
         printf '[phase-start] %s %s\n' "$phase" "$(date -u +%FT%TZ)"
         set +e
         "$@" 2>&1 | tee "$logfile"
         command_status=("${PIPESTATUS[@]}")
         set -e
         printf '[phase-end] %s %s command_exit=%s tee_exit=%s\n' "$phase" "$(date -u +%FT%TZ)" "${command_status[0]}" "${command_status[1]}"
         if [ "${command_status[0]}" -ne 0 ]; then return "${command_status[0]}"; fi
         if [ "${command_status[1]}" -ne 0 ]; then return "${command_status[1]}"; fi
        }
        rustc --version --verbose
        cargo --version
        printf '[build-source] %s profile=release features=default RUSTFLAGS=%s\n' "$(git rev-parse HEAD)" "${RUSTFLAGS:-}"
        run_logged candidate-release "$evidence/candidate-build.log" cargo build --manifest-path api/Cargo.toml --release --locked --jobs 1 -p api-server --bin api-server
        cp api/target/release/api-server "$evidence/candidate-release-api-server"
        node <<'JSBUILD'
        const fs=require('node:fs'),crypto=require('node:crypto'),p='tmp/test-governance/gateway-monitor-paired/build/binaries.json';const b=JSON.parse(fs.readFileSync(p));b.candidate={source:'7f702cbfed9a9cc39d569ade078a9ba8cc7eac39',sha256:crypto.createHash('sha256').update(fs.readFileSync('tmp/test-governance/gateway-monitor-paired/build/candidate-release-api-server')).digest('hex')};fs.writeFileSync(p,JSON.stringify(b,null,2));
        JSBUILD
    - name: Upload immutable paired build and provider evidence before tests
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: gateway-frame-size-paired-build-${{ github.run_id }}
        path: |-
          tmp/test-governance/gateway-monitor-paired/build/**
          tmp/protocol-reuse/**
        retention-days: 7
        if-no-files-found: error
    - name: Configure only owned CI PostgreSQL observation and backup tools
      run: |
        set -euo pipefail
        pg_container="$(docker ps --filter publish=5432 --format '{{.ID}}')"
        test -n "$pg_container"
        docker exec "$pg_container" psql -U postgres -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements'"
        docker restart "$pg_container"
        for attempt in $(seq 1 30); do
          if docker exec "$pg_container" pg_isready -U postgres -d 1flowbase; then break; fi
          sleep 1
        done
        tools_dir="$RUNNER_TEMP/postgresql-18-tools"
        mkdir -p "$tools_dir"
        for tool in pg_dump pg_restore; do
          sed "s/__TOOL__/$tool/g" > "$tools_dir/$tool" <<'SCRIPT'
        #!/bin/sh
        exec docker run --pull=never --rm -i --network host --env PGPASSWORD postgres:18.4 __TOOL__ "$@"
        SCRIPT
          chmod +x "$tools_dir/$tool"
        done
        echo "API_POSTGRES_PG_DUMP_PATH=$tools_dir/pg_dump" >> "$GITHUB_ENV"
        echo "API_POSTGRES_PG_RESTORE_PATH=$tools_dir/pg_restore" >> "$GITHUB_ENV"
    - name: Validate experiment statistics contracts
      run: |
        node --test tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/_tests/*.test.js
        python3 -m unittest discover -s tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/analysis -p 'test_*.py'
    - name: Execute7f actual-module size and affected compatible-stream gates
      run: |
        set -euo pipefail
        evidence=tmp/test-governance/gateway-monitor-paired/build
        printf '[test-source] %s\n' "$(git rev-parse HEAD)"
        run_logged() {
         phase="$1"; logfile="$2"; shift 2
         printf '[phase-start] %s %s\n' "$phase" "$(date -u +%FT%TZ)"
         set +e
         "$@" 2>&1 | tee "$logfile"
         command_status=("${PIPESTATUS[@]}")
         set -e
         printf '[phase-end] %s %s command_exit=%s tee_exit=%s\n' "$phase" "$(date -u +%FT%TZ)" "${command_status[0]}" "${command_status[1]}"
         if [ "${command_status[0]}" -ne 0 ]; then return "${command_status[0]}"; fi
         if [ "${command_status[1]}" -ne 0 ]; then return "${command_status[1]}"; fi
        }
        python3 tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/test-host/prepare-pure-host.py 7f "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tmp/frame-size-test-host"
        run_logged frame-size-debug-actual-module "$evidence/frame-size-tests.log" cargo test --manifest-path tmp/frame-size-test-host/Cargo.toml --locked --jobs 1 --lib
        run_logged compatible-stream-release "$evidence/compatible-stream-tests.log" cargo test --manifest-path api/Cargo.toml --release --locked --jobs 1 -p api-server --lib compat_sse::tests -- --test-threads=1
        python3 - <<'PYTEST'
        import pathlib,re,json
        rows=[]
        for name,profile in [('frame-size-tests.log','debug actual-module host'),('compatible-stream-tests.log','release actual API')]:
         text=(pathlib.Path('tmp/test-governance/gateway-monitor-paired/build')/name).read_text()
         matches=re.findall(r'test result: ok[.] (\d+) passed; (\d+) failed',text)
         if not matches or sum(int(m[0]) for m in matches)==0:raise SystemExit('No executed passing tests: '+name)
         rows.append({'log':name,'profile':profile,'passed':sum(int(m[0]) for m in matches),'failed':sum(int(m[1]) for m in matches)})
        pathlib.Path('tmp/test-governance/gateway-monitor-paired/build/unit-counts.json').write_text(json.dumps(rows,indent=2))
        PYTEST
      env:
        API_DATABASE_URL: postgres://postgres:1flowbase@127.0.0.1:5432/1flowbase
        DATABASE_URL: postgres://postgres:1flowbase@127.0.0.1:5432/1flowbase
        BOOTSTRAP_ROOT_ACCOUNT: root
        BOOTSTRAP_ROOT_PASSWORD: change-me
    - name: Run512KiB C1/C8 primary and separate detailed observation ABBA
      run: node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/run.js
    - name: Recompute saved detailed callback and timer boundary evidence
      if: always()
      run: python3 tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/analysis/report.py tmp/test-governance/gateway-monitor-paired
    - name: Upload all positive and negative raw experiment evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: gateway-frame-size-paired-raw-${{ github.run_id }}
        path: |
          tmp/test-governance/gateway-monitor-paired/manifest.json
          tmp/test-governance/gateway-monitor-paired/summary.json
          tmp/test-governance/gateway-monitor-paired/boundary-review.json
          tmp/test-governance/gateway-monitor-paired/P*/**
          tmp/test-governance/gateway-monitor-paired/O*/**
        retention-days: 14
        if-no-files-found: warn
    - name: Upload complete final build and unit logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: gateway-frame-size-paired-final-build-${{ github.run_id }}
        path: tmp/test-governance/gateway-monitor-paired/build/**
        retention-days: 7
        if-no-files-found: warn
'on':
  workflow_dispatch: {}
