name: Gateway80b Application Lock-domain Diagnostic
permissions:
  contents: read
  actions: read
concurrency:
  group: gateway-app-lock-scope-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: '0'
  OPENAI_API_KEY: ''
  OPENAI_BASE_URL: ''
  ANTHROPIC_API_KEY: ''
  ANTHROPIC_AUTH_TOKEN: ''
  ANTHROPIC_BASE_URL: ''
  CLAUDE_CODE_OAUTH_TOKEN: ''
jobs:
  paired-monitor-direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1flowbase
          POSTGRES_DB: 1flowbase
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d 1flowbase" --health-interval 5s --health-timeout 5s --health-retries
          12
    steps:
    - name: Checkout fixed80b source
      uses: actions/checkout@v5
      with:
        ref: 80b4e635e1738e1e2df1a22f94dfd7a6bc9a31af
        persist-credentials: false
        fetch-depth: 0
    - name: Checkout identical locked official providers
      uses: actions/checkout@v5
      with:
        repository: taichuy/1flowbase-official-plugins
        ref: 997c705b3c564c93d2fc49b973e0b5bbdb759cdc
        path: tmp/paired-official-source
        persist-credentials: false
    - name: Checkout isolated experiment controls
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        path: tmp/experiment-control
        sparse-checkout: scripts/node/ai-gateway-concurrency/cloud-monitor-probe
        persist-credentials: false
    - name: Setup Node 24
      uses: actions/setup-node@v5
      with:
        node-version: 24
    - name: Setup identical release toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.98.1
      if: ${{ !inputs.observer_only }}
    - name: Prove fixed80b runtime equivalence
      run: node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/lock-scope/scope-proof.js --source-only
    - name: Download verified immutable paired release and identical provider artifact
      uses: actions/download-artifact@v8
      with:
        name: gateway-merged-paired-build-36893524316
        run-id: 36893524316
        github-token: ${{ github.token }}
        path: tmp
      if: ${{ !inputs.observer_only }}
    - name: Verify identical reused80b runtime/providers and record runner
      env:
        WORKFLOW_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/lock-scope/scope-proof.js
        evidence=tmp/test-governance/gateway-app-lock-scope/build
        lscpu > "$evidence/runner-cpu.txt"
        cat /proc/meminfo > "$evidence/runner-memory.txt"
        printf '%s\n' "workflow=$WORKFLOW_SHA" 'source=80b4e635e1738e1e2df1a22f94dfd7a6bc9a31af compiled_from=539e335204df667552c56faf4f13b323acb7320b' 'profile=release features=default pool=5' > "$evidence/sources.txt"
        python3 - <<'PYENV'
        import json,pathlib
        root=pathlib.Path('/sys/fs/cgroup');row={}
        for name in ['cpu.max','cpuset.cpus.effective','memory.max','memory.high','cpu.stat']:
         p=root/name;row[name]=p.read_text().strip() if p.exists() else 'unavailable'
        pathlib.Path('tmp/test-governance/gateway-app-lock-scope/build/runner-quota.json').write_text(json.dumps(row,indent=2))
        PYENV
      if: ${{ !inputs.observer_only }}
    - name: Upload fixed runtime proof before diagnostic
      if: ${{ always() && !inputs.observer_only }}
      uses: actions/upload-artifact@v6
      with:
        name: gateway-app-lock-scope-build-${{ github.run_id }}
        path: tmp/test-governance/gateway-app-lock-scope/build/**
        retention-days: 7
        if-no-files-found: error
    - name: Configure only owned CI PostgreSQL observation and backup tools
      run: |
        set -euo pipefail
        pg_container="$(docker ps --filter publish=5432 --format '{{.ID}}')"
        test -n "$pg_container"
        docker exec "$pg_container" psql -U postgres -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements'"
        docker restart "$pg_container"
        for attempt in $(seq 1 30); do
          if docker exec "$pg_container" pg_isready -U postgres -d 1flowbase; then break; fi
          sleep 1
        done
        tools_dir="$RUNNER_TEMP/postgresql-18-tools"
        mkdir -p "$tools_dir"
        for tool in pg_dump pg_restore; do
          sed "s/__TOOL__/$tool/g" > "$tools_dir/$tool" <<'SCRIPT'
        #!/bin/sh
        exec docker run --pull=never --rm -i --network host --env PGPASSWORD postgres:18.4 __TOOL__ "$@"
        SCRIPT
          chmod +x "$tools_dir/$tool"
        done
        echo "API_POSTGRES_PG_DUMP_PATH=$tools_dir/pg_dump" >> "$GITHUB_ENV"
        echo "API_POSTGRES_PG_RESTORE_PATH=$tools_dir/pg_restore" >> "$GITHUB_ENV"
    - name: Validate existing and new diagnostic pure contracts
      run: |
        set -euo pipefail
        node --test tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/_tests/*.test.js tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/lock-scope/_tests/*.test.js
        python3 -m unittest discover -s tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/lock-scope/_tests -p 'test_*.py'
        python3 -m py_compile tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/lock-scope/sampler.py
    - name: Smoke loaded observer query and real native blocker before workload
      run: python3 tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/lock-scope/observer_smoke.py
    - name: Run same80b same-app8 versus8-app1 C8 ABBA diagnostic
      run: node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/lock-scope/run.js
      if: ${{ !inputs.observer_only }}
    - name: Upload complete/partial lock and dedup raw
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: gateway-app-lock-scope-raw-${{ github.run_id }}
        path: |-
          tmp/test-governance/gateway-app-lock-scope/manifest.json
          tmp/test-governance/gateway-app-lock-scope/summary.json
          tmp/test-governance/gateway-app-lock-scope/A*/**
          tmp/test-governance/gateway-app-lock-scope/B*/**
          tmp/test-governance/gateway-app-lock-scope/build/scope-proof.json
          tmp/test-governance/gateway-app-lock-scope/observer-smoke/**
        retention-days: 14
        if-no-files-found: warn
'on':
  workflow_dispatch:
    inputs:
      observer_only:
        description: Only bounded observer smoke; no Gateway workload
        type: boolean
        default: true
