name: Gateway Paired Monitor and Direct Mock Experiment
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gateway-paired-monitor-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: '0'
  OPENAI_API_KEY: ''
  OPENAI_BASE_URL: ''
  ANTHROPIC_API_KEY: ''
  ANTHROPIC_AUTH_TOKEN: ''
  ANTHROPIC_BASE_URL: ''
  CLAUDE_CODE_OAUTH_TOKEN: ''
jobs:
  paired-monitor-direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1flowbase
          POSTGRES_DB: 1flowbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d 1flowbase"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@v5
        with:
          ref: 638f494fdbb399fbf4df07a204f79db4af719a50
          persist-credentials: false
      - name: Checkout isolated experiment controls
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tmp/experiment-control
          sparse-checkout: scripts/node/ai-gateway-concurrency/cloud-monitor-probe
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Setup identical release toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Download existing baseline release artifact
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 36837561449
          name: gateway-cpu-paired-release-67a78a8828d79678d53e0551f8815b20447eddc2
          path: tmp/release-reuse
      - name: Download exact existing synthetic provider packages
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 36837561449
          name: test-governance-ai-gateway-protocol-conformance-67a78a8828d79678d53e0551f8815b20447eddc2
          path: tmp/protocol-reuse
      - name: Restore existing dependency cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: ai-gateway-protocol-conformance
          key: codex/gateway-cpu-ci-20261001
          save-if: false
          workspaces: api -> target
      - name: Verify frozen inputs and build only new candidate release
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          evidence=tmp/test-governance/gateway-monitor-paired/build
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = 638f494fdbb399fbf4df07a204f79db4af719a50
          grep -Fx 'candidate_product=67a78a8828d79678d53e0551f8815b20447eddc2' tmp/release-reuse/sources.txt
          grep -E '^rustc 1[.]98[.]1 ' tmp/release-reuse/toolchain.txt
          echo '746d9bacb2b2da169495cc9c03e91b13a2af663c4d09a11f9a0c88f92f4be362  tmp/release-reuse/candidate-release-api-server' | sha256sum --check
          rustc --version --verbose > "$evidence/toolchain.txt"
          cargo --version >> "$evidence/toolchain.txt"
          printf '%s\n' 'baseline=67a78a8828d79678d53e0551f8815b20447eddc2' 'candidate=638f494fdbb399fbf4df07a204f79db4af719a50' "workflow=$WORKFLOW_SHA" 'profile=release' 'features=default' > "$evidence/sources.txt"
          sha256sum api/Cargo.lock > "$evidence/lock.sha256"
          lscpu > "$evidence/runner-cpu.txt"
          cat /proc/meminfo > "$evidence/runner-memory.txt"
          python3 - <<'PY'
          import json,pathlib
          rows=[]
          for root in [pathlib.Path('/sys/fs/cgroup')]:
            row={}
            for name in ['cpu.max','cpuset.cpus.effective','memory.max','memory.high','cpu.stat']:
              p=root/name
              row[name]=p.read_text().strip() if p.exists() else 'unavailable'
            rows.append(row)
          pathlib.Path('tmp/test-governance/gateway-monitor-paired/build/runner-quota.json').write_text(json.dumps(rows,indent=2))
          PY
          cargo build --manifest-path api/Cargo.toml -p api-server --bin api-server --release --locked --jobs 1 > "$evidence/build.log" 2>&1
          cp api/target/release/api-server "$evidence/candidate-release-api-server"
          sha256sum "$evidence/candidate-release-api-server" > "$evidence/sha256.txt"
      - name: Upload immutable candidate build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-monitor-release-build-${{ github.run_id }}
          path: tmp/test-governance/gateway-monitor-paired/build/**
          retention-days: 7
          if-no-files-found: error
      - name: Configure only owned CI PostgreSQL observation and backup tools
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter publish=5432 --format '{{.ID}}')"
          test -n "$pg_container"
          docker exec "$pg_container" psql -U postgres -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements'"
          docker restart "$pg_container"
          for attempt in $(seq 1 30); do
            if docker exec "$pg_container" pg_isready -U postgres -d 1flowbase; then break; fi
            sleep 1
          done
          tools_dir="$RUNNER_TEMP/postgresql-18-tools"
          mkdir -p "$tools_dir"
          for tool in pg_dump pg_restore; do
            sed "s/__TOOL__/$tool/g" > "$tools_dir/$tool" <<'SCRIPT'
          #!/bin/sh
          exec docker run --pull=never --rm -i --network host --env PGPASSWORD postgres:18.4 __TOOL__ "$@"
          SCRIPT
            chmod +x "$tools_dir/$tool"
          done
          echo "API_POSTGRES_PG_DUMP_PATH=$tools_dir/pg_dump" >> "$GITHUB_ENV"
          echo "API_POSTGRES_PG_RESTORE_PATH=$tools_dir/pg_restore" >> "$GITHUB_ENV"
      - name: Validate experiment statistics contracts
        run: node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/_tests/metrics.test.js
      - name: Run bounded ABBA monitor and direct mock pairs on one runner
        run: node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/run.js
      - name: Upload all positive and negative raw experiment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-monitor-direct-paired-${{ github.run_id }}
          path: |
            tmp/test-governance/gateway-monitor-paired/manifest.json
            tmp/test-governance/gateway-monitor-paired/summary.json
            tmp/test-governance/gateway-monitor-paired/A*/**
            tmp/test-governance/gateway-monitor-paired/B*/**
          retention-days: 14
          if-no-files-found: warn
