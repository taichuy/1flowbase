name: Gateway native recovery fix validation
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: gateway-native-recovery-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: '0'
  OPENAI_API_KEY: ''
  OPENAI_BASE_URL: ''
jobs:
  native-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1flowbase
          POSTGRES_DB: 1flowbase
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d 1flowbase" --health-interval
          5s --health-timeout 5s --health-retries 12
    steps:
    - name: Checkout exact host source
      uses: actions/checkout@v5
      with:
        ref: 63470c8b594151be84f62c55ba7f9231b6319c06
        fetch-depth: 1
    - name: Checkout exact OpenAI paired source
      uses: actions/checkout@v6
      with:
        repository: taichuy/1flowbase-official-plugins
        ref: 80af5a3fcccf0ea9f9d0288a8f647f8b2b498832
        path: tmp/ai-gateway-concurrency/official-source
        fetch-depth: 1
    - uses: actions/setup-node@v5
      with:
        node-version: 24
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        shared-key: ai-gateway-protocol-conformance
        key: codex/gateway-replay-gc-20261010
        save-if: false
        cache-on-failure: true
        cache-workspace-crates: true
        workspaces: |-
          api -> target
          tmp/ai-gateway-concurrency/official-source/runtime-extensions/@taichuy/openai -> target
    - name: Validate fixed fixtures and host admission
      env:
        DATABASE_URL: postgres://postgres:1flowbase@127.0.0.1:5432/1flowbase
        API_DATABASE_URL: postgres://postgres:1flowbase@127.0.0.1:5432/1flowbase
      shell: bash
      run: |
        node <<'JS'
        "use strict";
        const fs = require("node:fs");
        const path = require("node:path");
        const crypto = require("node:crypto");
        const { spawnSync, execFileSync } = require("node:child_process");
        const assert = require("node:assert/strict");
        const host = process.cwd();
        const official = path.join(host, "tmp/ai-gateway-concurrency/official-source");
        const provider = path.join(official, "runtime-extensions/@taichuy/openai");
        const evidence = path.join(host, "tmp/test-governance/gateway-native-recovery-fix");
        fs.mkdirSync(evidence, { recursive: true });
        const hostSha = "63470c8b594151be84f62c55ba7f9231b6319c06";
        const officialSha = "80af5a3fcccf0ea9f9d0288a8f647f8b2b498832";
        const sha = (cwd) => execFileSync("git", ["rev-parse", "HEAD"], { cwd, encoding: "utf8" }).trim();
        assert.equal(sha(host), hostSha);
        assert.equal(sha(official), officialSha);
        assert.equal(fs.readFileSync("VERSION", "utf8").trim(), "0.5.4");
        assert.match(fs.readFileSync(path.join(provider, "manifest.yaml"), "utf8"), /^minimum_host_version: 0\.5\.4$/mu);
        assert.match(fs.readFileSync(path.join(provider, "manifest.yaml"), "utf8"), /^version: 0\.2\.72$/mu);
        assert.equal(JSON.parse(fs.readFileSync("scripts/node/ai-gateway-concurrency/workflow-contract/paired-source.lock.json")).official_plugins.revision, officialSha);
        const jobs = execFileSync("node", ["scripts/node/testing/verify-runtime.js", "cargo-jobs"], { encoding: "utf8" }).trim();
        assert(/^[1-9][0-9]*$/u.test(jobs));
        const commands = [];
        function run(name, executable, args, requireTests) {
          const logFile = path.join(evidence, `${name}.log`);
          const fd = fs.openSync(logFile, "w");
          const started = Date.now();
          let result;
          try { result = spawnSync(executable, args, { cwd: host, stdio: ["ignore", fd, fd], timeout: 20 * 60 * 1000 }); }
          finally { fs.closeSync(fd); }
          const log = fs.readFileSync(logFile, "utf8");
          const summaries = [...log.matchAll(/test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;/gu)]
            .map((match) => ({ result: match[1], passed: Number(match[2]), failed: Number(match[3]), ignored: Number(match[4]) }));
          const count = summaries.reduce((sum, x) => sum + x.passed + x.failed, 0);
          const passed = result.status === 0 && (!requireTests || (count > 0 && summaries.every((x) => x.failed === 0)));
          const record = { name, executable, args, exit_code: result.status, elapsed_ms: Date.now() - started,
            status: passed ? "PASS" : "FAIL", summaries, signal: result.signal,
            log_sha256: crypto.createHash("sha256").update(log).digest("hex") };
          commands.push(record);
          fs.writeFileSync(path.join(evidence, "receipt.json"), JSON.stringify({ host_source_sha: hostSha, official_source_sha: officialSha,
            workflow_source_sha: process.env.GITHUB_SHA, status: "RUNNING", commands }, null, 2) + "\n");
          console.log(JSON.stringify(record));
          if (!passed) console.log(log.slice(-4000));
          return passed;
        }
        const hostTest = (pkg, filter, target = null) => ["test", "--manifest-path", "api/Cargo.toml", "-p", pkg,
          ...(target ? ["--test", target] : ["--lib"]), ...(filter ? [filter] : []), "--jobs", jobs, "--locked"];
        if (!run("full-locked-metadata-prefetch", "cargo", ["fetch", "--manifest-path", "api/Cargo.toml", "--locked"], false)) process.exit(1);
        run("openai-library", "cargo", ["test", "--manifest-path", path.join(provider, "Cargo.toml"), "--lib", "--jobs", jobs, "--locked"], true);
        run("openai-stdio-regression", "cargo", ["test", "--manifest-path", path.join(provider, "Cargo.toml"), "--test", "stdio_worker", "--jobs", jobs, "--locked"], true);
        run("dependency-boundaries", "cargo", hostTest("control-plane-postgres-tests", "", "dependency_boundaries"), true);
        run("native-release-host-admission", "cargo", hostTest("control-plane", "native_http_recovery_release_excludes_pre_contract_hosts"), true);
        run("existing-default-version-installation", "cargo", hostTest("control-plane", "below_minimum"), true);
        execFileSync("git", ["diff", "--exit-code"], { cwd: host, maxBuffer: 128 * 1024 });
        execFileSync("git", ["diff", "--exit-code"], { cwd: official, maxBuffer: 128 * 1024 });
        const status = commands.length === 6 && commands.every((x) => x.status === "PASS") ? "PASS" : "FAIL";
        fs.writeFileSync(path.join(evidence, "receipt.json"), JSON.stringify({ schema_version: "1flowbase.gateway-native-recovery-fix-validation/v1",
          host_source_sha: hostSha, official_source_sha: officialSha, workflow_source_sha: process.env.GITHUB_SHA, status,
          jobs: Number(jobs), source_restored: true, commands, previous_evidence_run: 37992944000 }, null, 2) + "\n");
        console.log(JSON.stringify({ status, commands: commands.length }));
        if (status !== "PASS") process.exitCode = 1;
        JS
    - name: Upload actual paired source evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: test-governance-gateway-native-recovery-fix
        path: tmp/test-governance/gateway-native-recovery-fix/**
