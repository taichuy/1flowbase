name: Gateway Resource Candidate Regression
'on':
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen assembly SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gateway-resource-build-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CARGO_INCREMENTAL: '0'
  RUSTFLAGS: '-C force-frame-pointers=yes -C debuginfo=1'
  OPENAI_API_KEY: ''
  OPENAI_BASE_URL: ''
jobs:
  diagnostic-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: gateway_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gateway_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: gateway-connection-reuse
          cache-workspace-crates: true
          cache-on-failure: true
          workspaces: api -> target
      - name: Build source-bound development executable
        timeout-minutes: 90
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          out=tmp/test-governance/gateway-resource-ci/build
          mkdir -p "$out"
          node scripts/node/testing/verify-runtime.js cargo-jobs > "$out/cargo-jobs.txt"
          export CARGO_BUILD_JOBS="$(cat "$out/cargo-jobs.txt")"
          rustc -Vv > "$out/toolchain.txt"
          git rev-parse HEAD > "$out/source-sha.txt"
          test "$(cat "$out/source-sha.txt")" = "$EXPECTED_SHA"
          git rev-parse HEAD:api > "$out/api-tree.txt"
          git status --porcelain --untracked-files=no > "$out/source-status.txt"
          test ! -s "$out/source-status.txt"
          set +e
          cargo build --manifest-path api/Cargo.toml --locked -p api-server --bin api-server --features tikv-jemallocator/stats > "$out/build.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$out/build-exit-code.txt"
          tail -c 5000 "$out/build.log"
          test "$code" = 0
          cp api/target/debug/api-server "$out/api-server"
          sha256sum "$out/api-server" > "$out/binary.sha256"
          printf '%s\n' "$RUSTFLAGS" > "$out/rustflags.txt"
          ldd "$out/api-server" > "$out/ldd.txt"
          tar -czf "$out/api-server.tar.gz" -C "$out" api-server
          rm "$out/api-server"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gateway-resource-build-${{ github.run_id }}
          path: tmp/test-governance/gateway-resource-ci/build/**
          retention-days: 7
          if-no-files-found: error
      - name: Execute centralized behavior tests sequentially
        timeout-minutes: 100
        if: success()
        shell: bash
        env:
          DATABASE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/gateway_tests
        run: |
          set -euo pipefail
          out=tmp/test-governance/gateway-resource-ci/tests
          mkdir -p "$out"
          node scripts/node/testing/verify-runtime.js cargo-jobs > "$out/repository-cargo-jobs.txt"
          # CI test linking shares this runner with Postgres; preserve the prior measured resource budget.
          python3 - <<'PYRESOURCE' > "$out/resource-policy.json"
          import json,os,pathlib
          memory=int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemTotal:')))*1024
          cpu=len(os.sched_getaffinity(0)); jobs=max(1,min(cpu,max(1,(memory-2*1024**3)//(2*1024**3))))
          print(json.dumps(dict(memory_bytes=memory,cpu_available=cpu,cargo_jobs=jobs,reserved_bytes=2*1024**3,bytes_per_compiler=2*1024**3)))
          PYRESOURCE
          export CARGO_BUILD_JOBS="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["cargo_jobs"])' "$out/resource-policy.json")"
          export RUST_TEST_THREADS="$CARGO_BUILD_JOBS"
          git rev-parse HEAD > "$out/source-sha.txt"
          git rev-parse HEAD:api > "$out/api-tree.txt"
          status=0
          run_suite() {
            name="$1"
            shift
            set +e
            cargo test --manifest-path api/Cargo.toml --release --locked "$@" > "$out/$name.log" 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "$out/$name.exit-code.txt"
            tail -c 4000 "$out/$name.log"
            if [ "$code" -ne 0 ]; then status=1; fi
          }
          run_suite trace_projection -p control-plane --lib trace_projection
          run_suite application_logs -p control-plane-postgres-tests --test orchestration_runtime_integration application_logs::
          python3 - <<'PY'
          import json,pathlib,re
          p=pathlib.Path('tmp/test-governance/gateway-resource-ci/tests')
          suites=[]
          for name in ['trace_projection','application_logs']:
              log=(p/(name+'.log')).read_text(errors='replace')
              rows=re.findall(r'test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored;',log)
              code=int((p/(name+'.exit-code.txt')).read_text())
              valid=code==0 and bool(rows) and sum(int(r[1]) for r in rows)>0 and all(r[0]=='ok' and int(r[2])==0 and int(r[3])==0 for r in rows)
              suites.append(dict(name=name,exit_code=code,summaries=rows,passed=valid))
          (p/'receipt.json').write_text(json.dumps(dict(source_sha=(p/'source-sha.txt').read_text().strip(),suites=suites),indent=2))
          assert all(s['passed'] for s in suites), 'missing or failed behavior evidence'
          PY
          exit "$status"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gateway-resource-tests-${{ github.run_id }}
          path: tmp/test-governance/gateway-resource-ci/tests/**
          retention-days: 14
          if-no-files-found: warn
