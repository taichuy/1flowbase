name: Gateway CPU Diagnostic Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-cpu-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  OPENAI_API_KEY: ''
  OPENAI_BASE_URL: ''
  ANTHROPIC_API_KEY: ''
  ANTHROPIC_AUTH_TOKEN: ''
  ANTHROPIC_BASE_URL: ''
  CLAUDE_CODE_OAUTH_TOKEN: ''

jobs:
  diagnostic-release-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout frozen diagnostic source
        uses: actions/checkout@v5
        with:
          ref: b8139fa06c878b41cdc9f7aa942aa9303fc88c0d
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Restore existing release dependency cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: ai-gateway-protocol-conformance
          key: codex/gateway-cpu-ci-20261001
          save-if: false
          workspaces: api -> target
      - name: Record frozen source and runner environment
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          evidence_dir=tmp/test-governance/gateway-cpu-diagnostic
          mkdir -p "$evidence_dir"
          test "$(git rev-parse HEAD)" = b8139fa06c878b41cdc9f7aa942aa9303fc88c0d
          test "$(git rev-parse HEAD:api)" = 5e7216fd1524afa0c6e3d8d63b51c6138990b7cf
          printf '%s\n' 'artifact_role=diagnostic-only-not-product-candidate' \
            'diagnostic_source=b8139fa06c878b41cdc9f7aa942aa9303fc88c0d' \
            'formal_candidate=67a78a8828d79678d53e0551f8815b20447eddc2' \
            "workflow_source=$WORKFLOW_SHA" \
            'features=tikv-jemallocator/profiling,tikv-jemallocator/stats' \
            'profile=release' 'cargo_jobs=1' > "$evidence_dir/sources.txt"
          rustc --version --verbose > "$evidence_dir/toolchain.txt"
          cargo --version >> "$evidence_dir/toolchain.txt"
          sha256sum api/Cargo.lock > "$evidence_dir/lock.sha256"
          lscpu > "$evidence_dir/runner-cpu.txt"
          cat /proc/meminfo > "$evidence_dir/runner-memory.txt"
          for name in cpu.max memory.max; do
            if test -f "/sys/fs/cgroup/$name"; then
              cat "/sys/fs/cgroup/$name" > "$evidence_dir/cgroup-$name.txt"
            fi
          done
      - name: Build diagnostic release with jemalloc profiling and stats
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir=tmp/test-governance/gateway-cpu-diagnostic
          cargo build --manifest-path api/Cargo.toml -p api-server --bin api-server \
            --release --locked --jobs 1 \
            --features tikv-jemallocator/profiling,tikv-jemallocator/stats \
            > "$evidence_dir/build.log" 2>&1
          cp api/target/release/api-server "$evidence_dir/diagnostic-release-api-server"
          (cd "$evidence_dir" && sha256sum diagnostic-release-api-server > sha256.txt)
      - name: Upload diagnostic binary and provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-cpu-diagnostic-b8139fa06c878b41cdc9f7aa942aa9303fc88c0d
          path: tmp/test-governance/gateway-cpu-diagnostic/**
          if-no-files-found: error
          retention-days: 7
