name: Gateway Same-Binary Terminal Timeline A/A
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: gateway-terminal-aa-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CARGO_INCREMENTAL: '0'
  OPENAI_API_KEY: ''
  OPENAI_BASE_URL: ''
  ANTHROPIC_API_KEY: ''
  ANTHROPIC_AUTH_TOKEN: ''
  ANTHROPIC_BASE_URL: ''
  CLAUDE_CODE_OAUTH_TOKEN: ''
jobs:
  terminal-aa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1flowbase
          POSTGRES_DB: 1flowbase
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d 1flowbase"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout exact candidate product source
        uses: actions/checkout@v5
        with:
          ref: 60308d4fe3b85b6317653d5c6bda834609f4ad3a
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout immutable isolated controls
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tmp/experiment-control
          sparse-checkout: |
            scripts/node/ai-gateway-concurrency/cloud-monitor-probe
            .github/workflows
          persist-credentials: false
      - name: Setup Node24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Pure source and ordinary counter controls
        run: |
          set -euo pipefail
          controls=tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe
          out=tmp/test-governance/gateway-terminal-aa/build
          mkdir -p "$out"
          node --test "$controls/terminal-aa/_tests/"*.test.js "$controls/_tests/"*.test.js "$controls/duplicate-lock/_tests/"*.test.js "$controls/lock-scope/_tests/"*.test.js > "$out/pure-node-tests.log" 2>&1
          python3 "$controls/_tests/sampler.test.py" > "$out/pure-sampler-tests.log" 2>&1
          node --check "$controls/terminal-aa/run.js"
          node --check "$controls/terminal-aa/prepare-reuse.js"
      - name: Configure only owned ephemeral PostgreSQL SQL statistics and backup clients
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter publish=5432 --format '{{.ID}}')"
          test -n "$pg_container"
          docker exec "$pg_container" psql -U postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements'"
          docker restart "$pg_container"
          for attempt in $(seq 1 30);do
            if docker exec "$pg_container" pg_isready -U postgres -d 1flowbase;then break;fi
            sleep 1
          done
          tools_dir="$RUNNER_TEMP/postgresql-18-tools"
          mkdir -p "$tools_dir"
          for tool in pg_dump pg_restore;do
            sed "s/__TOOL__/$tool/g" > "$tools_dir/$tool" <<'SCRIPT'
          #!/bin/sh
          exec docker run --pull=never --rm -i --network host --env PGPASSWORD postgres:18.4 __TOOL__ "$@"
          SCRIPT
            chmod +x "$tools_dir/$tool"
          done
          echo "API_POSTGRES_PG_DUMP_PATH=$tools_dir/pg_dump" >> "$GITHUB_ENV"
          echo "API_POSTGRES_PG_RESTORE_PATH=$tools_dir/pg_restore" >> "$GITHUB_ENV"
      - name: Verify immutable previously compiled binary artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=tmp/test-governance/gateway-terminal-aa/build
          gh api repos/taichuy/1flowbase/actions/artifacts/11242053254 > "$out/reuse-artifact-metadata.json"
          node -e "const a=require('./$out/reuse-artifact-metadata.json');if(a.id!==11242053254||a.expired||a.workflow_run.id!==37036697535||a.digest!=='sha256:9bb7a475d85f4c5f4af3660e3bb47a6149dc4edc4a5984cacb911ceda1169489')throw Error('immutable compiled artifact mismatch')"
      - name: Download previous compiled baseline and packages, do not build Rust
        uses: actions/download-artifact@v8
        with:
          name: gateway-identity-reuse-build-37036697535
          run-id: 37036697535
          github-token: ${{ github.token }}
          path: tmp/terminal-aa-reuse
      - name: Exact binary source API tree package provenance and baseline byte verification
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/terminal-aa/prepare-reuse.js
      - name: Same60308 same binary C8 AA1 AA2 client terminal and existing timing facts
        timeout-minutes: 12
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: node tmp/experiment-control/scripts/node/ai-gateway-concurrency/cloud-monitor-probe/terminal-aa/run.js
      - name: Upload every successful or failed synthetic result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-terminal-aa-raw-${{ github.run_id }}
          path: |
            tmp/test-governance/gateway-terminal-aa/manifest.json
            tmp/test-governance/gateway-terminal-aa/summary.json
            tmp/test-governance/gateway-terminal-aa/AA*/**
          retention-days: 14
          if-no-files-found: warn
      - name: Upload gate and reused binary provenance without duplicate binary archive
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-terminal-aa-proof-${{ github.run_id }}
          path: |
            tmp/test-governance/gateway-terminal-aa/build/*.json
            tmp/test-governance/gateway-terminal-aa/build/*.txt
            tmp/test-governance/gateway-terminal-aa/build/*.log
          retention-days: 7
          if-no-files-found: warn
