name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - latest
  workflow_dispatch:
    inputs:
      main_source_sha:
        description: Exact 1flowbase source SHA for actual-package conformance
        required: true
        type: string
      official_source_sha:
        description: Exact official-plugin source SHA for actual-package conformance
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  provider-conformance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.main_source_sha }}

      - name: Checkout exact official provider source
        uses: actions/checkout@v6
        with:
          repository: taichuy/1flowbase-official-plugins
          ref: ${{ inputs.official_source_sha }}
          path: tmp/provider-conformance/official-source

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build and package the fixed actual-provider matrix
        shell: bash
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-musl
          providers=(openai anthropic aliyun_bailian deepseek gemini openai_compatible)
          rm -rf tmp/provider-conformance/packages

          for provider_code in "${providers[@]}"; do
            plugin_dir="tmp/provider-conformance/official-source/runtime-extensions/model-providers/${provider_code}"
            cross build --manifest-path "${plugin_dir}/Cargo.toml" --release --target "${target}"
            runtime_binary_name="$(node tmp/provider-conformance/official-source/scripts/list-provider-package-targets.mjs --plugin-dir "${plugin_dir}" --rust-target "${target}" --field runtime_binary_name)"
            node scripts/node/plugin/cli.js package \
              "${plugin_dir}" \
              --out "tmp/provider-conformance/packages/${provider_code}" \
              --runtime-binary "${plugin_dir}/target/${target}/release/${runtime_binary_name}" \
              --target "${target}"
          done

      - name: Build exact plugin-runner host binary
        run: cargo build --manifest-path api/Cargo.toml --release -p plugin-runner --bin plugin-runner

      - name: Run actual-package provider conformance
        run: |
          node scripts/node/provider-conformance/cli.js \
            --main-root "$GITHUB_WORKSPACE" \
            --official-root "$GITHUB_WORKSPACE/tmp/provider-conformance/official-source" \
            --main-sha "${{ inputs.main_source_sha }}" \
            --official-sha "${{ inputs.official_source_sha }}" \
            --package-dir tmp/provider-conformance/packages \
            --plugin-runner-bin api/target/release/plugin-runner \
            --fixture scripts/node/provider-conformance/fixtures/six-provider-matrix.json \
            --artifact tmp/provider-conformance/paired-sha.json

      - name: Upload paired SHA artifact
        uses: actions/upload-artifact@v6
        with:
          name: provider-conformance-pair
          path: tmp/provider-conformance/paired-sha.json
          if-no-files-found: error

  repo-tooling-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - uses: ./.github/actions/quality-gate
        with:
          scope: repo-tooling
          report_type: ci
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-repo-tooling
          path: tmp/test-governance

  repo-frontend-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - uses: ./.github/actions/quality-gate
        with:
          scope: repo-frontend-pr
          report_type: ci
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-repo-frontend-pr
          path: tmp/test-governance

  repo-backend-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope:
          - repo-backend-static
          - repo-backend-fmt
          - repo-backend-image-llm-vision
          - repo-backend-official-i18n-seed
          - repo-backend-check-core-libs
          - repo-backend-check-runtime-storage
          - repo-backend-check-apps
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/quality-gate
        with:
          scope: ${{ matrix.scope }}
          report_type: ci
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-${{ matrix.scope }}
          path: tmp/test-governance

  verify:
    needs:
      - repo-tooling-gate
      - repo-frontend-gate
      - repo-backend-gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: test-governance-*
          path: tmp/test-governance/parallel
          merge-multiple: false
      - run: node scripts/node/cli/github-quality-gate-aggregate.js
        env:
          INPUT_ARTIFACT_ROOT: tmp/test-governance/parallel
          INPUT_REPORT_TYPE: ci
          INPUT_EXPECTED_SCOPES: repo-tooling,repo-frontend-pr,repo-backend-static,repo-backend-fmt,repo-backend-image-llm-vision,repo-backend-official-i18n-seed,repo-backend-check-core-libs,repo-backend-check-runtime-storage,repo-backend-check-apps
          INPUT_PUBLISH_ISSUE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/latest' }}
          INPUT_PUBLISH_PR_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          INPUT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-artifacts
          path: tmp/test-governance
