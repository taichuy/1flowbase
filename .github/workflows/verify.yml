name: verify

on:
  pull_request:
  push:
    branches:
      - beta
      - main
      - latest
  workflow_dispatch:
    inputs:
      main_source_sha:
        description: Exact 1flowbase source SHA for actual-package conformance
        required: true
        type: string
      official_source_sha:
        description: Exact official-plugin source SHA for actual-package conformance
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QUALITY_GATE_TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.main_source_sha || github.sha }}

jobs:
  plan-verify-scopes:
    runs-on: ubuntu-latest
    outputs:
      tooling: ${{ steps.plan.outputs.tooling }}
      frontend: ${{ steps.plan.outputs.frontend }}
      backend: ${{ steps.plan.outputs.backend }}
      all_foundations: ${{ steps.plan.outputs.all_foundations }}
      expected_scopes: ${{ steps.plan.outputs.expected_scopes }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_GATE_TARGET_SHA }}
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          plan="$(node scripts/node/tooling.js gate-router --pr-plan-json --base-ref "${BASE_REF:-none}")"
          jq -r '
            "tooling=\(.tooling)", "frontend=\(.frontend)",
            "backend=\(.backendScopes | tojson)", "all_foundations=\(.allFoundations)",
            "expected_scopes=\(.expectedScopes | join(","))"
          ' <<< "$plan" >> "$GITHUB_OUTPUT"

  provider-conformance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.main_source_sha }}
      - name: Checkout exact official plugin source
        uses: actions/checkout@v6
        with:
          repository: taichuy/1flowbase-official-plugins
          ref: ${{ inputs.official_source_sha }}
          path: tmp/provider-conformance/official-source
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the exact official RuntimeExtension executables
        shell: bash
        run: |
          set -euo pipefail
          for plugin_dir in tmp/provider-conformance/official-source/runtime-extensions/@taichuy/*; do
            if [ ! -f "${plugin_dir}/Cargo.toml" ]; then
              continue
            fi
            cargo build --manifest-path "${plugin_dir}/Cargo.toml"
          done
      - name: Execute official RuntimeExtensions through the in-process host
        uses: ./.github/actions/quality-gate
        env:
          ONEFLOWBASE_OFFICIAL_PLUGIN_ROOT: ${{ github.workspace }}/tmp/provider-conformance/official-source
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
          scope: provider-conformance
          report_type: ci
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-governance-provider-conformance
          path: tmp/test-governance

  repo-tooling-gate:
    needs: plan-verify-scopes
    if: needs.plan-verify-scopes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.main_source_sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: Prepare real recovery bind-mount fixture
        run: docker pull alpine:3.20
      - uses: ./.github/actions/quality-gate
        env:
          REQUIRE_DOCKER_RECOVERY_EVIDENCE: "1"
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
          scope: repo-tooling
          report_type: ci
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-governance-repo-tooling
          path: tmp/test-governance

  repo-frontend-gate:
    needs: plan-verify-scopes
    if: needs.plan-verify-scopes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.main_source_sha || github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - uses: ./.github/actions/quality-gate
        env:
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
          scope: repo-frontend-pr
          report_type: ci
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-governance-repo-frontend-pr
          path: tmp/test-governance

  repo-backend-gate:
    needs: plan-verify-scopes
    if: needs.plan-verify-scopes.outputs.backend != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(needs.plan-verify-scopes.outputs.backend) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.main_source_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/quality-gate
        env:
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
          scope: ${{ matrix.scope }}
          report_type: ci
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-governance-${{ matrix.scope }}
          path: tmp/test-governance

  foundation-contract-gate:
    needs: plan-verify-scopes
    uses: ./.github/workflows/foundation-contracts.yml
    with:
      target_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.main_source_sha || github.sha }}
      base_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
      foundation: ${{ needs.plan-verify-scopes.outputs.all_foundations == 'true' && 'all' || 'auto' }}
      lane: pr-evidence

  collector-runtime:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/collector-runtime.yml
    with:
      main_source_sha: ${{ inputs.main_source_sha }}
      official_source_sha: ${{ inputs.official_source_sha }}

  verify:
    needs:
      - repo-tooling-gate
      - repo-frontend-gate
      - repo-backend-gate
      - foundation-contract-gate
      - provider-conformance
      - collector-runtime
      - plan-verify-scopes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.main_source_sha || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: "test-governance-!(artifacts)"
          path: tmp/test-governance/parallel
          merge-multiple: false
      - name: Require separate collector runtime evidence for manual acceptance
        if: github.event_name == 'workflow_dispatch'
        env:
          COLLECTOR_RUNTIME_JOB_RESULT: ${{ needs.collector-runtime.result }}
          COLLECTOR_EXPECTED_SHA: ${{ inputs.main_source_sha }}
          COLLECTOR_EXPECTED_PLUGINS_SHA: ${{ inputs.official_source_sha }}
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          assert.equal(process.env.COLLECTOR_RUNTIME_JOB_RESULT, 'success', 'collector runtime job must succeed');
          const main = process.env.COLLECTOR_EXPECTED_SHA;
          const official = process.env.COLLECTOR_EXPECTED_PLUGINS_SHA;
          const receiptPath = path.join('tmp/test-governance/parallel', `test-governance-collector-runtime-${main}-${official}`, 'runtime.json');
          const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
          assert.equal(receipt.status, 'pass');
          assert.equal(receipt.source_sha, main);
          assert.equal(receipt.plugins_sha, official);
          JS
      - run: node scripts/node/cli/quality/github-quality-gate-aggregate.js
        if: needs.plan-verify-scopes.result == 'success' && contains(format(',{0},', needs.plan-verify-scopes.outputs.expected_scopes), ',foundation-contracts,')
        env:
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
          INPUT_ARTIFACT_ROOT: tmp/test-governance/parallel
          INPUT_REPORT_TYPE: ci
          INPUT_EXPECTED_SCOPES: ${{ needs.plan-verify-scopes.outputs.expected_scopes }}${{ github.event_name == 'workflow_dispatch' && ',provider-conformance' || '' }}
          INPUT_PUBLISH_ISSUE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/latest' }}
          INPUT_PUBLISH_PR_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          INPUT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require a valid candidate plan and completed selected jobs
        if: always()
        env:
          PLAN_RESULT: ${{ needs.plan-verify-scopes.result }}
          EXPECTED_SCOPES: ${{ needs.plan-verify-scopes.outputs.expected_scopes }}
          TOOLING_RESULT: ${{ needs.repo-tooling-gate.result }}
          FRONTEND_RESULT: ${{ needs.repo-frontend-gate.result }}
          BACKEND_RESULT: ${{ needs.repo-backend-gate.result }}
          FOUNDATION_RESULT: ${{ needs.foundation-contract-gate.result }}
          PROVIDER_RESULT: ${{ needs.provider-conformance.result }}
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const env = process.env;
          assert.equal(env.PLAN_RESULT, 'success');
          const scopes = (env.EXPECTED_SCOPES || '').split(',');
          assert.ok(scopes.includes('foundation-contracts'), 'candidate must have a foundation receipt');
          assert.equal(env.FOUNDATION_RESULT, 'success');
          if (scopes.includes('repo-tooling')) assert.equal(env.TOOLING_RESULT, 'success');
          if (scopes.includes('repo-frontend-pr')) assert.equal(env.FRONTEND_RESULT, 'success');
          if (scopes.some((scope) => scope.startsWith('repo-backend-'))) assert.equal(env.BACKEND_RESULT, 'success');
          if (env.GITHUB_EVENT_NAME === 'workflow_dispatch') assert.equal(env.PROVIDER_RESULT, 'success');
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-governance-artifacts
          path: tmp/test-governance
