name: verify

on:
  pull_request:
  push:
    branches:
      - beta
      - main
      - latest
  workflow_dispatch:
    inputs:
      main_source_sha:
        description: Exact 1flowbase source SHA for actual-package conformance
        required: true
        type: string
      official_source_sha:
        description: Exact official-plugin source SHA for actual-package conformance
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  provider-conformance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.main_source_sha }}
      - name: Checkout exact official plugin source
        uses: actions/checkout@v6
        with:
          repository: taichuy/1flowbase-official-plugins
          ref: ${{ inputs.official_source_sha }}
          path: tmp/provider-conformance/official-source
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the exact official RuntimeExtension executables
        shell: bash
        run: |
          set -euo pipefail
          for plugin_dir in tmp/provider-conformance/official-source/runtime-extensions/@taichuy/*; do
            if [ ! -f "${plugin_dir}/Cargo.toml" ]; then
              continue
            fi
            cargo build --manifest-path "${plugin_dir}/Cargo.toml"
          done
      - name: Execute the eight official RuntimeExtensions through the in-process host
        env:
          ONEFLOWBASE_OFFICIAL_PLUGIN_ROOT: ${{ github.workspace }}/tmp/provider-conformance/official-source
        run: cargo test --manifest-path api/Cargo.toml -p runtime-extension-host --test official_plugin_compatibility -- --ignored

  repo-tooling-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - uses: ./.github/actions/quality-gate
        with:
          scope: repo-tooling
          report_type: ci
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-repo-tooling
          path: tmp/test-governance

  repo-frontend-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - uses: ./.github/actions/quality-gate
        with:
          scope: repo-frontend-pr
          report_type: ci
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-repo-frontend-pr
          path: tmp/test-governance

  repo-backend-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope:
          - repo-backend-static
          - repo-backend-fmt
          - repo-backend-image-llm-vision
          - repo-backend-official-i18n-seed
          - repo-backend-check-core-libs
          - repo-backend-check-runtime-storage
          - repo-backend-check-apps
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/quality-gate
        with:
          scope: ${{ matrix.scope }}
          report_type: ci
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-${{ matrix.scope }}
          path: tmp/test-governance

  foundation-contract-gate:
    uses: ./.github/workflows/foundation-contracts.yml
    with:
      target_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.main_source_sha || github.sha }}
      base_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
      foundation: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}
      lane: pr-evidence

  verify:
    needs:
      - repo-tooling-gate
      - repo-frontend-gate
      - repo-backend-gate
      - foundation-contract-gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: test-governance-*
          path: tmp/test-governance/parallel
          merge-multiple: false
      - run: node scripts/node/cli/github-quality-gate-aggregate.js
        env:
          INPUT_ARTIFACT_ROOT: tmp/test-governance/parallel
          INPUT_REPORT_TYPE: ci
          INPUT_EXPECTED_SCOPES: repo-tooling,repo-frontend-pr,repo-backend-static,repo-backend-fmt,repo-backend-image-llm-vision,repo-backend-official-i18n-seed,repo-backend-check-core-libs,repo-backend-check-runtime-storage,repo-backend-check-apps,foundation-contracts
          INPUT_PUBLISH_ISSUE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/latest' }}
          INPUT_PUBLISH_PR_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          INPUT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-artifacts
          path: tmp/test-governance
