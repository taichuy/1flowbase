name: Issue 2818 W6 source-bound small host

on:
  push:
    branches: ['ci/2818-target-evidence-20261109']

permissions:
  contents: read
  actions: read

concurrency:
  group: issue2818-one-off-feasibility
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: 'true'
  CARGO_TERM_COLOR: never

jobs:
  first-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1' 
      - name: Compile and execute only the source-bound W6 small host
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: 903971d5c3ddd37f93c1f7314e02dae4a2bb120c
        run: |
          set -euo pipefail
          task_uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$task_uid.service"
          export XDG_RUNTIME_DIR="/run/user/$task_uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          task_cpu_percent=$(( $(getconf _NPROCESSORS_ONLN) * 60 ))
          systemctl --user set-property --runtime issue2818.slice MemoryMax=8000000000 MemoryHigh=infinity MemorySwapMax=0 "CPUQuota=$task_cpu_percent%"
          systemctl --user start issue2818.slice
          task_group=$(systemctl --user show issue2818.slice --property=ControlGroup --value)
          task_inode=$(stat -c %i "/sys/fs/cgroup$task_group")
          systemd-run --user --scope --quiet --unit=issue2818-orchestrator --slice=issue2818.slice \
            --property=RuntimeMaxSec=1200s --property=TimeoutStopSec=5s --property=KillMode=control-group \
            --working-directory="$GITHUB_WORKSPACE" \
            env "ONEFLOWBASE_TASK_BUDGET_CGROUP=$task_group" "ONEFLOWBASE_TASK_BUDGET_ID=$task_inode" \
            python3 tmp/test-governance/issue2818/ci-preparation/w6-host/host.py --execute
      - name: Confirm owned slice is empty and preserve final limits
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          evidence=tmp/test-governance/issue2818/ci-evidence
          mkdir -p "$evidence"
          systemctl --user show issue2818.slice --property=Id,ControlGroup,ActiveState,MemoryMax,MemoryHigh,MemorySwapMax,CPUQuotaPerSecUSec > "$evidence/final-slice.txt"
          task_group=$(systemctl --user show issue2818.slice --property=ControlGroup --value)
          if test -n "$task_group" && test -e "/sys/fs/cgroup$task_group/cgroup.events"; then
            cat "/sys/fs/cgroup$task_group/cgroup.events" > "$evidence/final-cgroup.events"
            if ! grep -qx 'populated 0' "$evidence/final-cgroup.events"; then
              systemctl --user stop issue2818.slice
              exit 1
            fi
          fi
          systemctl --user stop issue2818.slice
      - name: Upload small results and raw logs
        uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 5
        with:
          name: issue2818-w6-host-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/test-governance/issue2818/ci-evidence/**
            tmp/test-governance/issue2818/ci-preparation/**
            !tmp/test-governance/issue2818/ci-evidence/seed-target-and-source.tar.zst
            !tmp/test-governance/issue2818/ci-evidence/host-binaries/**
            tmp/test-governance/issue2818/development/static-runtime-reads-schema/qualification/**
            tmp/test-governance/issue2818/development/static-runtime-reads-schema/source-map.json
            tmp/test-governance/issue2818/development/static-runtime-reads-schema/original-function.rs
          if-no-files-found: error
          compression-level: 1
          retention-days: 3
      - name: Upload source-bound host binaries separately
        uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 5
        with:
          name: issue2818-w6-host-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/test-governance/issue2818/ci-evidence/host-binaries/**
          if-no-files-found: warn
          compression-level: 1
          retention-days: 3
