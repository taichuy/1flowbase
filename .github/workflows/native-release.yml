name: Native portable distribution

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build and verify
        type: choice
        default: linux-x64
        options: [linux-x64, linux-arm64, macos-x64, macos-arm64, windows-x64, all]
      release_tag:
        description: Optional new Release tag (for example v0.5.8-native.1); requires all targets
        type: string
        required: false
      publish:
        description: Publish the validated Release as a prerelease (otherwise keep it as a draft)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - name: Validate manual release inputs
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: |
          node <<'NODE'
          require('./scripts/node/native-release/plan.js').validateBuildInputs({
            target: process.env.RELEASE_TARGET, tag: process.env.RELEASE_TAG,
            publish: process.env.RELEASE_PUBLISH === 'true'
          });
          NODE

  build-web-dist:
    needs: validate
    uses: ./.github/workflows/web-build.yml

  build:
    needs:
      - validate
      - build-web-dist
    uses: ./.github/workflows/native-build.yml
    with:
      target: ${{ inputs.target }}
      release_tag: ${{ inputs.release_tag }}

  release:
    if: inputs.release_tag != '' && inputs.target == 'all'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-${{ inputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v4
        with:
          pattern: 1flowbase-*
          merge-multiple: true
          path: native-assets
      - name: Publish single-layer native archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NATIVE_TAG: ${{ inputs.release_tag }}
          NATIVE_PUBLISH: ${{ inputs.publish }}
          NATIVE_SHA: ${{ github.sha }}
        run: node scripts/node/native-release/release.js
