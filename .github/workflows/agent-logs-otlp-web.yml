name: Agent Logs UI artifact evidence
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact candidate source SHA
        type: string
        required: true
  push:
    branches: [codex/agent-logs-otlp-web-ci]
permissions:
  contents: read
concurrency:
  group: agent-logs-otlp-web-${{ inputs.source_ref || github.sha }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  ui-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build exact static UI with finite resource monitoring
        run: node scripts/node/agent-logs-exchange/ci-web.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: agent-logs-otlp-web-${{ inputs.source_ref || github.sha }}
          path: tmp/test-governance/agent-logs-otlp/ci-web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
