name: Native portable build

on:
  workflow_call:
    inputs:
      target:
        type: string
        default: all
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - name: Validate release inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          node <<'NODE'
          require('./scripts/node/native-release/plan.js').validateBuildInputs({ target: process.env.RELEASE_TARGET, tag: process.env.RELEASE_TAG });
          NODE
      - name: Prepare pinned bootstrap resources
        run: node scripts/node/native-release/resources.js tmp/native-resources
      - uses: actions/upload-artifact@v4
        with:
          name: native-bootstrap-resources
          path: tmp/native-resources
      - id: select
        env:
          TARGET: ${{ inputs.target }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const entries = [
            {target:'linux-x64', platform:'linux', arch:'x64', runner:'ubuntu-24.04', suffix:''},
            {target:'linux-arm64', platform:'linux', arch:'arm64', runner:'ubuntu-24.04-arm', suffix:''},
            {target:'macos-x64', platform:'macos', arch:'x64', runner:'macos-15-intel', suffix:''},
            {target:'macos-arm64', platform:'macos', arch:'arm64', runner:'macos-15', suffix:''},
            {target:'windows-x64', platform:'windows', arch:'x64', runner:'windows-2025', suffix:'.exe'}
          ];
          const include = entries.filter(item => process.env.TARGET === 'all' || item.target === process.env.TARGET);
          if (!include.length) throw new Error('Unsupported target');
          console.log('matrix=' + JSON.stringify({include}));
          NODE

  build:
    needs: select
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
      CARGO_INCREMENTAL: '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - name: Identify native compiler and build environment
        id: compiler
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const command = (name, args) => execFileSync(name, args, { encoding: 'utf8' }).trim();
          const compiler = { rustc: command('rustc', ['-vV']), cargo: command('cargo', ['-V']) };
          if (process.platform === 'darwin') {
            compiler.cc = command('xcrun', ['clang', '--version']);
            compiler.sdk = command('xcrun', ['--show-sdk-version']);
          } else if (process.platform === 'linux') {
            compiler.cc = command('cc', ['--version']);
          } else {
            // MSVC is selected by rustc from the Runner's Visual Studio installation.
            compiler.image = process.env.ImageVersion;
          }
          const names = /^(RUSTFLAGS|RUSTC.*|CARGO_ENCODED_RUSTFLAGS|CARGO_(PROFILE|TARGET|BUILD)_.*|CC|CXX|CFLAGS|CXXFLAGS|AR|SDKROOT|MACOSX_DEPLOYMENT_TARGET)$/;
          compiler.flags = Object.fromEntries(Object.entries(process.env).filter(([key]) => names.test(key)).sort(([a], [b]) => a.localeCompare(b)));
          const fingerprint = createHash('sha256').update(JSON.stringify(compiler)).digest('hex');
          const root = 'tmp/test-governance/native-release/backend';
          fs.mkdirSync(root, { recursive: true });
          fs.writeFileSync(`${root}/compiler.json`, JSON.stringify({ compiler, fingerprint, cpus: os.availableParallelism(), memory_bytes: os.totalmem() }, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `fingerprint=${fingerprint}\n`);
          console.log(JSON.stringify({ compiler, fingerprint, cpus: os.availableParallelism(), memory_bytes: os.totalmem() }));
          NODE
      - name: Restore native Cargo downloads
        id: cargo_downloads
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: native-cargo-v1-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('api/Cargo.lock') }}
          restore-keys: |
            native-cargo-v1-${{ runner.os }}-${{ matrix.arch }}-
      - name: Restore native release target
        id: release_target
        uses: actions/cache/restore@v5
        with:
          path: |
            api/target/release
            api/target/cargo-inputs.json
          key: native-target-v1-${{ matrix.target }}-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('scripts/node/container-image-security/restore-cargo-inputs.js', '.cargo/config*', 'api/.cargo/config*') }}-${{ hashFiles('api/Cargo.lock', 'api/**/Cargo.toml', 'api/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            native-target-v1-${{ matrix.target }}-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('scripts/node/container-image-security/restore-cargo-inputs.js', '.cargo/config*', 'api/.cargo/config*') }}-${{ hashFiles('api/Cargo.lock', 'api/**/Cargo.toml', 'api/rust-toolchain.toml') }}-
            native-target-v1-${{ matrix.target }}-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('scripts/node/container-image-security/restore-cargo-inputs.js', '.cargo/config*', 'api/.cargo/config*') }}-
      - name: Restore native checkout timestamps
        run: node scripts/node/container-image-security/restore-cargo-inputs.js api/target/cargo-inputs.json | tee tmp/test-governance/native-release/backend/input-reuse.json
      - name: Fetch pinned PostgreSQL
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { fetchPostgres } = require('./scripts/node/native-release/fetch-postgres.js');
          const root = fetchPostgres(process.env.NATIVE_TARGET, 'tmp/native-postgres');
          fs.appendFileSync(process.env.GITHUB_ENV, `FLOWBASE_TEST_POSTGRES_ROOT=${root}\n`);
          NODE
      - name: Test native behavior and build backend
        id: backend
        run: |
          mkdir -p tmp/test-governance/native-release
          started=$(date +%s)
          export FLOWBASE_NATIVE_CACHE_EVIDENCE_ROOT=tmp/test-governance/native-release/backend
          node --test scripts/node/native-release/_tests/*.test.js scripts/node/container-image-security/_tests/restore-cargo-inputs.test.js
          # Profile the first compilation too: it dominates a cold release build.
          node scripts/node/native-release/build/measure.js tmp/test-governance/native-release/backend/test-compile cargo test --manifest-path api/Cargo.toml --release --locked -p api-server --bin api-server native_distribution --timings
          cp api/target/cargo-timings/cargo-timing.html tmp/test-governance/native-release/backend/test-cargo-timing.html
          cargo test --manifest-path api/Cargo.toml --release --locked -p api-server --bin api-server native_distribution::tests::bundled_postgres_uses_tcp_only -- --ignored --exact
          tested=$(date +%s)
          echo "test_seconds=$((tested - started))" >> "$GITHUB_OUTPUT"
          node scripts/node/native-release/build/measure.js tmp/test-governance/native-release/backend/build cargo build --manifest-path api/Cargo.toml --locked --release -p api-server --bin api-server --bin system_recovery --timings
          cp api/target/cargo-timings/cargo-timing.html tmp/test-governance/native-release/backend/build-cargo-timing.html
          echo "build_seconds=$(($(date +%s) - tested))" >> "$GITHUB_OUTPUT"
      - name: Save native Cargo downloads
        if: ${{ !cancelled() && steps.cargo_downloads.outcome == 'success' && steps.cargo_downloads.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: ${{ steps.cargo_downloads.outputs.cache-primary-key }}
      - name: Save native release target
        if: steps.backend.outcome == 'success' && steps.release_target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            api/target/release
            api/target/cargo-inputs.json
          key: ${{ steps.release_target.outputs.cache-primary-key }}
      - name: Report native backend cache and build time
        if: always()
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          CACHE_EXACT_HIT: ${{ steps.release_target.outputs.cache-hit }}
          TARGET_CACHE_KEY: ${{ steps.release_target.outputs.cache-matched-key }}
          DOWNLOAD_CACHE_KEY: ${{ steps.cargo_downloads.outputs.cache-matched-key }}
          TEST_SECONDS: ${{ steps.backend.outputs.test_seconds }}
          BUILD_SECONDS: ${{ steps.backend.outputs.build_seconds }}
          BUILD_OUTCOME: ${{ steps.backend.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { NATIVE_TARGET: target, GITHUB_SHA: commit, CACHE_EXACT_HIT: exactHit, TEST_SECONDS: tests, BUILD_SECONDS: build, BUILD_OUTCOME: outcome } = process.env;
          const report = { target, commit, cache_exact_hit: exactHit === 'true', target_cache_key: process.env.TARGET_CACHE_KEY || null, download_cache_key: process.env.DOWNLOAD_CACHE_KEY || null, test_seconds: tests ? Number(tests) : null, build_seconds: build ? Number(build) : null, outcome };
          const root = 'tmp/test-governance/native-release/backend';
          fs.mkdirSync(root, { recursive: true });
          report.phases = Object.fromEntries(['test-compile', 'build'].flatMap(name => {
            const file = path.join(root, `${name}.json`);
            if (!fs.existsSync(file)) return [];
            const { wall_seconds, cpu_seconds, max_rss_bytes, rss_scope, exit_code, signal } = JSON.parse(fs.readFileSync(file, 'utf8'));
            return [[name, { wall_seconds, cpu_seconds, max_rss_bytes, rss_scope, exit_code, signal }]];
          }));
          fs.writeFileSync(path.join(root, 'result.json'), JSON.stringify(report, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Native backend (${target})\n\n\x60${JSON.stringify(report)}\x60\n\nTarget and downloads report their matched keys; null means a cache miss.\n`);
          NODE
      - name: Preserve native backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-backend-${{ matrix.target }}
          path: |
            api/target/release/api-server${{ matrix.suffix }}
            api/target/release/system_recovery${{ matrix.suffix }}
          if-no-files-found: error
      - name: Download shared web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: tmp/shared-web
      - name: Verify shared web dist
        run: node scripts/node/native-release/verify-web.js tmp/shared-web
      - uses: actions/download-artifact@v4
        with:
          name: native-bootstrap-resources
          path: tmp/native-resources
      - name: Package native distribution
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_PLATFORM: ${{ matrix.platform }}
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_SUFFIX: ${{ matrix.suffix }}
          NATIVE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node scripts/node/native-release/package.js \
            --platform "$NATIVE_PLATFORM" --arch "$NATIVE_ARCH" \
            --api-binary "api/target/release/api-server$NATIVE_SUFFIX" \
            --recovery-binary "api/target/release/system_recovery$NATIVE_SUFFIX" \
            --web-dir tmp/shared-web/dist --postgres-dir "$FLOWBASE_TEST_POSTGRES_ROOT" --resources-dir tmp/native-resources --out tmp/native-release \
            --version "$(node -e 'const tag = process.env.NATIVE_RELEASE_TAG; console.log(tag ? tag.replace(/^v/, "") : require("./web/app/package.json").version)')"
      - name: Extract and verify the actual distribution archive
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: node scripts/node/native-release/unpack.js "tmp/native-release/1flowbase-$NATIVE_TARGET" tmp/native-extracted
      - name: Verify actual archive through the updater download and extraction path
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          export FLOWBASE_TEST_PACKAGE_ROOT="$(node -e 'console.log(require("node:path").resolve("tmp/native-extracted/1flowbase-" + process.env.NATIVE_TARGET))')"
          export FLOWBASE_TEST_ARCHIVE_PATH="$(node -e 'console.log(require("node:path").resolve("tmp/native-release/1flowbase-" + process.env.NATIVE_TARGET + (process.env.NATIVE_PLATFORM === "windows" ? ".zip" : ".tar.gz")))')"
          cargo test --manifest-path api/Cargo.toml --release --locked -p api-server --bin api-server native_distribution::upgrade::online::tests::packaged_archive_downloads_and_extracts -- --ignored --exact
      - name: Verify packaged application bootstrap and reopen
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          export FLOWBASE_TEST_PACKAGE_ROOT="$(node -e 'console.log(require("node:path").resolve("tmp/native-extracted/1flowbase-" + process.env.NATIVE_TARGET))')"
          cargo test --manifest-path api/Cargo.toml --release --locked -p api-server --bin api-server native_distribution::tests::bootstrap::packaged_application_bootstraps_and_reopens -- --ignored --exact
      - name: Verify direct update, retry and relative-path launcher
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: node scripts/node/native-release/upgrade-smoke.js "tmp/native-extracted/1flowbase-$NATIVE_TARGET" tmp/test-governance/native-release/upgrade
      # Node 24.22.1 bundles undici 7.30.1, whose macOS socket reset path
      # can crash fetch with setTypeOfService EINVAL (nodejs/undici#6075).
      # Node 26.7.0 bundles the fixed undici 8.9.0; only the macOS HTTP probe uses it.
      - name: Use fixed HTTP test runtime on macOS
        if: runner.os == 'macOS'
        uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
      - name: Verify startup, restart and shutdown
        if: runner.os != 'Windows'
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: node scripts/node/native-release/smoke.js "tmp/native-extracted/1flowbase-$NATIVE_TARGET" tmp/test-governance/native-release/smoke
      - uses: actions/upload-artifact@v4
        with:
          name: 1flowbase-${{ matrix.target }}
          path: |
            tmp/native-release/*.tar.gz
            tmp/native-release/*.zip
          if-no-files-found: error

      - name: Preserve bounded native validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.target }}
          path: |
            tmp/test-governance/native-release/**/result.json
            tmp/test-governance/native-release/**/command-*.log
            tmp/test-governance/native-release/**/startup-*.log
            tmp/test-governance/native-release/backend/*.html
            tmp/test-governance/native-release/backend/*.json
            tmp/test-governance/native-release/backend/*.log
          if-no-files-found: ignore
