name: container images

on:
  push:
    branches:
      - latest
    paths:
      - ".github/workflows/container-images.yml"
      - ".github/workflows/native-build.yml"
      - ".github/workflows/web-build.yml"
      - "scripts/node/native-release/**"
      - "VERSION"
      - "docker/api-server.Dockerfile"
      - "docker/web.Dockerfile"
      - "api/Cargo.lock"
      - "api/Cargo.toml"
      - "web/.nvmrc"
      - "web/package.json"
      - "web/app/package.json"
      - "web/pnpm-lock.yaml"
      - "web/pnpm-workspace.yaml"
      - "web/packages/page-protocol/**"
      - "web/packages/page-runtime/**"
      - "web/packages/tailwindcss-catalog/**"
      - "api/apps/api-server/Cargo.toml"
  workflow_dispatch:
    inputs:
      component:
        description: Rebuild one image, or publish both images and all native packages with all (latest branch only).
        required: true
        type: choice
        default: web
        options:
          - all
          - web
          - api-server
      image_tag:
        description: Image tag to publish, for example v0.1.0. Must match the component manifest version.
        required: true
        type: string
      promote_official_tags:
        description: Promote the scanned image to version/latest tags.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: container-images-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.component || github.ref }}
  # Finish the active release instead of cancelling native validation or uploads on the next push.
  cancel-in-progress: false

jobs:
  select-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.select.outputs.enabled }}
      image_tag: ${{ steps.select.outputs.image_tag }}
      old_tag: ${{ steps.select.outputs.old_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select web
        id: select
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          enabled=false
          image_tag=""
          old_tag=""

          if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
            if [[ "$RELEASE_COMPONENT" == "web" || "$RELEASE_COMPONENT" == "all" ]]; then
              enabled=true
              image_tag="$RELEASE_IMAGE_TAG"
            fi
          else
            image_tag="$(node scripts/node/container-image-security/verify-version.js print-tag web)"
            before_sha="${{ github.event.before }}"
            zero_sha="0000000000000000000000000000000000000000"

            if [[ "$before_sha" != "$zero_sha" ]] \
              && git cat-file -e "$before_sha^{commit}" 2>/dev/null \
              && git cat-file -e "$before_sha:web/app/package.json" 2>/dev/null; then
              if old_version="$(git show "$before_sha:web/app/package.json" | node scripts/node/container-image-security/verify-version.js read-stdin-version web)"; then
                old_tag="v${old_version}"
              fi
            fi

            if [[ "$image_tag" != "$old_tag" ]]; then
              enabled=true
            fi
          fi

          {
            echo "enabled=$enabled"
            echo "image_tag=$image_tag"
            echo "old_tag=$old_tag"
          } >> "$GITHUB_OUTPUT"

  select-api-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.select.outputs.enabled }}
      image_tag: ${{ steps.select.outputs.image_tag }}
      old_tag: ${{ steps.select.outputs.old_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select api-server
        id: select
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          enabled=false
          image_tag=""
          old_tag=""

          if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
            if [[ "$RELEASE_COMPONENT" == "api-server" || "$RELEASE_COMPONENT" == "all" ]]; then
              enabled=true
              image_tag="$RELEASE_IMAGE_TAG"
            fi
          else
            image_tag="$(node scripts/node/container-image-security/verify-version.js print-tag api-server)"
            before_sha="${{ github.event.before }}"
            zero_sha="0000000000000000000000000000000000000000"

            if [[ "$before_sha" != "$zero_sha" ]] \
              && git cat-file -e "$before_sha^{commit}" 2>/dev/null \
              && git cat-file -e "$before_sha:api/apps/api-server/Cargo.toml" 2>/dev/null; then
              if old_version="$(git show "$before_sha:api/apps/api-server/Cargo.toml" | node scripts/node/container-image-security/verify-version.js read-stdin-version api-server)"; then
                old_tag="v${old_version}"
              fi
            fi

            if [[ "$image_tag" != "$old_tag" ]]; then
              enabled=true
            fi
          fi

          {
            echo "enabled=$enabled"
            echo "image_tag=$image_tag"
            echo "old_tag=$old_tag"
          } >> "$GITHUB_OUTPUT"

  select-release:
    needs: [select-web, select-api-server]
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.release.outputs.enabled }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - name: Verify release orchestration
        run: node --test scripts/node/native-release/_tests/plan.test.js scripts/node/native-release/_tests/release.test.js
      - id: release
        name: Select the shared Docker and native version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_MANUAL_COMBINED: ${{ github.event_name == 'workflow_dispatch' && inputs.component == 'all' }}
          RELEASE_PROMOTE_OFFICIAL_TAGS: ${{ inputs.promote_official_tags }}
          RELEASE_WEB_ENABLED: ${{ needs.select-web.outputs.enabled }}
          RELEASE_API_ENABLED: ${{ needs.select-api-server.outputs.enabled }}
          RELEASE_WEB_TAG: ${{ needs.select-web.outputs.image_tag }}
          RELEASE_API_TAG: ${{ needs.select-api-server.outputs.image_tag }}
        run: node scripts/node/native-release/plan.js

  build-native:
    needs:
      - select-release
      - build-web-dist
    if: needs.select-release.outputs.enabled == 'true'
    uses: ./.github/workflows/native-build.yml
    with:
      target: all
      release_tag: ${{ needs.select-release.outputs.tag }}

  build-web-dist:
    needs:
      - select-release
      - select-web
    if: needs.select-web.outputs.enabled == 'true' || needs.select-release.outputs.enabled == 'true'
    uses: ./.github/workflows/web-build.yml

  publish-web:
    needs:
      - select-web
      - build-web-dist
    if: needs.select-web.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc

      - uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate web version
        env:
          RELEASE_IMAGE_TAG: ${{ needs.select-web.outputs.image_tag }}
        run: node scripts/node/container-image-security/verify-version.js web "$RELEASE_IMAGE_TAG"

      - name: Verify Docker nginx configuration lifecycle
        run: |
          node --test docker/web/_tests/*.test.cjs scripts/node/docker-deploy/_tests/nginx-websocket.test.js
          docker build --target runtime-base -f docker/web.Dockerfile -t flowbase-nginx-smoke .
          FLOWBASE_NGINX_TEST_IMAGE=flowbase-nginx-smoke node docker/web/_tests/container-smoke.cjs

      - name: Download shared web dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: tmp/shared-web

      - name: Prepare web dist build context
        shell: bash
        run: |
          set -euo pipefail
          node scripts/node/native-release/verify-web.js tmp/shared-web
          mkdir -p tmp/web-dist/amd64 tmp/web-dist/arm64
          cp -a tmp/shared-web/dist tmp/web-dist/amd64/dist
          cp -a tmp/shared-web/dist tmp/web-dist/arm64/dist
          test -f tmp/web-dist/amd64/dist/index.html
          test -f tmp/web-dist/arm64/dist/index.html
          du -sh tmp/web-dist/amd64/dist tmp/web-dist/arm64/dist

      - name: Prepare image references
        id: image_refs
        shell: bash
        run: |
          set -euo pipefail

          scan_tag=scan-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          {
            echo "scan_tag=$scan_tag"
            echo "scan_image_ref=ghcr.io/${{ github.repository_owner }}/1flowbase-web:$scan_tag"
            echo "version_image_ref=ghcr.io/${{ github.repository_owner }}/1flowbase-web:${{ needs.select-web.outputs.image_tag }}"
            echo "latest_image_ref=ghcr.io/${{ github.repository_owner }}/1flowbase-web:latest"
            echo "buildcache_ref=ghcr.io/${{ github.repository_owner }}/1flowbase-web:buildcache"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push prebuilt web scan candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          target: runtime-prebuilt
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image_refs.outputs.scan_image_ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.select-web.outputs.image_tag }}
            org.opencontainers.image.title=1flowbase-web
          build-contexts: |
            web_dist=./tmp/web-dist
          cache-from: |
            type=gha,scope=1flowbase-web-runtime
            type=registry,ref=${{ steps.image_refs.outputs.buildcache_ref }}
          cache-to: |
            type=gha,mode=max,scope=1flowbase-web-runtime
            type=registry,ref=${{ steps.image_refs.outputs.buildcache_ref }},mode=max

      - name: Prepare Trivy report directory
        run: mkdir -p tmp/test-governance

      - name: Generate HIGH Trivy warning report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image_refs.outputs.scan_image_ref }}
          version: v0.70.0
          scanners: vuln
          severity: HIGH
          format: json
          output: tmp/test-governance/trivy-web-high.json
          exit-code: "0"

      - name: Enforce CRITICAL Trivy release gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image_refs.outputs.scan_image_ref }}
          version: v0.70.0
          scanners: vuln
          severity: CRITICAL
          format: json
          output: tmp/test-governance/trivy-web-critical.json
          exit-code: "0"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-governance-trivy-web
          path: tmp/test-governance/trivy-web-*.json
          if-no-files-found: warn

      - name: Promote scanned image to official tags
        if: github.event_name != 'workflow_dispatch' || inputs.promote_official_tags == true || inputs.promote_official_tags == 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image_refs.outputs.version_image_ref }}" \
            --tag "${{ steps.image_refs.outputs.latest_image_ref }}" \
            "${{ steps.image_refs.outputs.scan_image_ref }}"

  build-api-server-binary:
    needs:
      - select-release
      - select-api-server
    if: needs.select-api-server.outputs.enabled == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # Same official multi-arch image used by release run 37279745863 (Rust 1.99.0).
      # Update the version and digest together; the recipe hash invalidates targets.
      RUSTUP_TOOLCHAIN: 1.99.0
      API_RUST_BUILD_IMAGE: rust:1.99.0-slim-bookworm@sha256:452176c0cefca88c0b3184ce85a4eb03e3d4fa05d2afb5366abcba853221019e
    steps:
      - uses: actions/checkout@v5

      # Download caches are independent of the compiler; target caches are not.
      - name: Restore api-server Cargo downloads
        id: cargo_downloads
        uses: actions/cache/restore@v5
        with:
          path: |
            tmp/container-cache/api-server/${{ matrix.arch }}/cargo-registry
            tmp/container-cache/api-server/${{ matrix.arch }}/cargo-git
          key: rust-downloads-api-server-v3-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('api/Cargo.lock') }}
          restore-keys: |
            rust-downloads-api-server-v3-${{ runner.os }}-${{ matrix.arch }}-

      # Hash the build recipe as well as Cargo configuration to isolate incompatible
      # targets. A new commit saves fresh output even when manifests are unchanged.
      - name: Restore api-server release target
        id: release_target
        uses: actions/cache/restore@v5
        with:
          path: tmp/container-cache/api-server/${{ matrix.arch }}/target
          key: rust-release-target-v3-${{ runner.os }}-${{ matrix.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('.github/workflows/container-images.yml', 'scripts/node/container-image-security/restore-cargo-inputs.js', 'api/rust-toolchain.toml', 'api/.cargo/config*') }}-release-${{ hashFiles('api/Cargo.lock', 'api/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-release-target-v3-${{ runner.os }}-${{ matrix.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('.github/workflows/container-images.yml', 'scripts/node/container-image-security/restore-cargo-inputs.js', 'api/rust-toolchain.toml', 'api/.cargo/config*') }}-release-${{ hashFiles('api/Cargo.lock', 'api/**/Cargo.toml') }}-
            rust-release-target-v3-${{ runner.os }}-${{ matrix.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('.github/workflows/container-images.yml', 'scripts/node/container-image-security/restore-cargo-inputs.js', 'api/rust-toolchain.toml', 'api/.cargo/config*') }}-release-

      - name: Build api-server binary on native ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail

          cache_root="tmp/container-cache/api-server/${{ matrix.arch }}"
          artifact_root="tmp/container-artifacts/api-server/${{ matrix.arch }}"
          report_root="tmp/test-governance/rust-release/${{ matrix.arch }}"
          mkdir -p \
            "$cache_root/cargo-registry" \
            "$cache_root/cargo-git" \
            "$cache_root/target" \
            "$artifact_root" "$report_root"
          # Content-checked input mtimes travel inside the target cache. Fresh
          # checkouts otherwise invalidate all local crates despite a cache hit.
          node scripts/node/container-image-security/restore-cargo-inputs.js "$cache_root/target/cargo-inputs.json" | tee "$report_root/input-reuse.json"
          # Docker writes as root, including when compilation fails.
          trap 'sudo chown -R "$(id -u):$(id -g)" "$cache_root" "$report_root"' EXIT

          docker run --rm \
            --platform "linux/${{ matrix.arch }}" \
            -e RUSTUP_TOOLCHAIN \
            -v "$PWD/api:/workspace/api" \
            -v "$PWD/$cache_root/cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/$cache_root/cargo-git:/usr/local/cargo/git" \
            -v "$PWD/$cache_root/target:/workspace/target-cache" \
            -v "$PWD/$artifact_root:/workspace/out" \
            -v "$PWD/$report_root:/workspace/reports" \
            -w /workspace/api \
            "$API_RUST_BUILD_IMAGE" \
            bash -c 'set -euo pipefail
              rustc -Vv | tee /workspace/reports/toolchain.txt
              cargo -V | tee -a /workspace/reports/toolchain.txt
              apt-get update
              apt-get install -y --no-install-recommends build-essential ca-certificates curl pkg-config
              rm -rf /var/lib/apt/lists/*
              rm -rf /workspace/target-cache/cargo-timings
              started=$(date +%s)
              CARGO_TARGET_DIR=/workspace/target-cache cargo build --release -p api-server --bin api-server --bin system_recovery --locked --timings
              echo "cargo_build_seconds=$(($(date +%s) - started))" | tee /workspace/reports/build.env
              cp -a /workspace/target-cache/cargo-timings /workspace/reports/
              install -Dm755 /workspace/target-cache/release/api-server /workspace/out/api-server
              install -Dm755 /workspace/target-cache/release/system_recovery /workspace/out/system_recovery'

          sha256sum "$artifact_root/api-server" | tee "$artifact_root/api-server.sha256"
          sha256sum "$artifact_root/system_recovery" | tee "$artifact_root/system_recovery.sha256"
          ls -lh "$artifact_root/api-server" "$artifact_root/system_recovery"
          {
            echo '### Rust release build (${{ matrix.arch }})'
            echo "Commit: $GITHUB_SHA"
            cat "$report_root/build.env"
            cat "$report_root/input-reuse.json"
            du -sh "$cache_root"/*
            echo 'Cache restore/save durations are recorded in the named Actions steps.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Save only successful builds. Same-SHA reruns reuse the immutable entry;
      # different commits restore the nearest compatible entry and save a new one.
      - name: Save api-server Cargo downloads
        if: steps.cargo_downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            tmp/container-cache/api-server/${{ matrix.arch }}/cargo-registry
            tmp/container-cache/api-server/${{ matrix.arch }}/cargo-git
          key: ${{ steps.cargo_downloads.outputs.cache-primary-key }}

      - name: Save api-server release target
        if: steps.release_target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: tmp/container-cache/api-server/${{ matrix.arch }}/target
          key: ${{ steps.release_target.outputs.cache-primary-key }}

      - name: Report api-server cache reuse
        if: always()
        shell: bash
        env:
          DOWNLOAD_CACHE_KEY: ${{ steps.cargo_downloads.outputs.cache-matched-key }}
          TARGET_CACHE_KEY: ${{ steps.release_target.outputs.cache-matched-key }}
        run: |
          {
            echo "Cargo downloads restored: ${DOWNLOAD_CACHE_KEY:-miss}"
            echo "Release target restored: ${TARGET_CACHE_KEY:-miss}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload api-server build timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-release-timings-${{ matrix.arch }}
          path: tmp/test-governance/rust-release/${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload api-server binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: api-server-binary-${{ matrix.arch }}
          path: tmp/container-artifacts/api-server/${{ matrix.arch }}
          if-no-files-found: error

  publish-api-server:
    needs:
      - select-api-server
      - build-api-server-binary
    if: needs.select-api-server.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate api-server version
        env:
          RELEASE_IMAGE_TAG: ${{ needs.select-api-server.outputs.image_tag }}
        run: node scripts/node/container-image-security/verify-version.js api-server "$RELEASE_IMAGE_TAG"

      - name: Download api-server binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: api-server-binary-*
          path: tmp/api-server-binary-artifacts
          merge-multiple: false

      - name: Prepare api-server binary build context
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tmp/api-server-binaries/amd64 tmp/api-server-binaries/arm64
          cp tmp/api-server-binary-artifacts/api-server-binary-amd64/api-server tmp/api-server-binaries/amd64/api-server
          cp tmp/api-server-binary-artifacts/api-server-binary-arm64/api-server tmp/api-server-binaries/arm64/api-server
          cp tmp/api-server-binary-artifacts/api-server-binary-amd64/system_recovery tmp/api-server-binaries/amd64/system_recovery
          cp tmp/api-server-binary-artifacts/api-server-binary-arm64/system_recovery tmp/api-server-binaries/arm64/system_recovery
          chmod 0755 \
            tmp/api-server-binaries/amd64/api-server \
            tmp/api-server-binaries/arm64/api-server \
            tmp/api-server-binaries/amd64/system_recovery \
            tmp/api-server-binaries/arm64/system_recovery
          sha256sum \
            tmp/api-server-binaries/amd64/api-server \
            tmp/api-server-binaries/arm64/api-server \
            tmp/api-server-binaries/amd64/system_recovery \
            tmp/api-server-binaries/arm64/system_recovery

      - name: Prepare api-server image references
        id: image_refs
        shell: bash
        run: |
          set -euo pipefail

          scan_tag=scan-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          {
            echo "scan_tag=$scan_tag"
            echo "scan_image_ref=ghcr.io/${{ github.repository_owner }}/1flowbase-api-server:$scan_tag"
            echo "version_image_ref=ghcr.io/${{ github.repository_owner }}/1flowbase-api-server:${{ needs.select-api-server.outputs.image_tag }}"
            echo "latest_image_ref=ghcr.io/${{ github.repository_owner }}/1flowbase-api-server:latest"
            echo "buildcache_ref=ghcr.io/${{ github.repository_owner }}/1flowbase-api-server:buildcache"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve official model pricing snapshot
        id: model_pricing_snapshot
        shell: bash
        run: |
          set -euo pipefail
          repository="taichuy/1flowbase-official-plugins"
          commit="$(git ls-remote "https://github.com/${repository}.git" refs/heads/main | awk '{print $1}')"
          test -n "$commit"
          {
            echo "repository=$repository"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push prebuilt api-server scan candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api-server.Dockerfile
          target: runtime-prebuilt
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image_refs.outputs.scan_image_ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.select-api-server.outputs.image_tag }}
            org.opencontainers.image.title=1flowbase-api-server
          build-args: |
            MODEL_PRICING_REPOSITORY=${{ steps.model_pricing_snapshot.outputs.repository }}
            MODEL_PRICING_REF=${{ steps.model_pricing_snapshot.outputs.commit }}
            APPLICATION_TEMPLATE_REPOSITORY=${{ steps.model_pricing_snapshot.outputs.repository }}
            APPLICATION_TEMPLATE_REF=${{ steps.model_pricing_snapshot.outputs.commit }}
          build-contexts: |
            api_server_binaries=./tmp/api-server-binaries
          cache-from: |
            type=gha,scope=1flowbase-api-server-runtime
            type=registry,ref=${{ steps.image_refs.outputs.buildcache_ref }}
          cache-to: |
            type=gha,mode=max,scope=1flowbase-api-server-runtime
            type=registry,ref=${{ steps.image_refs.outputs.buildcache_ref }},mode=max

      - name: Verify offline recovery and PostgreSQL tool provenance
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${{ steps.image_refs.outputs.scan_image_ref }}"
          fixture_network="1flowbase-postgres-client-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fixture_database="1flowbase-postgres-fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$fixture_database" >/dev/null 2>&1 || true
            docker network rm "$fixture_network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$fixture_network" >/dev/null
          docker run -d --rm --platform linux/amd64 \
            --name "$fixture_database" \
            --network "$fixture_network" \
            -e POSTGRES_PASSWORD=fixture-password \
            postgres:18.4-alpine >/dev/null
          docker run --rm --platform linux/amd64 \
            --network "$fixture_network" \
            --entrypoint /bin/sh \
            -e PGPASSWORD=fixture-password \
            "${{ steps.image_refs.outputs.scan_image_ref }}" \
            -ec '
              system_recovery --help >/dev/null
              pg_dump --version | grep -Eq "PostgreSQL\) 18([.]|$)"
              pg_restore --version | grep -Eq "PostgreSQL\) 18([.]|$)"
              until pg_isready -h "'"$fixture_database"'" -U postgres >/dev/null 2>&1; do sleep 1; done
              psql -h "'"$fixture_database"'" -U postgres -d postgres -v ON_ERROR_STOP=1 -c "create table backup_fixture(id integer primary key); insert into backup_fixture values (1);" >/dev/null
              pg_dump -h "'"$fixture_database"'" -U postgres -d postgres --format=custom --file=/tmp/fixture.dump
              pg_restore --list /tmp/fixture.dump | grep -q "TABLE DATA public backup_fixture"
              createdb -h "'"$fixture_database"'" -U postgres restored_fixture
              pg_restore -h "'"$fixture_database"'" -U postgres -d restored_fixture --no-owner /tmp/fixture.dump
              test "$(psql -h "'"$fixture_database"'" -U postgres -d restored_fixture -Atqc "select count(*) from backup_fixture")" = 1
            '

      - name: Prepare Trivy report directory
        run: mkdir -p tmp/test-governance

      - name: Generate HIGH Trivy warning report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image_refs.outputs.scan_image_ref }}
          version: v0.70.0
          scanners: vuln
          severity: HIGH
          format: json
          output: tmp/test-governance/trivy-api-server-high.json
          exit-code: "0"

      - name: Enforce CRITICAL Trivy release gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image_refs.outputs.scan_image_ref }}
          version: v0.70.0
          scanners: vuln
          severity: CRITICAL
          format: json
          output: tmp/test-governance/trivy-api-server-critical.json
          exit-code: "0"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-governance-trivy-api-server
          path: tmp/test-governance/trivy-api-server-*.json
          if-no-files-found: warn

      - name: Promote scanned api-server image to official tags
        if: github.event_name != 'workflow_dispatch' || inputs.promote_official_tags == true || inputs.promote_official_tags == 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image_refs.outputs.version_image_ref }}" \
            --tag "${{ steps.image_refs.outputs.latest_image_ref }}" \
            "${{ steps.image_refs.outputs.scan_image_ref }}"

  publish-release:
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.component == 'all' && inputs.promote_official_tags == true)) && github.ref == 'refs/heads/latest' && needs.select-release.result == 'success' && needs.select-release.outputs.enabled == 'true' && needs.build-native.result == 'success' && (needs.publish-web.result == 'success' || (needs.select-web.outputs.enabled != 'true' && needs.publish-web.result == 'skipped')) && (needs.publish-api-server.result == 'success' || (needs.select-api-server.outputs.enabled != 'true' && needs.publish-api-server.result == 'skipped')) }}
    needs:
      - select-web
      - select-api-server
      - select-release
      - publish-web
      - publish-api-server
      - build-native
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-${{ needs.select-release.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v4
        with:
          pattern: 1flowbase-*
          merge-multiple: true
          path: native-assets
      - name: Publish Docker and native assets in one official Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NATIVE_TAG: ${{ needs.select-release.outputs.tag }}
          NATIVE_SHA: ${{ github.sha }}
          NATIVE_PUBLISH: 'true'
          NATIVE_RELEASE_KIND: combined
        run: node scripts/node/native-release/release.js

  report:
    if: ${{ always() }}
    needs:
      - publish-web
      - publish-api-server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: test-governance-trivy-*
          path: tmp/test-governance
          merge-multiple: true
      - name: Detect Trivy reports
        id: trivy_reports
        shell: bash
        run: |
          if find tmp/test-governance -maxdepth 1 -type f -name 'trivy-*.json' | grep -q .; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.trivy_reports.outputs.has_reports == 'true'
        with:
          node-version-file: web/.nvmrc
      - uses: ./.github/actions/quality-gate
        if: steps.trivy_reports.outputs.has_reports == 'true'
        with:
          scope: container-images
          report_type: cd
          environment: container-images
          publish_issue: "false"
          start_postgres: "false"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v6
        if: always() && steps.trivy_reports.outputs.has_reports == 'true'
        with:
          name: test-governance-container-images
          path: tmp/test-governance
