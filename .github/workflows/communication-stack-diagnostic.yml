name: Communications stack diagnostic
on:
  push:
    branches: [codex/communications-2670]
    paths: [.github/workflows/communication-stack-diagnostic.yml]
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: notification-fixture-only
          POSTGRES_DB: 1flowbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d 1flowbase"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      DATABASE_URL: postgres://postgres:notification-fixture-only@127.0.0.1:5432/1flowbase
      API_DATABASE_URL: postgres://postgres:notification-fixture-only@127.0.0.1:5432/1flowbase
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Verify frozen candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v5
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: notification-subscription-nodebug-${{ runner.os }}-${{ hashFiles('api/Cargo.lock', 'api/**/Cargo.toml') }}-${{ inputs.candidate_sha || github.sha }}
          restore-keys: |
            notification-subscription-nodebug-${{ runner.os }}-${{ hashFiles('api/Cargo.lock', 'api/**/Cargo.toml') }}-
            notification-subscription-nodebug-${{ runner.os }}-
      - name: Capture callback stack at the frozen candidate
        env:
          RUST_MIN_STACK: "2097152"
        run: |
          mkdir -p tmp/test-governance/communications/stack
          sudo apt-get update > tmp/test-governance/communications/stack/debugger-install.log 2>&1
          sudo apt-get install --yes --no-install-recommends gdb >> tmp/test-governance/communications/stack/debugger-install.log 2>&1
          gdb --version > tmp/test-governance/communications/stack/debugger-version.txt
          cargo build --locked --manifest-path api/Cargo.toml -p runtime-extension-sdk --example notification_worker --example notification_authorization_worker --example managed_hook_worker --example managed_event_worker > tmp/test-governance/communications/stack/workers-build.log 2>&1
          export NOTIFICATION_AUTHORIZATION_WORKER_FIXTURE="$GITHUB_WORKSPACE/api/target/debug/examples/notification_authorization_worker"
          export NOTIFICATION_WORKER_FIXTURE="$GITHUB_WORKSPACE/api/target/debug/examples/notification_worker"
          export MANAGED_HOOK_WORKER_FIXTURE="$GITHUB_WORKSPACE/api/target/debug/examples/managed_hook_worker"
          export MANAGED_EVENT_WORKER_FIXTURE="$GITHUB_WORKSPACE/api/target/debug/examples/managed_event_worker"
          cargo test --locked --manifest-path api/Cargo.toml -p api-server --lib --no-run --message-format=json > tmp/test-governance/communications/stack/test-artifacts.jsonl 2> tmp/test-governance/communications/stack/build.log
          test_binary="$(python3 -c 'import json; from pathlib import Path; records=[json.loads(line) for line in Path("tmp/test-governance/communications/stack/test-artifacts.jsonl").read_text().splitlines()]; print(next(r["executable"] for r in records if r.get("reason")=="compiler-artifact" and r.get("executable") and r.get("profile",{}).get("test")))')"
          cat > /tmp/communications-stack.gdb <<'GDB'
          set pagination off
          set print frame-arguments none
          run
          bt 120
          python
          frame = gdb.newest_frame()
          previous = None
          while frame:
              try:
                  sp = int(frame.read_register('rsp'))
                  delta = sp - previous if previous is not None else 0
                  print('STACK_FRAME', frame.level(), hex(sp), 'delta', delta, frame.name())
                  previous = sp
              except Exception as error:
                  print('STACK_UNAVAILABLE', frame.level(), str(error))
              frame = frame.older()
          end
          GDB
          timeout 180s gdb --quiet --batch -x /tmp/communications-stack.gdb --args "$test_binary" --exact communication_runtime::acceptance_tests::pipeline::communication_callback_preserves_configuring_actor_and_sends_final_scoped_reply --nocapture > tmp/test-governance/communications/stack/callback-backtrace.log 2>&1
          git rev-parse HEAD > tmp/test-governance/communications/stack/candidate-sha.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: communication-stack-${{ inputs.candidate_sha || github.sha }}
          path: tmp/test-governance/communications/stack
