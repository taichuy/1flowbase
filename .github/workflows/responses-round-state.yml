name: Responses round state and bounded predecessor reads
on:
  push:
    branches: [codex/responses-round-state]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: responses-round-state-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: gateway-fixture
          POSTGRES_DB: gateway_fixture
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d gateway_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:gateway-fixture@127.0.0.1:5432/gateway_fixture
      API_DATABASE_URL: postgres://postgres:gateway-fixture@127.0.0.1:5432/gateway_fixture
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: gateway-target-handoff
          cache-on-failure: true
          workspaces: api -> target
      - name: Candidate identity and resources
        run: |
          mkdir -p tmp/test-governance/responses-round-state/ci
          git rev-parse HEAD > tmp/test-governance/responses-round-state/ci/source-sha.txt
          jobs=$(node scripts/node/testing/verify-runtime.js cargo-jobs)
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
      - name: Populate locked workspace metadata dependencies
        run: cargo fetch --locked --manifest-path api/Cargo.toml
      - name: Adapter dependency boundary
        run: |
          out=tmp/test-governance/responses-round-state/ci
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-postgres-tests --test dependency_boundaries > "$out/boundaries.log" 2>&1 || { tail -c 6000 "$out/boundaries.log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$out/boundaries.log"
      - name: Stable contracts and translation/history regressions
        run: |
          out=tmp/test-governance/responses-round-state/ci
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-contracts > "$out/contracts.log" 2>&1 || { tail -c 6000 "$out/contracts.log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$out/contracts.log"
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane --features responses-history-migration --lib application_public_api::compat::openai > "$out/translation.log" 2>&1 || { tail -c 6000 "$out/translation.log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$out/translation.log"
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane --lib application_public_api::native_tool_resume > "$out/callback.log" 2>&1 || { tail -c 6000 "$out/callback.log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$out/callback.log"
      - name: Real database callback lifecycle and narrow-read regressions
        run: |
          out=tmp/test-governance/responses-round-state/ci
          cargo test --locked --manifest-path api/Cargo.toml -p storage-durable-postgres --lib responses_raw_answer > "$out/raw-answer.log" 2>&1 || { tail -c 6000 "$out/raw-answer.log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$out/raw-answer.log"
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-postgres-tests --test orchestration_runtime_integration callback_resume -- --test-threads=1 > "$out/postgres.log" 2>&1 || { tail -c 6000 "$out/postgres.log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$out/postgres.log"
      - name: API consumers and previous response regression
        run: |
          out=tmp/test-governance/responses-round-state/ci
          cargo test --locked --manifest-path api/Cargo.toml -p api-server --lib previous_response > "$out/api.log" 2>&1 || { tail -c 6000 "$out/api.log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$out/api.log"
      - name: Build exact candidate for authorized local development verification
        run: |
          out=tmp/test-governance/responses-round-state/ci
          cargo build --locked --manifest-path api/Cargo.toml -p api-server --bin api-server > "$out/build.log" 2>&1 || { tail -c 6000 "$out/build.log"; exit 1; }
          cp api/target/debug/api-server "$out/api-server-candidate"
          sha256sum "$out/api-server-candidate" > "$out/binary.sha256"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: responses-round-state-${{ github.sha }}
          path: tmp/test-governance/responses-round-state/ci
          retention-days: 5
