name: quality gate

on:
  schedule:
    # Daily 02:00 Asia/Shanghai.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: Target branch
        type: string
        default: latest
      scope:
        description: Quality gate scope
        type: choice
        default: ci
        options:
          - ci
          - repo
          - repo-tooling
          - repo-frontend
          - repo-frontend-pr
          - repo-frontend-react-doctor
          - repo-backend
          - repo-backend-static
          - repo-backend-fmt
          - repo-backend-image-llm-vision
          - repo-backend-official-i18n-seed
          - repo-backend-clippy-core-libs
          - repo-backend-clippy-runtime-storage
          - repo-backend-clippy-apps
          - repo-backend-test-core-libs
          - repo-backend-test-runtime-storage
          - repo-backend-test-control-plane
          - repo-backend-test-api-server
          - repo-backend-test-plugin-runner
          - repo-backend-check-core-libs
          - repo-backend-check-runtime-storage
          - repo-backend-check-apps
          - backend
          - backend-consistency
          - state-protocols
          - coverage
          - coverage-frontend
          - coverage-backend
          - coverage-backend-control-plane
          - coverage-backend-orchestration-runtime
          - coverage-backend-plugin-runner
          - coverage-backend-storage-postgres
          - coverage-backend-api-server
          - container-images
      report_type:
        description: Report type
        type: choice
        default: ci
        options:
          - ci
          - cd
      environment:
        description: Optional environment label
        type: string
        required: false

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: quality-gate-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || 'latest' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QUALITY_GATE_TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || 'latest' }}
  QUALITY_GATE_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'ci' }}
  QUALITY_GATE_REPORT_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.report_type || 'ci' }}
  QUALITY_GATE_SCHEDULED_ENVIRONMENT: nightly-latest

jobs:
  single-scope-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope != 'ci' && inputs.scope != 'container-images' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.scope == 'repo-backend-test-api-server' || inputs.scope == 'coverage-backend-api-server') && 120 || 60 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          fetch-depth: 0
      - name: Resolve quality gate target SHA
        run: echo "QUALITY_GATE_TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Resolve release-seeded Rust cache tag
        id: release_seed_tag
        if: ${{ inputs.scope == 'repo' || inputs.scope == 'backend' || inputs.scope == 'backend-consistency' || inputs.scope == 'state-protocols' || inputs.scope == 'repo-backend' || startsWith(inputs.scope, 'repo-backend-') || inputs.scope == 'coverage' || inputs.scope == 'coverage-backend' || startsWith(inputs.scope, 'coverage-backend-') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH:-X64}" in
            ARM64) cache_arch=arm64 ;;
            *) cache_arch=amd64 ;;
          esac
          echo "cache_arch=$cache_arch" >> "$GITHUB_OUTPUT"
          tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || true)"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Resolved release-seeded Rust cache tag: $tag"
          else
            echo "No published release tag found; skipping release-seeded Rust cache restore."
          fi
      - name: Restore release-seeded api-server Rust cache
        id: release_seed_api
        if: ${{ steps.release_seed_tag.outputs.release_tag != '' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            tmp/container-cache/api-server/${{ steps.release_seed_tag.outputs.cache_arch }}/cargo-registry
            tmp/container-cache/api-server/${{ steps.release_seed_tag.outputs.cache_arch }}/cargo-git
            tmp/container-cache/api-server/${{ steps.release_seed_tag.outputs.cache_arch }}/target
          key: rust-release-seeded-api-server-${{ runner.os }}-${{ steps.release_seed_tag.outputs.cache_arch }}-rust-1-slim-bookworm-release-${{ steps.release_seed_tag.outputs.release_tag }}-${{ hashFiles('api/Cargo.lock', 'api/**/*.rs', 'api/**/Cargo.toml') }}
          restore-keys: |
            rust-release-seeded-api-server-${{ runner.os }}-${{ steps.release_seed_tag.outputs.cache_arch }}-rust-1-slim-bookworm-release-${{ steps.release_seed_tag.outputs.release_tag }}-
      - name: Import release-seeded api-server Rust cache
        if: ${{ steps.release_seed_api.outputs.cache-hit != '' }}
        shell: bash
        env:
          RUST_RELEASE_SEEDED_CACHE_ARCH: ${{ steps.release_seed_tag.outputs.cache_arch }}
          CARGO_TARGET_DIR: tmp/quality-gate-cache/rust-single-${{ (inputs.scope == 'coverage' || inputs.scope == 'coverage-backend' || startsWith(inputs.scope, 'coverage-backend-')) && 'coverage' || 'backend' }}/${{ inputs.scope }}/target
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_home/registry" "$cargo_home/git" "$CARGO_TARGET_DIR"
          rsync -a "tmp/container-cache/api-server/$RUST_RELEASE_SEEDED_CACHE_ARCH/cargo-registry/" "$cargo_home/registry/"
          rsync -a "tmp/container-cache/api-server/$RUST_RELEASE_SEEDED_CACHE_ARCH/cargo-git/" "$cargo_home/git/"
          rsync -a "tmp/container-cache/api-server/$RUST_RELEASE_SEEDED_CACHE_ARCH/target/" "$CARGO_TARGET_DIR/"
      - name: Restore Rust single-scope quality gate cache
        if: ${{ inputs.scope == 'repo' || inputs.scope == 'backend' || inputs.scope == 'backend-consistency' || inputs.scope == 'state-protocols' || inputs.scope == 'repo-backend' || startsWith(inputs.scope, 'repo-backend-') || inputs.scope == 'coverage' || inputs.scope == 'coverage-backend' || startsWith(inputs.scope, 'coverage-backend-') }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tmp/quality-gate-cache/rust-single-${{ (inputs.scope == 'coverage' || inputs.scope == 'coverage-backend' || startsWith(inputs.scope, 'coverage-backend-')) && 'coverage' || 'backend' }}/${{ inputs.scope }}/target
          key: rust-quality-gate-${{ (inputs.scope == 'coverage' || inputs.scope == 'coverage-backend' || startsWith(inputs.scope, 'coverage-backend-')) && 'coverage' || 'backend' }}-${{ runner.os }}-${{ inputs.scope }}-${{ hashFiles('api/Cargo.lock', 'api/**/*.rs', 'api/**/Cargo.toml') }}
          restore-keys: |
            rust-quality-gate-${{ (inputs.scope == 'coverage' || inputs.scope == 'coverage-backend' || startsWith(inputs.scope, 'coverage-backend-')) && 'coverage' || 'backend' }}-${{ runner.os }}-${{ inputs.scope }}-${{ hashFiles('api/Cargo.lock') }}-
            rust-quality-gate-${{ (inputs.scope == 'coverage' || inputs.scope == 'coverage-backend' || startsWith(inputs.scope, 'coverage-backend-')) && 'coverage' || 'backend' }}-${{ runner.os }}-${{ inputs.scope }}-
            rust-quality-gate-${{ (inputs.scope == 'coverage' || inputs.scope == 'coverage-backend' || startsWith(inputs.scope, 'coverage-backend-')) && 'coverage' || 'backend' }}-${{ runner.os }}-
      - uses: ./.github/actions/quality-gate
        env:
          CARGO_TARGET_DIR: ../tmp/quality-gate-cache/rust-single-${{ (inputs.scope == 'coverage' || inputs.scope == 'coverage-backend' || startsWith(inputs.scope, 'coverage-backend-')) && 'coverage' || 'backend' }}/${{ inputs.scope }}/target
          GITHUB_REF_NAME: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
          scope: ${{ env.QUALITY_GATE_SCOPE }}
          report_type: ${{ env.QUALITY_GATE_REPORT_TYPE }}
          environment: ${{ github.event_name == 'schedule' && env.QUALITY_GATE_SCHEDULED_ENVIRONMENT || inputs.environment }}
          publish_issue: "true"
          start_postgres: ${{ inputs.scope == 'repo' || inputs.scope == 'backend' || inputs.scope == 'backend-consistency' || inputs.scope == 'state-protocols' || inputs.scope == 'repo-backend' || startsWith(inputs.scope, 'repo-backend-test-') || inputs.scope == 'coverage' || inputs.scope == 'coverage-backend' || startsWith(inputs.scope, 'coverage-backend-') }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-artifacts
          path: tmp/test-governance

  repo-tooling-gate:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          fetch-depth: 0
      - name: Resolve quality gate target SHA
        run: echo "QUALITY_GATE_TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/quality-gate
        env:
          GITHUB_REF_NAME: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
          scope: repo-tooling
          report_type: ${{ env.QUALITY_GATE_REPORT_TYPE }}
          environment: ${{ github.event_name == 'schedule' && env.QUALITY_GATE_SCHEDULED_ENVIRONMENT || inputs.environment }}
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-repo-tooling
          path: tmp/test-governance

  repo-frontend-gate:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
      - name: Resolve quality gate target SHA
        run: echo "QUALITY_GATE_TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - uses: ./.github/actions/quality-gate
        env:
          GITHUB_REF_NAME: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
          scope: repo-frontend
          report_type: ${{ env.QUALITY_GATE_REPORT_TYPE }}
          environment: ${{ github.event_name == 'schedule' && env.QUALITY_GATE_SCHEDULED_ENVIRONMENT || inputs.environment }}
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-repo-frontend
          path: tmp/test-governance

  repo-frontend-react-doctor-gate:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          fetch-depth: 0
      - name: Resolve quality gate target SHA
        run: echo "QUALITY_GATE_TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - uses: ./.github/actions/quality-gate
        env:
          GITHUB_REF_NAME: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
          scope: repo-frontend-react-doctor
          report_type: ${{ env.QUALITY_GATE_REPORT_TYPE }}
          environment: ${{ github.event_name == 'schedule' && env.QUALITY_GATE_SCHEDULED_ENVIRONMENT || inputs.environment }}
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-repo-frontend-react-doctor
          path: tmp/test-governance

  repo-backend-gate:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.scope == 'repo-backend-test-api-server' && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        scope:
          - repo-backend-static
          - repo-backend-fmt
          - repo-backend-image-llm-vision
          - repo-backend-official-i18n-seed
          - repo-backend-clippy-core-libs
          - repo-backend-clippy-runtime-storage
          - repo-backend-clippy-apps
          - repo-backend-test-core-libs
          - repo-backend-test-runtime-storage
          - repo-backend-test-control-plane
          - repo-backend-test-api-server
          - repo-backend-test-plugin-runner
          - repo-backend-check-core-libs
          - repo-backend-check-runtime-storage
          - repo-backend-check-apps
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
      - name: Resolve quality gate target SHA
        run: echo "QUALITY_GATE_TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve release-seeded Rust cache tag
        id: release_seed_tag
        if: ${{ matrix.scope != 'repo-backend-static' && matrix.scope != 'repo-backend-fmt' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH:-X64}" in
            ARM64) cache_arch=arm64 ;;
            *) cache_arch=amd64 ;;
          esac
          echo "cache_arch=$cache_arch" >> "$GITHUB_OUTPUT"
          tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || true)"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Resolved release-seeded Rust cache tag: $tag"
          else
            echo "No published release tag found; skipping release-seeded Rust cache restore."
          fi
      - name: Restore release-seeded api-server Rust cache
        id: release_seed_api
        if: ${{ steps.release_seed_tag.outputs.release_tag != '' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            tmp/container-cache/api-server/${{ steps.release_seed_tag.outputs.cache_arch }}/cargo-registry
            tmp/container-cache/api-server/${{ steps.release_seed_tag.outputs.cache_arch }}/cargo-git
            tmp/container-cache/api-server/${{ steps.release_seed_tag.outputs.cache_arch }}/target
          key: rust-release-seeded-api-server-${{ runner.os }}-${{ steps.release_seed_tag.outputs.cache_arch }}-rust-1-slim-bookworm-release-${{ steps.release_seed_tag.outputs.release_tag }}-${{ hashFiles('api/Cargo.lock', 'api/**/*.rs', 'api/**/Cargo.toml') }}
          restore-keys: |
            rust-release-seeded-api-server-${{ runner.os }}-${{ steps.release_seed_tag.outputs.cache_arch }}-rust-1-slim-bookworm-release-${{ steps.release_seed_tag.outputs.release_tag }}-
      - name: Import release-seeded api-server Rust cache
        if: ${{ steps.release_seed_api.outputs.cache-hit != '' }}
        shell: bash
        env:
          RUST_RELEASE_SEEDED_CACHE_ARCH: ${{ steps.release_seed_tag.outputs.cache_arch }}
          CARGO_TARGET_DIR: tmp/quality-gate-cache/rust-backend/${{ matrix.scope }}/target
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_home/registry" "$cargo_home/git" "$CARGO_TARGET_DIR"
          rsync -a "tmp/container-cache/api-server/$RUST_RELEASE_SEEDED_CACHE_ARCH/cargo-registry/" "$cargo_home/registry/"
          rsync -a "tmp/container-cache/api-server/$RUST_RELEASE_SEEDED_CACHE_ARCH/cargo-git/" "$cargo_home/git/"
          rsync -a "tmp/container-cache/api-server/$RUST_RELEASE_SEEDED_CACHE_ARCH/target/" "$CARGO_TARGET_DIR/"
      - name: Restore Rust backend quality gate cache
        if: ${{ matrix.scope != 'repo-backend-static' && matrix.scope != 'repo-backend-fmt' }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tmp/quality-gate-cache/rust-backend/${{ matrix.scope }}/target
          key: rust-quality-gate-backend-${{ runner.os }}-${{ matrix.scope }}-${{ hashFiles('api/Cargo.lock', 'api/**/*.rs', 'api/**/Cargo.toml') }}
          restore-keys: |
            rust-quality-gate-backend-${{ runner.os }}-${{ matrix.scope }}-${{ hashFiles('api/Cargo.lock') }}-
            rust-quality-gate-backend-${{ runner.os }}-${{ matrix.scope }}-
            rust-quality-gate-backend-${{ runner.os }}-
      - uses: ./.github/actions/quality-gate
        env:
          CARGO_TARGET_DIR: ../tmp/quality-gate-cache/rust-backend/${{ matrix.scope }}/target
          GITHUB_REF_NAME: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
          scope: ${{ matrix.scope }}
          report_type: ${{ env.QUALITY_GATE_REPORT_TYPE }}
          environment: ${{ github.event_name == 'schedule' && env.QUALITY_GATE_SCHEDULED_ENVIRONMENT || inputs.environment }}
          publish_issue: "false"
          start_postgres: ${{ startsWith(matrix.scope, 'repo-backend-test-') }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-${{ matrix.scope }}
          path: tmp/test-governance

  backend-consistency-gate:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
      - name: Resolve quality gate target SHA
        run: echo "QUALITY_GATE_TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve release-seeded Rust cache tag
        id: release_seed_tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH:-X64}" in
            ARM64) cache_arch=arm64 ;;
            *) cache_arch=amd64 ;;
          esac
          echo "cache_arch=$cache_arch" >> "$GITHUB_OUTPUT"
          tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || true)"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Resolved release-seeded Rust cache tag: $tag"
          else
            echo "No published release tag found; skipping release-seeded Rust cache restore."
          fi
      - name: Restore release-seeded api-server Rust cache
        id: release_seed_api
        if: ${{ steps.release_seed_tag.outputs.release_tag != '' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            tmp/container-cache/api-server/${{ steps.release_seed_tag.outputs.cache_arch }}/cargo-registry
            tmp/container-cache/api-server/${{ steps.release_seed_tag.outputs.cache_arch }}/cargo-git
            tmp/container-cache/api-server/${{ steps.release_seed_tag.outputs.cache_arch }}/target
          key: rust-release-seeded-api-server-${{ runner.os }}-${{ steps.release_seed_tag.outputs.cache_arch }}-rust-1-slim-bookworm-release-${{ steps.release_seed_tag.outputs.release_tag }}-${{ hashFiles('api/Cargo.lock', 'api/**/*.rs', 'api/**/Cargo.toml') }}
          restore-keys: |
            rust-release-seeded-api-server-${{ runner.os }}-${{ steps.release_seed_tag.outputs.cache_arch }}-rust-1-slim-bookworm-release-${{ steps.release_seed_tag.outputs.release_tag }}-
      - name: Import release-seeded api-server Rust cache
        if: ${{ steps.release_seed_api.outputs.cache-hit != '' }}
        shell: bash
        env:
          RUST_RELEASE_SEEDED_CACHE_ARCH: ${{ steps.release_seed_tag.outputs.cache_arch }}
          CARGO_TARGET_DIR: tmp/quality-gate-cache/rust-backend-consistency/target
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_home/registry" "$cargo_home/git" "$CARGO_TARGET_DIR"
          rsync -a "tmp/container-cache/api-server/$RUST_RELEASE_SEEDED_CACHE_ARCH/cargo-registry/" "$cargo_home/registry/"
          rsync -a "tmp/container-cache/api-server/$RUST_RELEASE_SEEDED_CACHE_ARCH/cargo-git/" "$cargo_home/git/"
          rsync -a "tmp/container-cache/api-server/$RUST_RELEASE_SEEDED_CACHE_ARCH/target/" "$CARGO_TARGET_DIR/"
      - name: Restore Rust backend consistency quality gate cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tmp/quality-gate-cache/rust-backend-consistency/target
          key: rust-quality-gate-backend-consistency-${{ runner.os }}-${{ hashFiles('api/Cargo.lock', 'api/**/*.rs', 'api/**/Cargo.toml') }}
          restore-keys: |
            rust-quality-gate-backend-consistency-${{ runner.os }}-${{ hashFiles('api/Cargo.lock') }}-
            rust-quality-gate-backend-consistency-${{ runner.os }}-
      - uses: ./.github/actions/quality-gate
        env:
          CARGO_TARGET_DIR: ../tmp/quality-gate-cache/rust-backend-consistency/target
          GITHUB_REF_NAME: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
          scope: backend-consistency
          report_type: ${{ env.QUALITY_GATE_REPORT_TYPE }}
          environment: ${{ github.event_name == 'schedule' && env.QUALITY_GATE_SCHEDULED_ENVIRONMENT || inputs.environment }}
          publish_issue: "false"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-backend-consistency
          path: tmp/test-governance

  coverage-frontend-gate:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
      - name: Resolve quality gate target SHA
        run: echo "QUALITY_GATE_TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - uses: ./.github/actions/quality-gate
        env:
          GITHUB_REF_NAME: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
          scope: coverage-frontend
          report_type: ${{ env.QUALITY_GATE_REPORT_TYPE }}
          environment: ${{ github.event_name == 'schedule' && env.QUALITY_GATE_SCHEDULED_ENVIRONMENT || inputs.environment }}
          publish_issue: "false"
          start_postgres: "false"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-coverage-frontend
          path: tmp/test-governance

  coverage-backend-gate:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.scope == 'coverage-backend-api-server' && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        scope:
          - coverage-backend-control-plane
          - coverage-backend-orchestration-runtime
          - coverage-backend-plugin-runner
          - coverage-backend-storage-postgres
          - coverage-backend-api-server
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
      - name: Resolve quality gate target SHA
        run: echo "QUALITY_GATE_TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Resolve release-seeded Rust cache tag
        id: release_seed_tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH:-X64}" in
            ARM64) cache_arch=arm64 ;;
            *) cache_arch=amd64 ;;
          esac
          echo "cache_arch=$cache_arch" >> "$GITHUB_OUTPUT"
          tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || true)"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Resolved release-seeded Rust cache tag: $tag"
          else
            echo "No published release tag found; skipping release-seeded Rust cache restore."
          fi
      - name: Restore release-seeded api-server Rust cache
        id: release_seed_api
        if: ${{ steps.release_seed_tag.outputs.release_tag != '' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            tmp/container-cache/api-server/${{ steps.release_seed_tag.outputs.cache_arch }}/cargo-registry
            tmp/container-cache/api-server/${{ steps.release_seed_tag.outputs.cache_arch }}/cargo-git
            tmp/container-cache/api-server/${{ steps.release_seed_tag.outputs.cache_arch }}/target
          key: rust-release-seeded-api-server-${{ runner.os }}-${{ steps.release_seed_tag.outputs.cache_arch }}-rust-1-slim-bookworm-release-${{ steps.release_seed_tag.outputs.release_tag }}-${{ hashFiles('api/Cargo.lock', 'api/**/*.rs', 'api/**/Cargo.toml') }}
          restore-keys: |
            rust-release-seeded-api-server-${{ runner.os }}-${{ steps.release_seed_tag.outputs.cache_arch }}-rust-1-slim-bookworm-release-${{ steps.release_seed_tag.outputs.release_tag }}-
      - name: Import release-seeded api-server Rust cache
        if: ${{ steps.release_seed_api.outputs.cache-hit != '' }}
        shell: bash
        env:
          RUST_RELEASE_SEEDED_CACHE_ARCH: ${{ steps.release_seed_tag.outputs.cache_arch }}
          CARGO_TARGET_DIR: tmp/quality-gate-cache/rust-coverage/${{ matrix.scope }}/target
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_home/registry" "$cargo_home/git" "$CARGO_TARGET_DIR"
          rsync -a "tmp/container-cache/api-server/$RUST_RELEASE_SEEDED_CACHE_ARCH/cargo-registry/" "$cargo_home/registry/"
          rsync -a "tmp/container-cache/api-server/$RUST_RELEASE_SEEDED_CACHE_ARCH/cargo-git/" "$cargo_home/git/"
          rsync -a "tmp/container-cache/api-server/$RUST_RELEASE_SEEDED_CACHE_ARCH/target/" "$CARGO_TARGET_DIR/"
      - name: Restore Rust coverage quality gate cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tmp/quality-gate-cache/rust-coverage/${{ matrix.scope }}/target
          key: rust-quality-gate-coverage-${{ runner.os }}-${{ matrix.scope }}-${{ hashFiles('api/Cargo.lock', 'api/**/*.rs', 'api/**/Cargo.toml') }}
          restore-keys: |
            rust-quality-gate-coverage-${{ runner.os }}-${{ matrix.scope }}-${{ hashFiles('api/Cargo.lock') }}-
            rust-quality-gate-coverage-${{ runner.os }}-${{ matrix.scope }}-
            rust-quality-gate-coverage-${{ runner.os }}-
      - uses: ./.github/actions/quality-gate
        env:
          CARGO_TARGET_DIR: ../tmp/quality-gate-cache/rust-coverage/${{ matrix.scope }}/target
          GITHUB_REF_NAME: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
          scope: ${{ matrix.scope }}
          report_type: ${{ env.QUALITY_GATE_REPORT_TYPE }}
          environment: ${{ github.event_name == 'schedule' && env.QUALITY_GATE_SCHEDULED_ENVIRONMENT || inputs.environment }}
          publish_issue: "false"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-${{ matrix.scope }}
          path: tmp/test-governance

  container-images-gate:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'ci' || inputs.scope == 'container-images')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
      - name: Resolve quality gate target SHA
        run: echo "QUALITY_GATE_TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Prepare Trivy report directory
        run: mkdir -p tmp/test-governance
      - name: Generate web HIGH Trivy warning report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/1flowbase-web:latest
          version: v0.70.0
          scanners: vuln
          severity: HIGH
          format: json
          output: tmp/test-governance/trivy-web-high.json
          exit-code: "0"
      - name: Generate web CRITICAL Trivy gate report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/1flowbase-web:latest
          version: v0.70.0
          scanners: vuln
          severity: CRITICAL
          format: json
          output: tmp/test-governance/trivy-web-critical.json
          exit-code: "0"
      - name: Generate api-server HIGH Trivy warning report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/1flowbase-api-server:latest
          version: v0.70.0
          scanners: vuln
          severity: HIGH
          format: json
          output: tmp/test-governance/trivy-api-server-high.json
          exit-code: "0"
      - name: Generate api-server CRITICAL Trivy gate report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/1flowbase-api-server:latest
          version: v0.70.0
          scanners: vuln
          severity: CRITICAL
          format: json
          output: tmp/test-governance/trivy-api-server-critical.json
          exit-code: "0"
      - name: Generate plugin-runner HIGH Trivy warning report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/1flowbase-plugin-runner:latest
          version: v0.70.0
          scanners: vuln
          severity: HIGH
          format: json
          output: tmp/test-governance/trivy-plugin-runner-high.json
          exit-code: "0"
      - name: Generate plugin-runner CRITICAL Trivy gate report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/1flowbase-plugin-runner:latest
          version: v0.70.0
          scanners: vuln
          severity: CRITICAL
          format: json
          output: tmp/test-governance/trivy-plugin-runner-critical.json
          exit-code: "0"
      - uses: ./.github/actions/quality-gate
        env:
          GITHUB_REF_NAME: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
          scope: container-images
          report_type: ${{ env.QUALITY_GATE_REPORT_TYPE }}
          environment: ${{ github.event_name == 'schedule' && env.QUALITY_GATE_SCHEDULED_ENVIRONMENT || inputs.environment || 'container-images' }}
          publish_issue: "false"
          start_postgres: "false"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-container-images
          path: tmp/test-governance

  ai-gateway-protocol-conformance:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'ci') }}
    uses: ./.github/workflows/ai-gateway-concurrency.yml
    with:
      target_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || 'latest' }}

  aggregate:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'ci')) }}
    needs:
      - repo-tooling-gate
      - repo-frontend-gate
      - repo-frontend-react-doctor-gate
      - repo-backend-gate
      - backend-consistency-gate
      - coverage-frontend-gate
      - coverage-backend-gate
      - container-images-gate
      - ai-gateway-protocol-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
      - name: Resolve quality gate target SHA
        run: echo "QUALITY_GATE_TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v6
        with:
          pattern: test-governance-*
          path: tmp/test-governance/parallel
          merge-multiple: false
      - run: node scripts/node/cli/github-quality-gate-aggregate.js
        env:
          GITHUB_REF_NAME: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
          INPUT_ARTIFACT_ROOT: tmp/test-governance/parallel
          INPUT_REPORT_TYPE: ${{ env.QUALITY_GATE_REPORT_TYPE }}
          INPUT_ENVIRONMENT: ${{ github.event_name == 'schedule' && env.QUALITY_GATE_SCHEDULED_ENVIRONMENT || inputs.environment }}
          INPUT_EXPECTED_SCOPES: 'repo-tooling,repo-frontend,repo-frontend-react-doctor,repo-backend-static,repo-backend-fmt,repo-backend-image-llm-vision,repo-backend-official-i18n-seed,repo-backend-clippy-core-libs,repo-backend-clippy-runtime-storage,repo-backend-clippy-apps,repo-backend-test-core-libs,repo-backend-test-runtime-storage,repo-backend-test-control-plane,repo-backend-test-api-server,repo-backend-test-plugin-runner,repo-backend-check-core-libs,repo-backend-check-runtime-storage,repo-backend-check-apps,backend-consistency,coverage-frontend,coverage-backend-control-plane,coverage-backend-orchestration-runtime,coverage-backend-plugin-runner,coverage-backend-storage-postgres,coverage-backend-api-server,container-images,ai-gateway-protocol-conformance'
          INPUT_PUBLISH_ISSUE: "true"
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-governance-artifacts
          path: tmp/test-governance
