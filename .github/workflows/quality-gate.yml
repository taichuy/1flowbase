        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/quality-gate-cache/rust-backend/${{ matrix.scope }}/target
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path api/Cargo.toml -p runtime-extension-sdk --example managed_hook_worker
          cargo build --locked --manifest-path api/Cargo.toml -p runtime-extension-sdk --example managed_event_worker
          strip --strip-debug "$CARGO_TARGET_DIR/debug/examples/managed_hook_worker"
          strip --strip-debug "$CARGO_TARGET_DIR/debug/examples/managed_event_worker"
          echo "MANAGED_HOOK_WORKER_FIXTURE=$CARGO_TARGET_DIR/debug/examples/managed_hook_worker" >> "$GITHUB_ENV"
          echo "MANAGED_EVENT_WORKER_FIXTURE=$CARGO_TARGET_DIR/debug/examples/managed_event_worker" >> "$GITHUB_ENV"
      - uses: ./.github/actions/quality-gate
        env:
          RUSTUP_TOOLCHAIN: ${{ startsWith(matrix.scope, 'repo-backend-clippy-') && '1.98.1' || 'stable' }}
          CARGO_TARGET_DIR: ../tmp/quality-gate-cache/rust-backend/${{ matrix.scope }}/target
          GITHUB_REF_NAME: ${{ env.QUALITY_GATE_TARGET_BRANCH }}
          GITHUB_SHA: ${{ env.QUALITY_GATE_TARGET_SHA }}
        with:
