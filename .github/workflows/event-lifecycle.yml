name: Event lifecycle acceptance

on:
  push:
    branches: [codex/event-lifecycle-20261018, codex/memory-event-governance-20261018]
    paths:
      - api/**
      - docs/architecture/plugin-lifecycle-contracts*
      - .github/workflows/event-lifecycle.yml
  workflow_dispatch:
    inputs:
      scope:
        description: Full acceptance or a scoped evidence supplement
        type: choice
        default: full
        options: [full, managed-resume, memory-governance-supplement, event-center, event-center-supplement, system-event-center]

permissions:
  contents: read

concurrency:
  group: event-lifecycle-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  acceptance:
    if: inputs.scope != 'event-center' && inputs.scope != 'event-center-supplement' && inputs.scope != 'system-event-center'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lifecycle-fixture-only
          POSTGRES_DB: lifecycle_fixture
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d lifecycle_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:lifecycle-fixture-only@127.0.0.1:5432/lifecycle_fixture
      API_DATABASE_URL: postgres://postgres:lifecycle-fixture-only@127.0.0.1:5432/lifecycle_fixture
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: event-lifecycle-nodebug-${{ runner.os }}-${{ hashFiles('api/Cargo.lock', 'api/**/Cargo.toml') }}
          restore-keys: |
            notification-subscription-nodebug-${{ runner.os }}-
            event-lifecycle-nodebug-${{ runner.os }}-
      - name: Freeze source and resources
        run: |
          mkdir -p tmp/test-governance/event-lifecycle/ci
          git rev-parse HEAD > tmp/test-governance/event-lifecycle/ci/source-sha.txt
          jobs=$(node scripts/node/testing/verify-runtime.js cargo-jobs)
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
      - name: Prepare locked dependencies for offline boundary audit
        if: inputs.scope != 'managed-resume'
        run: |
          cargo fetch --locked --manifest-path api/Cargo.toml > tmp/test-governance/event-lifecycle/ci/dependency-fetch.log 2>&1 || { tail -c 7000 tmp/test-governance/event-lifecycle/ci/dependency-fetch.log; exit 1; }
      - name: Event delivery, migration and current backup Test Batch
        if: inputs.scope != 'managed-resume' && inputs.scope != 'memory-governance-supplement'
        shell: bash
        run: |
          set -euo pipefail
          evidence=tmp/test-governance/event-lifecycle/ci
          failed=0
          run_tests() {
            label="$1"
            shift
            if cargo test --locked --manifest-path api/Cargo.toml "$@" > "$evidence/$label.log" 2>&1; then
              node scripts/node/verify/cargo-test-results.js "$evidence/$label.log" || failed=1
            else
              tail -c 7000 "$evidence/$label.log"
              failed=1
            fi
          }
          run_tests contracts -p control-plane-contracts
          run_tests memory -p storage-ephemeral --lib
          run_tests infrastructure-contracts -p control-plane --lib infrastructure_contracts_are_object_safe_and_async
          run_tests host-memory -p api-server --test api_private_contracts _tests::host_infrastructure
          run_tests dependencies -p control-plane-postgres-tests --test dependency_boundaries
          run_tests outbox -p storage-durable-postgres --lib lifecycle_outbox_repository_tests
          run_tests publication -p storage-durable-postgres --lib notification_publication
          run_tests retirement -p storage-durable-postgres --lib legacy_retirement
          run_tests backup -p storage-durable-postgres --lib system_backup::selective
          run_tests billing -p storage-durable-postgres --lib billing_repository_tests
          run_tests dispatcher -p control-plane --lib lifecycle_outbox_dispatcher
          run_tests effects -p control-plane-postgres-tests --test durable_event_bus
          run_tests activation -p api-server --lib host_infrastructure::event_bus_activation
          run_tests responses-ws -p api-server --test api_public_api routes::application_public_api::responses_websocket
          run_tests responses-sse -p api-server --test api_public_api routes::application_public_api::compat_sse::tests::protocol_projection
          test "$failed" = 0
      - name: Supplemental dependency boundary evidence
        if: inputs.scope == 'memory-governance-supplement'
        run: |
          log=tmp/test-governance/event-lifecycle/ci/dependencies.log
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-postgres-tests --test dependency_boundaries > "$log" 2>&1 || { tail -c 7000 "$log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$log"
      - name: Managed delivery resume and current authority
        shell: bash
        run: |
          set -euo pipefail
          evidence=tmp/test-governance/event-lifecycle/ci
          cargo build --locked --manifest-path api/Cargo.toml -p runtime-extension-sdk --example managed_event_worker > "$evidence/managed-worker-build.log" 2>&1 || { tail -c 7000 "$evidence/managed-worker-build.log"; exit 1; }
          export MANAGED_EVENT_WORKER_FIXTURE="$GITHUB_WORKSPACE/api/target/debug/examples/managed_event_worker"
          cargo test --locked --manifest-path api/Cargo.toml -p api-server --test api_private_contracts _tests::extension_bus::managed_governance_tests::pause_revoke_retire::root_2007_ac_009_pause_revoke_retire -- --exact > "$evidence/managed-resume.log" 2>&1 || { tail -c 7000 "$evidence/managed-resume.log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$evidence/managed-resume.log"
      - name: Prove processing guards enforce shared admission
        if: inputs.scope != 'managed-resume'
        shell: bash
        run: |
          set -euo pipefail
          source=api/crates/storage/ephemeral/src/local/memory_event_bus.rs
          trap 'git restore --source=HEAD -- "$source"' EXIT
          python3 - <<'PYMUTATION'
          from pathlib import Path
          source = Path("api/crates/storage/ephemeral/src/local/memory_event_bus.rs")
          content = source.read_text()
          condition = "state.entries.len() < limits.max_items\n                    && upper <= limits.max_json_bytes - state.charged_json_bytes"
          assert content.count(condition) == 1
          source.write_text(content.replace(condition, "true"))
          PYMUTATION
          log=tmp/test-governance/event-lifecycle/ci/controlled-negative.log
          if cargo test --locked --manifest-path api/Cargo.toml -p storage-ephemeral --lib shared_item_and_byte_budget_includes_in_flight_and_releases_on_drop -- --nocapture > "$log" 2>&1; then
            echo "Controlled negative unexpectedly passed"
            exit 1
          fi
          grep -q 'shared_item_and_byte_budget_includes_in_flight_and_releases_on_drop.*FAILED' "$log"
          grep -q 'test result: FAILED. 0 passed; 1 failed;' "$log"
          echo "The fixture rejected admission that ignores live processing charges."
      - name: Build runtime candidate
        run: |
          cargo build --locked --manifest-path api/Cargo.toml -p api-server --bin api-server > tmp/test-governance/event-lifecycle/ci/build.log 2>&1 || { tail -c 7000 tmp/test-governance/event-lifecycle/ci/build.log; exit 1; }
          cp api/target/debug/api-server tmp/test-governance/event-lifecycle/ci/api-server-candidate
          sha256sum tmp/test-governance/event-lifecycle/ci/api-server-candidate > tmp/test-governance/event-lifecycle/ci/binary-sha256.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: event-lifecycle-${{ github.sha }}
          if-no-files-found: error
          path: tmp/test-governance/event-lifecycle/ci

  event-center-acceptance:
    if: inputs.scope == 'event-center' || inputs.scope == 'event-center-supplement' || inputs.scope == 'system-event-center'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: event-center-fixture-only
          POSTGRES_DB: event_center_fixture
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d event_center_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:event-center-fixture-only@127.0.0.1:5432/event_center_fixture
      API_DATABASE_URL: postgres://postgres:event-center-fixture-only@127.0.0.1:5432/event_center_fixture
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v5
        id: event-center-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: event-center-nodebug-${{ runner.os }}-${{ hashFiles('api/Cargo.lock', 'api/**/Cargo.toml') }}
          restore-keys: |
            event-lifecycle-nodebug-${{ runner.os }}-
            notification-subscription-nodebug-${{ runner.os }}-
      - name: Freeze candidate and record runner resources
        run: |
          mkdir -p tmp/test-governance/event-center/ci
          git rev-parse HEAD > tmp/test-governance/event-center/ci/source-sha.txt
          free -b > tmp/test-governance/event-center/ci/memory.txt
          nproc > tmp/test-governance/event-center/ci/cpus.txt
          jobs=$(node scripts/node/testing/verify-runtime.js cargo-jobs)
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
      - name: Event Center host and affected route acceptance
        shell: bash
        env:
          EVIDENCE_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          evidence=tmp/test-governance/event-center/ci
          failed=0
          run_tests() {
            label="$1"
            shift
            if cargo test --locked --manifest-path api/Cargo.toml -p api-server --features test-support "$@" -- --test-threads=1 > "$evidence/$label.log" 2>&1; then
              node scripts/node/verify/cargo-test-results.js "$evidence/$label.log" || failed=1
            else
              tail -c 7000 "$evidence/$label.log"
              failed=1
            fi
          }
          run_crate_tests() {
            label="$1"
            shift
            if cargo test --locked --manifest-path api/Cargo.toml "$@" -- --test-threads=1 > "$evidence/$label.log" 2>&1; then
              node scripts/node/verify/cargo-test-results.js "$evidence/$label.log" || failed=1
            else
              tail -c 7000 "$evidence/$label.log"
              failed=1
            fi
          }
          if [ "$EVIDENCE_SCOPE" = system-event-center ]; then
            run_crate_tests source-contracts -p control-plane-contracts --lib
            run_crate_tests source-ingress -p control-plane --lib event_center
            run_crate_tests reliable-dispatch -p control-plane --lib lifecycle_outbox_dispatcher
            run_crate_tests runtime-persistence -p control-plane --lib after_commit_lanes
            run_crate_tests event-bus -p storage-ephemeral --lib memory_event_bus
            run_crate_tests durable-queue -p storage-durable-postgres --lib lifecycle_outbox_repository_tests
            run_crate_tests durable-publications -p storage-durable-postgres --lib notification_publication
            run_crate_tests source-configuration -p control-plane-postgres-tests --test event_center_configuration
            run_tests runtime-sources --test api_private_contracts _tests::runtime_event_stream
            run_tests source-workflows --test api_private_contracts workers::event_workflow
            run_tests source-catalog --test api_system_settings event_center
            run_tests source-mcp-lineage --test api_private_routes system_event_center_mcp_spawn_preserves_causal_lineage
            run_tests source-authority --test api_private_contracts event_center_operations_compile_as_new_authority_without_legacy_grants
            run_tests source-command-workflow --lib communication_runtime::commands
            run_tests source-applications --test api_application workflow
          elif [ "$EVIDENCE_SCOPE" = event-center-supplement ]; then
            run_tests activation-restoration --test api_private_contracts activation_decision_controls_real_subscribed_signal_and_restoration_does_not_replay
          else
            run_tests host-lifecycle --test api_private_contracts workers::event_workflow
            run_tests event-authority --test api_private_contracts event_center_operations_compile_as_new_authority_without_legacy_grants
            run_tests command-workflow --lib communication_runtime::commands
            run_tests applications --test api_application workflow
          fi
          run_tests communications --test api_private_routes routes::communications
          test "$failed" = 0
      - name: Build matching system-event local verification candidate
        if: inputs.scope == 'system-event-center'
        shell: bash
        run: |
          set -euo pipefail
          evidence=tmp/test-governance/event-center/ci
          cargo build --locked --manifest-path api/Cargo.toml -p api-server --bin api-server > "$evidence/build.log" 2>&1 || { tail -c 7000 "$evidence/build.log"; exit 1; }
          cp api/target/debug/api-server "$evidence/api-server-candidate"
          sha256sum "$evidence/api-server-candidate" > "$evidence/binary-sha256.txt"
      - uses: actions/cache/save@v5
        if: ${{ always() && !cancelled() && steps.event-center-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: ${{ steps.event-center-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: event-center-${{ github.sha }}
          if-no-files-found: error
          path: tmp/test-governance/event-center/ci
