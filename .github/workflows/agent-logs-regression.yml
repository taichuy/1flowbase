name: Agent Logs regression

on:
  # Full frontend/backend and foundation suites own continuous integration.
  # This finite diagnostic batch accepts an exact candidate, independent of delivery branches.
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact candidate SHA or ref to verify
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: agent-logs-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  DATABASE_URL: postgres://postgres:agent-logs-test@localhost:5432/agent_logs
  API_DATABASE_URL: postgres://postgres:agent-logs-test@localhost:5432/agent_logs

jobs:
  contracts-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: agent-logs-test
          POSTGRES_DB: agent_logs
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_logs"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: agent-logs-regression-${{ runner.os }}-${{ hashFiles('api/Cargo.lock', 'api/**/Cargo.toml') }}
      - name: Resolve candidate and repository Cargo resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/test-governance/agent-logs-regression
          git rev-parse HEAD > tmp/test-governance/agent-logs-regression/source-sha.txt
          jobs=$(node scripts/node/testing/verify-runtime.js cargo-jobs)
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
      - name: Current input and interrupted turn projection upgrade
        id: projection
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 api/crates/storage/durable/postgres/src/orchestration_runtime_repository/application_run_logs/_tests/test_cost_snapshot.py > tmp/test-governance/agent-logs-regression/projection-driver.log 2>&1; then
            cp tmp/test-governance/application-log-cost-sql.log tmp/test-governance/agent-logs-regression/projection-sql.log
            tail -c 4000 tmp/test-governance/agent-logs-regression/projection-sql.log
            exit 1
          fi
          cp tmp/test-governance/application-log-cost-sql.log tmp/test-governance/agent-logs-regression/projection-sql.log
      - name: Responses current user text and identity independence
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane application_public_api::compat::openai::tests > tmp/test-governance/agent-logs-regression/openai-input.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/openai-input.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/openai-input.log
      - name: Native canonical current input projection
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-postgres-tests --test orchestration_runtime_integration application_logs::run_conversation_native_projection > tmp/test-governance/agent-logs-regression/native-input.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/native-input.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/native-input.log
      - name: Callback progress and concurrent native deletion
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-postgres-tests --test orchestration_runtime_integration application_logs::native_log_deletion > tmp/test-governance/agent-logs-regression/native-deletion.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/native-deletion.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/native-deletion.log
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-postgres-tests --test orchestration_runtime_integration callback_resume > tmp/test-governance/agent-logs-regression/callback-resume.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/callback-resume.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/callback-resume.log
      - name: Canonical protocol and deletion scope
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-contracts agent_logs > tmp/test-governance/agent-logs-regression/contracts.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/contracts.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/contracts.log
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-contracts log_query > tmp/test-governance/agent-logs-regression/query-contracts.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/query-contracts.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/query-contracts.log
      - name: Real service, migrations, deletion and imported read models
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-postgres-tests --test orchestration_runtime_integration application_logs::agent_logs > tmp/test-governance/agent-logs-regression/postgres.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/postgres.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/postgres.log
      - name: Console authentication, CSRF and Canonical binding
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p api-server agent_logs_delete > tmp/test-governance/agent-logs-regression/console.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/console.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/console.log
      - name: Unified log queries and authenticated semantic locators
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p api-server agent_logs_unified_query > tmp/test-governance/agent-logs-regression/query-console.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/query-console.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/query-console.log
          cargo test --locked --manifest-path api/Cargo.toml -p api-server routes::settings_group::mcp_management::debug_execute > tmp/test-governance/agent-logs-regression/query-wrapper.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/query-wrapper.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/query-wrapper.log
      - name: Compiled Console operation registration and migration boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p api-server console_route_assembly > tmp/test-governance/agent-logs-regression/registry.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/registry.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/registry.log
          cargo test --locked --manifest-path api/Cargo.toml -p api-server console_policy_migration > tmp/test-governance/agent-logs-regression/policy.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/policy.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/policy.log
      - name: Existing canonical storage and native consumers
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-postgres-tests --test orchestration_runtime_integration storage_foundation > tmp/test-governance/agent-logs-regression/canonical.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/canonical.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/canonical.log
      - name: Exact viewport acquisition for native client and workflow trajectories
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p storage-durable-postgres client_trajectory > tmp/test-governance/agent-logs-regression/client-trajectory.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/client-trajectory.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/client-trajectory.log
          cargo test --locked --manifest-path api/Cargo.toml -p storage-durable-postgres workflow_ > tmp/test-governance/agent-logs-regression/workflow-trajectory.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/workflow-trajectory.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/workflow-trajectory.log
      - name: Authorized native and workflow viewport read routes
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p api-server application_runtime_run_trajectory_and_payload_sections_are_scoped_lazy_and_authorized > tmp/test-governance/agent-logs-regression/native-routes.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/native-routes.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/native-routes.log
          cargo test --locked --manifest-path api/Cargo.toml -p api-server workflow_trajectory_routes_preserve_authorization_filters_and_selected_body_scope > tmp/test-governance/agent-logs-regression/workflow-routes.log 2>&1 || { tail -c 4000 tmp/test-governance/agent-logs-regression/workflow-routes.log; exit 1; }
          node scripts/node/verify/cargo-test-results.js tmp/test-governance/agent-logs-regression/workflow-routes.log
      - name: Preserve SQL regression failure after independent Rust evidence
        if: ${{ always() && steps.projection.outcome == 'failure' }}
        run: exit 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: agent-logs-regression
          path: tmp/test-governance/agent-logs-regression
