name: Agent Logs regression

on:
  # Full frontend/backend and foundation suites own continuous integration.
  # This finite diagnostic batch accepts an exact candidate, independent of delivery branches.
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact candidate SHA or ref to verify
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: agent-logs-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  DATABASE_URL: postgres://postgres:agent-logs-test@localhost:5432/agent_logs
  API_DATABASE_URL: postgres://postgres:agent-logs-test@localhost:5432/agent_logs

jobs:
  contracts-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: agent-logs-test
          POSTGRES_DB: agent_logs
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_logs"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: agent-logs-regression-${{ runner.os }}-${{ hashFiles('api/Cargo.lock', 'api/**/Cargo.toml') }}
      - name: Resolve candidate and repository Cargo resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/test-governance/agent-logs-regression
          git rev-parse HEAD > tmp/test-governance/agent-logs-regression/source-sha.txt
          jobs=$(node scripts/node/testing/verify-runtime.js cargo-jobs)
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
      - name: Canonical protocol and deletion scope
        shell: bash
        run: |
          set -euo pipefail
          filters=(agent_logs log_query)
          log=tmp/test-governance/agent-logs-regression/contracts.log
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-contracts \
            -- "${filters[@]}" --format=pretty --color=never \
            > "$log" 2>&1 || { tail -c 4000 "$log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$log" -- "${filters[@]}"
      - name: Real service, migrations, deletion and imported read models
        shell: bash
        run: |
          set -euo pipefail
          filters=(application_logs::agent_logs)
          log=tmp/test-governance/agent-logs-regression/postgres.log
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-postgres-tests \
            --test orchestration_runtime_integration \
            -- "${filters[@]}" --format=pretty --color=never \
            > "$log" 2>&1 || { tail -c 4000 "$log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$log" -- "${filters[@]}"
      - name: Console authorization, unified queries, registration and trajectory routes
        shell: bash
        run: |
          set -euo pipefail
          filters=(
            agent_logs_delete
            agent_logs_unified_query
            routes::settings_group::mcp_management::debug_execute
            console_route_assembly
            console_policy_migration
            application_runtime_run_trajectory_and_payload_sections_are_scoped_lazy_and_authorized
            workflow_trajectory_routes_preserve_authorization_filters_and_selected_body_scope
          )
          log=tmp/test-governance/agent-logs-regression/api-server.log
          cargo test --locked --manifest-path api/Cargo.toml -p api-server \
            -- "${filters[@]}" --format=pretty --color=never \
            > "$log" 2>&1 || { tail -c 4000 "$log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$log" -- "${filters[@]}"
      - name: Existing canonical storage and native consumers
        shell: bash
        run: |
          set -euo pipefail
          # Keep this integration selection in a separate Cargo process.
          filters=(storage_foundation)
          log=tmp/test-governance/agent-logs-regression/canonical.log
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane-postgres-tests \
            --test orchestration_runtime_integration \
            -- "${filters[@]}" --format=pretty --color=never \
            > "$log" 2>&1 || { tail -c 4000 "$log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$log" -- "${filters[@]}"
      - name: Exact viewport acquisition for native client and workflow trajectories
        shell: bash
        run: |
          set -euo pipefail
          filters=(client_trajectory workflow_)
          log=tmp/test-governance/agent-logs-regression/trajectories.log
          cargo test --locked --manifest-path api/Cargo.toml -p storage-durable-postgres \
            -- "${filters[@]}" --format=pretty --color=never \
            > "$log" 2>&1 || { tail -c 4000 "$log"; exit 1; }
          node scripts/node/verify/cargo-test-results.js "$log" -- "${filters[@]}"
      # Temporary, same-runner release/candidate cost experiment; removed after acceptance.
      - name: Measure equivalent release and candidate gates
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin b5d26a22cf112a74dce6ed87e55d912dd53da047
          python3 - <<'PYCODE'
          import base64, pathlib, zlib
          p = pathlib.Path('tmp/test-governance/agent-logs-regression/benchmark_agent_logs.py')
          p.write_bytes(zlib.decompress(base64.b64decode('')))
          PYCODE
          python3 tmp/test-governance/agent-logs-regression/benchmark_agent_logs.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: agent-logs-regression
          path: tmp/test-governance/agent-logs-regression
