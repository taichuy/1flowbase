name: Model pricing pagination and batch sync

on:
  workflow_dispatch:
  push:
    branches: [dev, codex/model-pricing-paged-sync]
    paths:
      - 'api/apps/api-server/src/catalog_sources/model_pricing_catalog*'
      - 'api/apps/api-server/src/catalog_sources/model_pricing_catalog/**'
      - 'api/apps/api-server/src/routes/settings/billing*'
      - 'api/apps/api-server/src/_tests/system_settings/billing_routes*'
      - 'api/apps/api-server/src/_tests/system_settings/billing_routes/**'
      - 'api/crates/control-plane-contracts/src/ports/billing_core.rs'
      - 'api/crates/storage/durable/postgres/src/billing_repository*'
      - 'api/crates/storage/durable/postgres/src/billing_repository/**'
      - 'api/crates/storage/durable/postgres/src/_tests/billing_repository_tests.rs'
      - '.github/workflows/model-pricing-pagination.yml'

permissions:
  contents: read

concurrency:
  group: model-pricing-pagination-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pricing-fixture-only
          POSTGRES_DB: pricing_fixture
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d pricing_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:pricing-fixture-only@127.0.0.1:5432/pricing_fixture
      API_DATABASE_URL: postgres://postgres:pricing-fixture-only@127.0.0.1:5432/pricing_fixture
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: model-pricing-nodebug-${{ runner.os }}-${{ hashFiles('api/Cargo.lock', 'api/**/Cargo.toml') }}
          restore-keys: |
            event-lifecycle-nodebug-${{ runner.os }}-
            notification-subscription-nodebug-${{ runner.os }}-
      - name: Freeze candidate and use runner resources
        run: |
          mkdir -p tmp/test-governance/model-pricing-pagination
          git rev-parse HEAD > tmp/test-governance/model-pricing-pagination/candidate-sha.txt
          echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
      - name: Compile adapter consumers and run contract, repository and HTTP regressions
        shell: bash
        run: |
          set -euo pipefail
          evidence=tmp/test-governance/model-pricing-pagination
          run_evidence() {
            label="$1"
            shift
            if "$@" > "$evidence/$label.log" 2>&1; then
              tail -n 8 "$evidence/$label.log"
              if [ "$label" != consumers ]; then
                python3 -c 'import re,sys; assert re.search(r"test result: ok\. [1-9][0-9]* passed;", open(sys.argv[1]).read()), "target executed zero tests"' "$evidence/$label.log"
              fi
            else
              tail -c 12000 "$evidence/$label.log"
              exit 1
            fi
          }
          run_evidence contracts cargo test --locked --manifest-path api/Cargo.toml -p control-plane-contracts --lib
          run_evidence consumers cargo check --locked --manifest-path api/Cargo.toml -p control-plane --tests
          run_evidence repository cargo test --locked --manifest-path api/Cargo.toml -p storage-durable-postgres --lib official_pricing_sync -- --test-threads=1
          run_evidence http cargo test --locked --manifest-path api/Cargo.toml -p api-server --lib _tests::billing_routes -- --test-threads=1
      - uses: actions/cache/save@v5
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-pricing-pagination-${{ github.sha }}
          path: tmp/test-governance/model-pricing-pagination
