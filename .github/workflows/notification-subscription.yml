name: Notification subscription acceptance
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact already-tested source SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  deliver-tested-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: notification-subscription-${{ inputs.candidate_sha }}
          run-id: 38738816294
          github-token: ${{ github.token }}
          path: original
      - name: Verify source and derive compact delivery binary
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat original/candidate-sha.txt)" = "$CANDIDATE_SHA"
          actual="$(sha256sum original/api-server-candidate | cut -d' ' -f1)"
          expected="$(cut -d' ' -f1 original/binary-sha256.txt)"
          test "$actual" = "$expected"
          mkdir delivery
          cp original/candidate-sha.txt delivery/
          cp original/binary-sha256.txt delivery/original-binary-sha256.txt
          cp original/api-server-candidate delivery/api-server-candidate
          strip --strip-unneeded delivery/api-server-candidate
          sha256sum delivery/api-server-candidate > delivery/binary-sha256.txt
          printf 'source_run=38738816294\noperation=strip --strip-unneeded; xz -6\n' > delivery/derivation.txt
          ls -lh original/api-server-candidate delivery/api-server-candidate
          xz -6 -T2 delivery/api-server-candidate
          ls -lh delivery/api-server-candidate.xz
      - uses: actions/upload-artifact@v6
        with:
          name: runtime-delivery-${{ inputs.candidate_sha }}
          path: delivery
          compression-level: 0
          if-no-files-found: error
