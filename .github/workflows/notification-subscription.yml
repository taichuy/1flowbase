name: Notification subscription acceptance

on:
  push:
    branches: [codex/wechat-subscription]
    paths:
      - api/**
      - .github/workflows/notification-subscription.yml
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen candidate SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: notification-subscription-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: notification-fixture-only
          POSTGRES_DB: 1flowbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d 1flowbase"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      DATABASE_URL: postgres://postgres:notification-fixture-only@127.0.0.1:5432/1flowbase
      API_DATABASE_URL: postgres://postgres:notification-fixture-only@127.0.0.1:5432/1flowbase
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Verify frozen candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: notification-subscription-nodebug-${{ runner.os }}-${{ hashFiles('api/Cargo.lock', 'api/**/Cargo.toml') }}
          restore-keys: notification-subscription-nodebug-${{ runner.os }}-
      - name: Contract and SDK acceptance
        run: |
          mkdir -p tmp/test-governance/wechat-subscription/ci
          set -o pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p extension-contracts notification_contract_tests 2>&1 | tee tmp/test-governance/wechat-subscription/ci/contracts.log
          cargo test --locked --manifest-path api/Cargo.toml -p runtime-extension-sdk notification 2>&1 | tee tmp/test-governance/wechat-subscription/ci/sdk.log
      - name: Host state and projection acceptance
        run: |
          set -o pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p control-plane --lib notifications::authorization::_tests 2>&1 | tee tmp/test-governance/wechat-subscription/ci/control-plane.log
      - name: Build canonical managed workers
        run: |
          cargo build --locked --manifest-path api/Cargo.toml -p runtime-extension-sdk --example notification_worker --example notification_authorization_worker --example managed_hook_worker --example managed_event_worker
          echo "NOTIFICATION_AUTHORIZATION_WORKER_FIXTURE=$GITHUB_WORKSPACE/api/target/debug/examples/notification_authorization_worker" >> "$GITHUB_ENV"
          echo "NOTIFICATION_WORKER_FIXTURE=$GITHUB_WORKSPACE/api/target/debug/examples/notification_worker" >> "$GITHUB_ENV"
          echo "MANAGED_HOOK_WORKER_FIXTURE=$GITHUB_WORKSPACE/api/target/debug/examples/managed_hook_worker" >> "$GITHUB_ENV"
          echo "MANAGED_EVENT_WORKER_FIXTURE=$GITHUB_WORKSPACE/api/target/debug/examples/managed_event_worker" >> "$GITHUB_ENV"
      - name: Canonical HTTP, PostgreSQL and real worker acceptance
        run: |
          set -o pipefail
          cargo test --locked --manifest-path api/Cargo.toml -p api-server --lib notification_authorization_http_encrypts_fences_late_polls_and_preserves_delivery_outcomes -- --nocapture 2>&1 | tee tmp/test-governance/wechat-subscription/ci/http-postgres.log
          cargo test --locked --manifest-path api/Cargo.toml -p api-server --lib subscription -- --nocapture 2>&1 | tee tmp/test-governance/wechat-subscription/ci/error-response.log
      - name: Build local runtime candidate
        run: |
          cargo build --locked --manifest-path api/Cargo.toml -p api-server --bin api-server
          cp api/target/debug/api-server tmp/test-governance/wechat-subscription/ci/api-server-candidate
          cp api/target/debug/examples/notification_authorization_worker tmp/test-governance/wechat-subscription/ci/notification_authorization_worker
          git rev-parse HEAD > tmp/test-governance/wechat-subscription/ci/candidate-sha.txt
          sha256sum tmp/test-governance/wechat-subscription/ci/api-server-candidate > tmp/test-governance/wechat-subscription/ci/binary-sha256.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: notification-subscription-${{ inputs.candidate_sha || github.sha }}
          if-no-files-found: error
          path: tmp/test-governance/wechat-subscription/ci
