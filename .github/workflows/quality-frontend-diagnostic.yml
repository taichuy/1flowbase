name: quality frontend diagnostic
on:
  workflow_dispatch:
    inputs:
      target_sha:
        required: true
        type: string
      test_script:
        required: true
        type: choice
        options:
          - test
          - test:coverage
          - test:page-regression
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: Run standard frontend tests with live evidence
        env:
          FRONTEND_TEST_SCRIPT: ${{ inputs.test_script }}
          TURBO_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p tmp/test-governance
          git rev-parse HEAD > tmp/test-governance/frontend-diagnostic-sha.txt
          pnpm --dir web/app "$FRONTEND_TEST_SCRIPT" 2>&1 | tee tmp/test-governance/frontend-diagnostic.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-diagnostic-${{ inputs.test_script }}
          path: tmp/test-governance
