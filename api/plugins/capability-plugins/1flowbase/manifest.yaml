manifest_version: 1
plugin_id: 1flowbase@1.0.0
version: 1.0.0
vendor: 1flowbase
display_name: 1flowbase Built-in Frontstage Blocks
description: System-owned Native React blocks available in every workspace.
source_kind: builtin
trust_level: verified_official
consumption_kind: capability_plugin
execution_mode: declarative_only
slot_codes: [frontend_block]
binding_targets: [workspace]
selection_mode: auto_activate
minimum_host_version: 0.2.6
contract_version: 1flowbase.capability/v1
schema_version: 1flowbase.plugin.manifest/v1
permissions:
  network: none
  secrets: none
  storage: none
  mcp: none
  subprocess: deny
runtime:
  protocol: stdio_json
  entry: index.js
block_contributions:
  - contribution_code: frontstage.js-ui-block
    title: 代码区块
    runtime: native_react
    entry: index.js
    code_template: |
      import React, { useState } from 'react';
      import type { BlockComponentProps } from '@1flowbase/block-sdk';
      import { Surface } from '@1flowbase/native-components';

      export default function ExampleBlock({ ctx }: BlockComponentProps) {
        const [count, setCount] = useState(0);
        return (
          <Surface className="example-block" style={{ padding: 16 }}>
            <h2>代码示例区块</h2>
            <p>Workspace: {ctx.workspace.name ?? ctx.workspace.id}</p>
            <button type="button" onClick={() => setCount((value) => value + 1)}>
              Clicked {count} times
            </button>
          </Surface>
        );
      }
    code_template_version: 4.0.0
    code_template_language: tsx
    code_modules:
      - source: "@1flowbase/block-sdk"
        version: "1.0.0"
        exports: [blockSdkVersion]
        browser_asset:
          path: "browser-assets/block-sdk.js"
          sha256: "89d33c09ed7013cf4f60f07b5b4b511686e57e011867ec7656f8bc3538c0298f"
        type_declarations: |
          declare module '@1flowbase/block-sdk' {
            export type BlockContextRecord = Record<string, unknown>;
            export interface BlockContextIdentity {
              readonly id: string;
              readonly displayName?: string;
            }
            export interface BlockContextEntity {
              readonly id: string;
              readonly name?: string;
            }
            export interface BlockContextPage {
              readonly id: string;
              readonly route: string;
              readonly title?: string;
            }
            export interface BlockContext {
              readonly currentUser: BlockContextIdentity | null;
              readonly workspace: BlockContextEntity;
              readonly application: BlockContextEntity;
              readonly page: BlockContextPage;
              readonly inputs: Readonly<BlockContextRecord>;
              readonly params: Readonly<BlockContextRecord>;
              readonly props: Readonly<BlockContextRecord>;
              readonly theme: Readonly<BlockContextRecord>;
              readonly ui: Readonly<BlockContextRecord>;
            }
            export interface BlockComponentProps {
              readonly ctx: BlockContext;
            }
          }
      - source: "@1flowbase/native-components"
        version: "1.0.0"
        exports: [Surface]
        browser_asset:
          path: "browser-assets/native-components.js"
          sha256: "00c568e229c81c4c18af20961ec14663efa6f7460c0134708391746d7e8ec2e0"
        type_declarations: |
          declare module '@1flowbase/native-components' {
            import type { ComponentType, HTMLAttributes, ReactNode } from 'react';
            export interface SurfaceProps extends HTMLAttributes<HTMLElement> {
              readonly as?: string;
              readonly children?: ReactNode;
            }
            export const Surface: ComponentType<SurfaceProps>;
          }
        components:
          - component_code: surface
            export_name: Surface
            description: "Native React surface that forwards standard DOM className, style, event, aria and data props."
            props:
              - name: as
                type: string
                description: "HTML element name; defaults to section."
              - name: className
                type: string
                description: "Standard DOM class name scoped by the block ShadowRoot."
              - name: style
                type: "import('react').CSSProperties"
                description: "Standard React inline style object."
              - name: children
                type: "import('react').ReactNode"
                description: "Native React children."
            limitations: ["The host controls the React singleton and ShadowRoot lifecycle."]
            examples:
              - title: "Interactive surface"
                code: "<Surface className=\"card\" onClick={() => setOpen(true)}>Open</Surface>"
            insert_snippet: "<Surface className=\"card\">Content</Surface>"
    context_contract:
      primitives: [text, image, link, button, rich_text, data_record]
      input_schema:
        type: object
        additionalProperties: true
    permissions:
      network: none
      storage: none
      secrets: none
    ui_capabilities: [responsive, configurable, theming, data_binding]
