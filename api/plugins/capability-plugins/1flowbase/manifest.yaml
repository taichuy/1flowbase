                description: "Native React children."
            limitations: ["The host controls the React singleton and ShadowRoot lifecycle."]
            examples:
              - title: "Interactive surface"
                code: "<Surface className=\"card\" onClick={() => setOpen(true)}>Open</Surface>"
            insert_snippet: "<Surface className=\"card\">Content</Surface>"
          - component_code: scrollable_surface
            export_name: ScrollableSurface
            description: "Native React scroll surface with contained overflow inside the block ShadowRoot."
            props:
