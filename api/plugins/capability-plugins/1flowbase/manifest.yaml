block_contributions:
  - contribution_code: frontstage.js-ui-block
    title: 代码区块
    runtime: native_react
    entry: index.js
    code_template: |
      import { useState } from 'react';
      import { Button, Typography } from 'antd';
      import 'tailwindcss';
      import type { BlockComponentProps } from '@1flowbase/block-sdk';
      import { Surface } from '@1flowbase/native-components';

      export default function ExampleBlock({ ctx }: BlockComponentProps) {
        const [count, setCount] = useState(0);
        return (
          <Surface className="grid gap-4 p-4">
            <Typography.Title level={3}>代码示例区块</Typography.Title>
            <Typography.Text>
              Workspace: {ctx.workspace.name ?? ctx.workspace.id}
            </Typography.Text>
            <Button type="primary" onClick={() => setCount((value) => value + 1)}>
              Clicked {count} times
            </Button>
          </Surface>
        );
      }
    code_template_version: 6.0.0
    code_template_language: tsx
    code_modules:
      - source: "react"
        version: "19.2.5"
        exports: [default, Activity, Children, Component, Fragment, Profiler, PureComponent, StrictMode, Suspense, cache, cacheSignal, cloneElement, createContext, createElement, createRef, forwardRef, isValidElement, lazy, memo, startTransition, use, useActionState, useCallback, useContext, useDebugValue, useDeferredValue, useEffect, useEffectEvent, useId, useImperativeHandle, useInsertionEffect, useLayoutEffect, useMemo, useOptimistic, useReducer, useRef, useState, useSyncExternalStore, useTransition, version]
        binding: host
        type_declarations: |
          declare module 'react' {
            export type ReactNode = unknown;
            export type CSSProperties = Record<string, string | number | undefined>;
            export type ComponentType<P = {}> = (props: P) => ReactNode;
            export type ElementType = string | ComponentType<any>;
            export interface HTMLAttributes<T> { className?: string; style?: CSSProperties; children?: ReactNode; [key: string]: unknown; }
            export const Fragment: ComponentType<{ children?: ReactNode }>;
            export function createElement(type: ElementType, props?: Record<string, unknown> | null, ...children: ReactNode[]): ReactNode;
            export function useState<T>(initial: T | (() => T)): [T, (value: T | ((previous: T) => T)) => void];
            export function useEffect(effect: () => void | (() => void), dependencies?: readonly unknown[]): void;
            export function useMemo<T>(factory: () => T, dependencies: readonly unknown[]): T;
            export function useCallback<T extends (...args: any[]) => any>(callback: T, dependencies: readonly unknown[]): T;
            export function useRef<T>(initial: T): { current: T };
            export function useSyncExternalStore<T>(subscribe: (listener: () => void) => () => void, getSnapshot: () => T): T;
            const React: { createElement: typeof createElement; Fragment: typeof Fragment };
            export default React;
          }
