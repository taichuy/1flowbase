manifest_version: 1
plugin_id: 1flowbase@1.0.0
version: 1.0.0
vendor: 1flowbase
display_name: 1flowbase Built-in Frontstage Blocks
description: System-owned frontend block containers available in every workspace.
source_kind: builtin
trust_level: verified_official
consumption_kind: capability_plugin
execution_mode: declarative_only
slot_codes:
  - frontend_block
binding_targets:
  - workspace
selection_mode: auto_activate
minimum_host_version: 0.2.6
contract_version: 1flowbase.capability/v1
schema_version: 1flowbase.plugin.manifest/v1
permissions:
  network: none
  secrets: none
  storage: none
  mcp: none
  subprocess: deny
runtime:
  protocol: stdio_json
  entry: index.js
block_contributions:
  - contribution_code: frontstage.js-ui-block
    title: 代码区块
    runtime: iframe
    entry: index.js
    code_template: |
      import type {
        BlockContext,
        BlockModule,
        BlockResult
      } from '@1flowbase/block-sdk';

      import {
        Stack,
        Text,
        Title
      } from '@1flowbase/block-renderer/antd-facade';

      async function main(_ctx: BlockContext): Promise<BlockResult> {
        return {
          view: (
            <Stack>
              <Title>代码示例区块</Title>
              <Text>从接口连接器插入函数，然后在 main 中调用。</Text>
            </Stack>
          ),
          outputs: {}
        };
      }

      /**
       * @1flowbase-context
       * inputs: 无
       * interfaces: 无
       * outputs: 无
       */
      export default {
        main
      } satisfies BlockModule;
    code_template_version: 2.0.0
    code_template_language: tsx
    code_modules:
      - source: "@1flowbase/block-sdk"
        type_declarations: |
          declare module '@1flowbase/block-sdk' {
            export type BlockContextRecord = Record<string, unknown>;
            export interface BlockContextIdentity {
              readonly id: string;
              readonly displayName?: string;
            }
            export interface BlockContextEntity {
              readonly id: string;
              readonly name?: string;
            }
            export interface BlockContextPage {
              readonly id: string;
              readonly route: string;
              readonly title?: string;
            }
            export interface BlockInterfaceRequest {
              readonly path?: BlockContextRecord;
              readonly query?: BlockContextRecord;
              readonly headers?: BlockContextRecord;
              readonly body?: unknown;
            }
            export interface BlockInterfaceDescriptor {
              readonly interfaceId: string;
              readonly schemaDigest: string;
            }
            export interface BlockContextInterfaces {
              call<TResponse = unknown>(descriptor: BlockInterfaceDescriptor, request?: BlockInterfaceRequest): Promise<TResponse>;
              stream<TEvent = unknown>(descriptor: BlockInterfaceDescriptor, request?: BlockInterfaceRequest): AsyncIterable<TEvent>;
            }
            export interface BlockContextEvents {
              emit(event: string, payload?: BlockContextRecord): void;
            }
            export interface BlockContextTheme {
              readonly mode: 'light' | 'dark';
              readonly tokens: BlockContextRecord;
            }
            export interface BlockContextUi {
              readonly locale?: string;
              readonly density?: 'compact' | 'comfortable';
            }
            export interface BlockContext<TInputs extends BlockContextRecord = BlockContextRecord> {
              readonly currentUser: BlockContextIdentity | null;
              readonly workspace: BlockContextEntity;
              readonly application: BlockContextEntity;
              readonly page: BlockContextPage;
              readonly inputs: Readonly<TInputs>;
              readonly params: BlockContextRecord;
              readonly props: BlockContextRecord;
              readonly state: BlockContextRecord;
              patch(patch: BlockContextRecord): void | Promise<void>;
              readonly interfaces: BlockContextInterfaces;
              readonly events: BlockContextEvents;
              readonly theme: BlockContextTheme;
              readonly ui: BlockContextUi;
            }
            export interface BlockResult<TOutputs extends BlockContextRecord = BlockContextRecord> {
              readonly view: unknown;
              readonly outputs: TOutputs;
            }
            export type BlockMain<
              TInputs extends BlockContextRecord = BlockContextRecord,
              TOutputs extends BlockContextRecord = BlockContextRecord
            > = (ctx: BlockContext<TInputs>) => BlockResult<TOutputs> | Promise<BlockResult<TOutputs>>;
            export interface BlockModule<
              TInputs extends BlockContextRecord = BlockContextRecord,
              TOutputs extends BlockContextRecord = BlockContextRecord
            > {
              readonly main: BlockMain<TInputs, TOutputs>;
            }
          }
      - source: "@1flowbase/block-renderer/antd-facade"
        type_declarations: |
          declare module '@1flowbase/block-renderer/antd-facade' {
            export interface FacadeProps {
              readonly key?: unknown;
              readonly props?: unknown;
              readonly style?: unknown;
              readonly permissions?: unknown;
              readonly children?: unknown;
              readonly [key: string]: unknown;
            }
            export type FacadeComponent = (props?: FacadeProps | string | number | boolean | null) => unknown;
            export const Stack: FacadeComponent;
            export const Inline: FacadeComponent;
            export const Grid: FacadeComponent;
            export const Divider: FacadeComponent;
            export const Text: FacadeComponent;
            export const Title: FacadeComponent;
            export const Caption: FacadeComponent;
            export const Badge: FacadeComponent;
            export const Table: FacadeComponent;
            export const Descriptions: FacadeComponent;
            export const Empty: FacadeComponent;
            export const Alert: FacadeComponent;
            export const Form: FacadeComponent;
            export const FormItem: FacadeComponent;
            export const Input: FacadeComponent;
            export const Textarea: FacadeComponent;
            export const Select: FacadeComponent;
            export const Checkbox: FacadeComponent;
            export const Switch: FacadeComponent;
            export const DatePicker: FacadeComponent;
            export const NumberInput: FacadeComponent;
            export const Button: FacadeComponent;
            export const IconButton: FacadeComponent;
            export const Modal: FacadeComponent;
          }
    context_contract:
      primitives:
        - text
        - image
        - link
        - button
        - rich_text
        - data_record
      input_schema:
        type: object
        additionalProperties: true
    permissions:
      network: none
      storage: none
      secrets: none
    ui_capabilities:
      - responsive
      - configurable
      - theming
      - data_binding
