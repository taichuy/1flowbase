              - name: style
                type: "import('react').CSSProperties"
                description: "Standard React inline style object."
              - name: children
                type: "import('react').ReactNode"
                description: "Native React children."
            limitations: ["Scrolling remains inside the block-owned surface."]
            examples:
              - title: "Scrollable content"
                code: "<ScrollableSurface style={{ maxHeight: 320 }}>Content</ScrollableSurface>"
            insert_snippet: "<ScrollableSurface style={{ maxHeight: 320 }}>Content</ScrollableSurface>"
