            export_name: VditorEditor
            description: "Unified Vditor editor with edit modes, split preview, outline and governed file uploads."
            props:
              - name: value
                type: string
                required: true
                description: "Current Markdown value."
              - name: onChange
                type: "(value: string) => void"
                required: true
                description: "Receives Markdown changes."
              - name: api
                type: RichTextApi
                description: "BlockContext api capability used for governed uploads to the default file table."
              - name: mode
                type: VditorEditorMode
                description: "Initial IR, WYSIWYG or source editing mode."
              - name: previewMode
                type: VditorPreviewMode
                description: "Initial split preview or editor-only layout."
            limitations: ["Raw Vditor construction, arbitrary CDN or upload URLs, and browser cache ownership are not exposed."]
            examples:
              - title: "Full Vditor field"
                code: "<VditorEditor api={ctx.api} value={markdown} onChange={setMarkdown} />"
            insert_snippet: "<VditorEditor api={ctx.api} value={markdown} onChange={setMarkdown} />"
