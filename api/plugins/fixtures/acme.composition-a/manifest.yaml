manifest_version: 2
schema_version: 1flowbase.plugin.manifest/v2
plugin_id: acme.composition-a
version: 1.0.0
publisher_namespace: acme
vendor: Acme
display_name: Composition A
description: Explicit managed contribution activation fixture
source_kind: uploaded
trust_level: unverified
consumption_kind: runtime_extension
execution_mode: process_per_call
slot_codes: []
binding_targets: [workspace]
selection_mode: assignment_then_select
minimum_host_version: 0.1.0
contract_version: 1flowbase.extension-bus/v1
permissions:
  network: none
  secrets: none
  storage: host_managed
  mcp: none
  subprocess: deny
runtime:
  protocol: stdio_json
  entry: bin/worker.py
  limits:
    timeout_ms: 30000
data_models:
  - contribution_version: 1flowbase.plugin-data-model/v1
    storage_binding: main
    owned_collections:
      - collection_code: processed_models
        fields:
          - field_code: model_id
            field_type: uuid
          - field_code: title
            field_type: text
managed:
  module:
    bus_version: v1
    module_id: acme.composition-a
    module_version: 1.0.0
    module_kind: runtime
    contributions:
      - contribution_id: acme.composition-a.first
        contributor_module_id: acme.composition-a
        point_id: 1flowbase.model-definitions.create.before
        contract_version: 1
        required_permissions: [hook.model_definitions.create.before]
        mode: append
      - contribution_id: acme.composition-a.second
        contributor_module_id: acme.composition-a
        point_id: 1flowbase.model-definitions.create.before
        contract_version: 1
        required_permissions: [hook.model_definitions.create.before]
        mode: append
        ordering:
          after: [acme.composition-a.first]
      - contribution_id: acme.composition-a.data
        contributor_module_id: acme.composition-a
        point_id: 1flowbase.plugin-data.owned-collection
        contract_version: 1flowbase.plugin-data-model/v1
        required_permissions: [plugin_data.owned.write]
        mode: append
  execution_bindings:
    - contribution_id: acme.composition-a.first
      execution_mode: process_per_call
      runtime:
        protocol: stdio_json
        entry: bin/worker.py
      handler: first
    - contribution_id: acme.composition-a.second
      execution_mode: process_per_call
      runtime:
        protocol: stdio_json
        entry: bin/worker.py
      handler: second
    - contribution_id: acme.composition-a.data
      execution_mode: declarative_only
      runtime:
        protocol: stdio_json
        entry: manifest.yaml
      handler: owned_collections
      payload:
        kind: data_models
