[package]
name="api-public-gateway"
version.workspace=true
edition.workspace=true
rust-version.workspace=true
license.workspace=true
publish=false
[features]
test-support=["api-host-kernel/test-support"]
[dependencies]
base16ct.workspace = true
opentelemetry-proto.workspace = true
prost.workspace = true
url.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["multipart", "ws"] }
base64.workspace = true
futures-util.workspace = true
form_urlencoded = "1.2.2"
http-body = "1.1.0"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
time.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite-deflate = { package = "tokio-tungstenite", git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186", default-features = false, features = ["handshake", "deflate"] }
tokio-stream = "0.1.19"
tracing.workspace = true
utoipa.workspace = true
uuid.workspace = true
zip.workspace = true
api-host-kernel={path="../kernel"}
domain = { path = "../../domain" }
control-plane = { path = "../../control-plane" }
control-plane-contracts = { path = "../../control-plane-contracts" }
extension-contracts = { path = "../../extension-contracts" }
orchestration-runtime = { path = "../../orchestration-runtime" }
runtime-core = { path = "../../runtime-core" }
interface-runtime = { path = "../../interface-runtime" }
plugin-framework = { path = "../../plugin-framework" }
storage-durable-postgres = { path = "../../storage/durable/postgres" }
storage-ephemeral = { path = "../../storage/ephemeral" }
storage-object = { path = "../../storage/object" }
[dev-dependencies]
api-host-kernel = { path = "../kernel", features = ["test-support"] }
postgres-test-support={path="../../postgres-test-support"}
tokio-tungstenite = "0.29.0"
