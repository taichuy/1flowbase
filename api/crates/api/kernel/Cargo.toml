publish = false

[features]
test-support=["dep:postgres-test-support"]

[dependencies]
tokio-stream = "0.1.19"
postgres-test-support = { path = "../../postgres-test-support", optional = true }
rand.workspace = true
base16ct.workspace = true
opentelemetry-proto.workspace = true
prost.workspace = true
percent-encoding.workspace = true
url.workspace = true
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["multipart", "ws"] }
axum-extra.workspace = true
base64.workspace = true
flate2.workspace = true
futures-util.workspace = true
form_urlencoded = "1.2.2"
hmac.workspace = true
http-body = "1.1.0"
jsonschema.workspace = true
rand_core.workspace = true
regex.workspace = true
rust_decimal.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
sysinfo.workspace = true
sqlx.workspace = true
tar.workspace = true
time.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic-types.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
uuid.workspace = true
zip.workspace = true
domain = { path = "../../domain" }
control-plane = { path = "../../control-plane" }
control-plane-contracts = { path = "../../control-plane-contracts" }
extension-contracts = { path = "../../extension-contracts" }
orchestration-runtime = { path = "../../orchestration-runtime" }
runtime-core = { path = "../../runtime-core" }
access-control = { path = "../../access-control" }
interface-runtime = { path = "../../interface-runtime" }
plugin-framework = { path = "../../plugin-framework" }
storage-durable-postgres = { path = "../../storage/durable/postgres" }
storage-ephemeral = { path = "../../storage/ephemeral" }
storage-object = { path = "../../storage/object" }
runtime-extension-host = { path = "../../runtime-extension-host" }
runtime-profile = { path = "../../runtime-profile" }


[target.'cfg(unix)'.dependencies]
libc="0.2.190"
[target.'cfg(windows)'.dependencies]
windows-sys={version="0.61.2",features=["Win32_Foundation","Win32_Globalization","Win32_Security","Win32_System_Environment","Win32_Storage_FileSystem","Win32_System_JobObjects","Win32_System_Pipes","Win32_System_SystemInformation","Win32_System_Threading"]}
[dev-dependencies]
postgres-test-support={path="../../postgres-test-support"}
