chacha20poly1305.workspace = true
hmac.workspace = true
jsonschema.workspace = true
access-control = { path = "../access-control" }
control-plane-contracts = { path = "../control-plane-contracts" }
domain = { path = "../domain" }
extension-contracts = { path = "../extension-contracts" }
observability = { path = "../observability" }
orchestration-runtime = { path = "../orchestration-runtime" }
plugin-framework = { path = "../plugin-framework" }
runtime-profile = { path = "../runtime-profile" }
rand_core.workspace = true
regex.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
storage-object = { path = "../storage/object" }
