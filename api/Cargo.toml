[workspace]
members = [
  "apps/api-server",
  "crates/domain",
  "crates/control-plane-contracts",
  "crates/control-plane",
  "crates/orchestration-runtime",
  "crates/runtime-core",
  "crates/runtime-extension-host",
  "crates/runtime-extension-sdk",
  "crates/runtime-profile",
  "crates/access-control",
  "crates/interface-runtime",
  "crates/control-plane-test-support",
  "crates/control-plane-postgres-tests",
  "crates/plugin-framework",
  "crates/extension-contracts",
  "crates/extension-package-runtime",
  "crates/storage/durable/core",
  "crates/storage/durable/postgres",
  "crates/storage/ephemeral",
  "crates/storage/object",
  "crates/observability",
  "crates/postgres-test-support"
]
resolver = "2"

[workspace.package]
rust-version = "1.99"
edition = "2021"
license = "MIT"
version = "0.5.7"

[workspace.dependencies]
base16ct = "1.0.0"
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
aws-config = { version = "1.12.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["rt-tokio"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
flate2 = "1.1.10"
zstd = "0.14.2"
futures-util = "0.3.34"
hmac = "0.13.0"
http = "1.5.0"
jsonschema = "0.58.6"
moka = { version = "0.12.16", features = ["future"] }
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "with-serde"] }
prost = "=0.14.4"
percent-encoding = "2.3.2"
rand_core = { version = "0.10.1" }
rand = "0.10.3"
rand_regex = { version = "0.19.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "form"] }
regex = "1.13.1"
regex-syntax = "0.8.11"
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
semver = "1.0.28"
sha2 = "0.11.1"
# Keep upstream's sequential default: parallel /proc scans spend more CPU on
# Rayon scheduling than on our narrow observations (sysinfo issue #1352).
sysinfo = "0.39.6"
# The native template transaction owner requires exact savepoint-depth checks.
sqlx-core = { version = "0.9.0", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "uuid", "macros", "time", "json", "migrate"] }
tar = "0.4.46"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
time-tz = "2.0.0"
tokio = { version = "1.53.3", features = ["full"] }
tonic-types = { version = "=0.14.6", default-features = false }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["serde", "v7"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[profile.dev]
debug = 1

# The composition root is expensive to compile on constrained development VMs.
# Preserve backtrace file/line information without module-level debug metadata.
[profile.dev.package.api-server]
debug = "line-tables-only"

# Gateway history and durable facts hash their complete input in development too.
# Keep SHA-256 compression optimized without disabling application debug checks.
[profile.dev.package.sha2]
opt-level = 3

[profile.test]
debug = 1

# Managed hook admission hashes installed worker bytes inside the invocation's
# 1 s observer finalization budget. Keep that SHA-256 path representative of
# optimized production hashing even when the rest of the test binary is debug.
[profile.test.package.sha2]
opt-level = 3
