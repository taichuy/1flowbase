[package]
name = "api-server"
version = "0.5.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Builds only the Root #1805 consumer authenticity fixture. The normal lib-test target keeps
# the complete API-server suite; this narrow target prevents a fresh QA run from compiling every
# unrelated API test module before it can exercise the persisted egress path.
root-1805-consumer-fixture = []

responses-history-migration = ["control-plane/responses-history-migration", "storage-durable-postgres/responses-history-migration"]

[[bin]]
name = "responses-history-migrate"
path = "src/bin/responses_history_migrate/main.rs"
required-features = ["responses-history-migration"]

[dependencies]
rand.workspace = true
base16ct.workspace = true
opentelemetry-proto.workspace = true
prost.workspace = true
percent-encoding.workspace = true
url.workspace = true
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["multipart", "ws"] }
axum-extra.workspace = true
base64.workspace = true
flate2.workspace = true
futures-util.workspace = true
form_urlencoded = "1.2.2"
hmac.workspace = true
http-body = "1.1.0"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
jsonschema.workspace = true
rand_core.workspace = true
regex.workspace = true
rust_decimal.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
sysinfo.workspace = true
sqlx.workspace = true
tar.workspace = true
time.workspace = true
thiserror.workspace = true
tokio.workspace = true
# Use Codex's pinned RFC 7692 codec only at the Responses ingress boundary.
tokio-tungstenite-deflate = { package = "tokio-tungstenite", git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186", default-features = false, features = ["handshake"] }
tungstenite-deflate = { package = "tungstenite", git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f", default-features = false, features = ["deflate"] }
tokio-stream = "0.1.19"
tonic-types.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
uuid.workspace = true
zip.workspace = true
domain = { path = "../../crates/domain" }
control-plane = { path = "../../crates/control-plane" }
control-plane-contracts = { path = "../../crates/control-plane-contracts" }
extension-contracts = { path = "../../crates/extension-contracts" }
orchestration-runtime = { path = "../../crates/orchestration-runtime" }
runtime-core = { path = "../../crates/runtime-core" }
access-control = { path = "../../crates/access-control" }
interface-runtime = { path = "../../crates/interface-runtime" }
plugin-framework = { path = "../../crates/plugin-framework" }
storage-durable-postgres = { path = "../../crates/storage/durable/postgres" }
storage-ephemeral = { path = "../../crates/storage/ephemeral" }
storage-object = { path = "../../crates/storage/object" }
observability = { path = "../../crates/observability" }
runtime-extension-host = { path = "../../crates/runtime-extension-host" }
runtime-profile = { path = "../../crates/runtime-profile" }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { version = "0.7.0", features = ["background_threads"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"
serde_yaml = "0.9.34+deprecated"
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
postgres-test-support = { path = "../../crates/postgres-test-support" }
